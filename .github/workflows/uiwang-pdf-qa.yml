name: Uiwang official PDF parser regression

on:
  pull_request:
    paths:
      - 'pipeline/ingest_council_expense.py'
      - 'pipeline/qa_council_publication.py'
      - 'pipeline/test_uiwang_pdf.py'
      - '.github/workflows/uiwang-pdf-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uiwang-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modified parser files
        run: python -m py_compile pipeline/ingest_council_expense.py pipeline/qa_council_publication.py pipeline/test_uiwang_pdf.py
      - name: Run official Uiwang fixtures
        run: PYTHONPATH=pipeline python -m unittest -v pipeline/test_uiwang_pdf.py
      - name: Run unchanged full-reconciliation safeguards
        run: PYTHONPATH=pipeline python -m unittest -v pipeline/test_full_reconciliation_p0.py
