name: One-shot P1 Ansan Hwaseong verified expense source-only release

on:
  push:
    branches: [release/p1-ansan-hwaseong-source-only-20261113]
    paths: ['.github/workflows/p1-source-release-once.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: p1-ansan-hwaseong-partial-release-20261113
  cancel-in-progress: false

jobs:
  source-only-staging-and-site-drift-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p1-ansan-hwaseong-source-only-20261113
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current site and council source QA dependencies
        run: python -m pip install 'openpyxl>=3.1,<4' 'pypdf>=5,<7' xlrd
      - name: Download independently source-pinned official files and exception review artifacts
        shell: bash
        run: |
          set -euo pipefail
          for source in ansan hwaseong; do
            mkdir -p "$RUNNER_TEMP/p1-release/$source"
            gh run download 43400481730 --repo "$GITHUB_REPOSITORY" \
              --name "p1-full-audit-$source" \
              --dir "$RUNNER_TEMP/p1-release/$source"
            test -s "$RUNNER_TEMP/p1-release/$source/$source-source-only-candidate.json"
            test -s "$RUNNER_TEMP/p1-release/$source/$source-discovery-candidate.json"
            test -s "$RUNNER_TEMP/p1-release/$source/$source-source-exceptions.json"
            test -s "$RUNNER_TEMP/p1-release/$source/$source-subset-manifest.json"
          done
      - name: Validate unchanged baseline source and capture existing public HTML
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/quality_gate.py
          mkdir -p "$RUNNER_TEMP/p1-before"
          python pipeline/build_site.py --output "$RUNNER_TEMP/p1-before/index.html"
      - name: Independently verify 5566 source rows, 11 original anomalies and stage only source JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pipeline/validate_p1_source_release_once.py
          PYTHONPATH=pipeline python pipeline/validate_p1_source_release_once.py
      - name: Verify financial QA, unchanged rankings and byte-comparable site build
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/regression_checks.py
          python pipeline/quality_gate.py
          mkdir -p "$RUNNER_TEMP/p1-after"
          python pipeline/build_site.py --output "$RUNNER_TEMP/p1-after/index.html"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          before=json.loads((root/"p1-before/build-meta.json").read_text(encoding="utf-8"))
          after=json.loads((root/"p1-after/build-meta.json").read_text(encoding="utf-8"))
          if (before["dataset_total"]!=1356
              or after["dataset_total"]!=1356):
              raise SystemExit("STOP: publication entity count differs from 1356")
          oldhtml=(root/"p1-before/index.html").read_text(encoding="utf-8")
          newhtml=(root/"p1-after/index.html").read_text(encoding="utf-8")
          def field(text,start,stop):
              if start not in text or stop not in text.split(start,1)[1]:
                  raise SystemExit("STOP: missing original static-site payload boundary "+start)
              return json.loads(text.split(start,1)[1].split(stop,1)[0])
          olddata=field(oldhtml,"const DATA=",",STATS=")
          newdata=field(newhtml,"const DATA=",",STATS=")
          if olddata!=newdata or len(olddata)!=1356:
              raise SystemExit("STOP: published venue, coordinates or ranked scores changed")
          origins1=field(oldhtml,",ORIGINS=",";")
          origins2=field(newhtml,",ORIGINS=",";")
          if origins1!=origins2:
              raise SystemExit("STOP: public origin/region map changed")
          stats1=field(oldhtml,",STATS=",",ORIGINS=")
          stats2=field(newhtml,",STATS=",",ORIGINS=")
          source_health1=stats1.get("source_health",{})
          source_health2=stats2.get("source_health",{})
          for source,prior,proposed in (("ansan",658,2991),("hwaseong",840,4073)):
              old=source_health1.get(source,{})
              new=source_health2.get(source,{})
              if old.get("raw_rows")!=prior or new.get("raw_rows")!=proposed:
                  raise SystemExit("STOP: exact permitted partial source-health delta not observed for "+source)
              for k in ("candidate_count","published_count"):
                  if old.get(k)!=new.get(k):
                      raise SystemExit("STOP: ranking health changed for "+source)
              allowed={"raw_rows","discovery_posts","discovery_attachments"}
              if ({k:v for k,v in old.items() if k not in allowed}
                  !={k:v for k,v in new.items() if k not in allowed}):
                  raise SystemExit("STOP: unexpected source-health side effect for "+source)
              source_health1.pop(source,None)
              source_health2.pop(source,None)
          if stats1!=stats2:
              raise SystemExit("STOP: site summary beyond two specified sources changed")
          story1=field(oldhtml,"const STORY=",";\n  const root=")
          story2=field(newhtml,"const STORY=",";\n  const root=")
          story1.pop("generated_at_utc",None)
          story2.pop("generated_at_utc",None)
          if story1!=story2:
              raise SystemExit("STOP: public data story changed")
          def normalized(text,meta):
              prefix,rest=text.split("const DATA=",1)
              text=prefix+"const DATA=__AUDITED_DATA__;\nconst $="+rest.split(";\nconst $=",1)[1]
              prefix,rest=text.split("const STORY=",1)
              text=prefix+"const STORY=__AUDITED_STORY__;\n  const root="+rest.split(";\n  const root=",1)[1]
              return text.replace(meta["built_at"],"__AUDITED_BUILT_AT__")
          if normalized(oldhtml,before)!=normalized(newhtml,after):
              raise SystemExit("STOP: other public HTML changes beyond timestamp/source-health")
          print(json.dumps({"entities_before":1356,"entities_after":1356,
                            "public_ranked_venues_unchanged":True,
                            "new_source_only_expense_rows":5566,
                            "separately_held_original_expenses":11,
                            "total_source_amount_krw":891870199,
                            "published_restaurants_added":0,
                            "full_source_complete":False},ensure_ascii=False))
          PY
      - name: Commit only four verified raw/discovery JSON files; remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            data/raw/ansan_expense.json \
            data/raw/hwaseong_expense.json \
            reports/capital-backfill-discovery-ansan.json \
            reports/capital-backfill-discovery-hwaseong.json
          git rm -- .github/workflows/p1-source-release-once.yml \
                    pipeline/validate_p1_source_release_once.py
          git commit -m 'data(p1): release 5566 SHA-verified source-only expense records; retain 11 original exceptions'
          git push origin HEAD:release/p1-ansan-hwaseong-source-only-20261113
