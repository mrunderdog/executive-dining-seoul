name: Targeted discovery branch smoke

on:
  push:
    branches:
      - fix/discovery-zero-batch-2
    paths:
      - 'pipeline/capital_backfill.py'
      - 'pipeline/regression_checks.py'
      - '.github/workflows/discovery-branch-smoke.yml'

concurrency:
  group: targeted-discovery-branch-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install spreadsheet parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Regression checks
        run: python pipeline/regression_checks.py
      - name: Targeted discoveries
        shell: bash
        run: |
          set -e
          for SOURCE in paju icheon ansan; do
            echo "===== $SOURCE ====="
            python pipeline/capital_backfill.py --since 2024-12 --source "$SOURCE"
            python - "$SOURCE" <<'PY'
          import json,sys
          from pathlib import Path
          s=sys.argv[1]
          p=Path(f"reports/capital-backfill-discovery-{s}.json")
          d=json.loads(p.read_text())
          posts=d.get("posts",[])
          print(json.dumps({
            "source":s,
            "posts":len(posts),
            "attachments":sum(len(x.get("attachments",[])) for x in posts),
            "sample":[
              {
                "title":x.get("title"),
                "post_url":x.get("post_url"),
                "attachments":x.get("attachments",[])[:2],
                "listing_url":x.get("listing_url"),
                "error":x.get("error"),
              }
              for x in posts[:3]
            ],
          },ensure_ascii=False))
          PY
          done

      - name: Diagnose Ansan listing markup
        shell: bash
        run: |
          python - <<'PY'
          from pipeline.capital_backfill import fetch_text
          url="https://www.ansan.go.kr/council/common/bbs/selectPageListBbs.do?bbs_code=B0406"
          doc=fetch_text(url)
          needle="2026년도 2분기 업무추진비"
          i=doc.find(needle)
          print("ANSAN_MARKUP_INDEX", i)
          print(doc[max(0,i-1600):i+2200] if i >= 0 else doc[:4000])
          PY
