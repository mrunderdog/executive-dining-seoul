name: Targeted discovery branch smoke

on:
  push:
    branches:
      - fix/discovery-zero-batch-2
    paths:
      - 'pipeline/capital_backfill.py'
      - 'pipeline/regression_checks.py'
      - '.github/workflows/discovery-branch-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install spreadsheet parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Regression checks
        run: python pipeline/regression_checks.py
      - name: Targeted discoveries
        shell: bash
        run: |
          set -e
          for SOURCE in paju icheon ansan; do
            echo "===== $SOURCE ====="
            python pipeline/capital_backfill.py --since 2024-12 --source "$SOURCE"
            python - "$SOURCE" <<'PY'
          import json,sys
          from pathlib import Path
          s=sys.argv[1]
          p=Path(f"reports/capital-backfill-discovery-{s}.json")
          d=json.loads(p.read_text())
          posts=d.get("posts",[])
          print(json.dumps({
            "source":s,
            "posts":len(posts),
            "attachments":sum(len(x.get("attachments",[])) for x in posts),
            "sample":[
              {
                "title":x.get("title"),
                "post_url":x.get("post_url"),
                "attachments":x.get("attachments",[])[:2],
                "listing_url":x.get("listing_url"),
                "error":x.get("error"),
              }
              for x in posts[:3]
            ],
          },ensure_ascii=False))
          PY
          done

      - name: End-to-end Paju ingestion
        shell: bash
        run: |
          set -e
          python pipeline/capital_backfill.py --since 2024-12 --source paju
          python pipeline/ingest_council_expense.py --source paju
          python pipeline/repair_raw_dates.py --source paju --min-valid 0.95
          python pipeline/build_source_candidates.py --source paju --top 30
          python - <<'PY'
          import json
          d=json.load(open("data/raw/paju_expense.json",encoding="utf-8"))
          c=json.load(open("reports/paju-executive-candidates.json",encoding="utf-8"))
          rows=d.get("rows",[])
          tx=[r for r in rows if str(r.get("merchant") or "").strip()]
          print(json.dumps({
            "rows":len(rows),
            "files":len(d.get("files",[])),
            "errors":len(d.get("errors",[])),
            "amount_coverage":(
              sum(isinstance(r.get("amount"),int) and r["amount"]>=0 for r in tx)/len(tx)
              if tx else 0
            ),
            "candidate_count":c.get("candidate_count"),
            "top":c.get("candidates",[])[:5],
          },ensure_ascii=False))
          PY
