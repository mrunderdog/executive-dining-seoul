name: LH IIAC source QA

on:
  push:
    branches:
      - feat/public-enterprise-lh-iiac

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Discover
        run: |
          python pipeline/public_enterprise_discovery.py --detail-limit 30
          python - <<'PY'
          import json
          d=json.load(open('reports/public-enterprise-discovery.json',encoding='utf-8'))
          for s in d['sources']:
              if s['key'] in {'korail','lh','iiac'}:
                  print('DISC',json.dumps({'key':s['key'],'status':s.get('status'),'attachments':len(s.get('attachments',[])),'errors':s.get('errors',[])[:3]},ensure_ascii=False))
                  for a in (s.get('attachments') or [])[:8]: print('ATT',s['key'],json.dumps(a,ensure_ascii=False))
          PY
      - name: Ingest
        run: python pipeline/ingest_public_enterprise_expense.py
      - name: Build candidates
        run: python pipeline/build_public_enterprise_candidates.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          raw=json.load(open('data/raw/public_enterprise_expense.json',encoding='utf-8'))
          cand=json.load(open('reports/public-enterprise-candidates.json',encoding='utf-8'))
          print('ROWS',len(raw.get('rows',[])))
          print('INST',json.dumps(Counter(r.get('institution') for r in raw.get('rows',[])),ensure_ascii=False))
          print('FILES',len(raw.get('files',[])),'ERRORS',len(raw.get('errors',[])))
          print('CAND',cand.get('eligible_count'),cand.get('entity_count'),cand.get('meal_rows'))
          for c in cand.get('candidates',[])[:30]: print('CANDROW',json.dumps({k:c.get(k) for k in ['merchant','address','visits','institutions','score']},ensure_ascii=False))
          PY
      - name: Build site
        run: python pipeline/build_site.py --output dist/index.html
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/ed-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/ed-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/ed-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
