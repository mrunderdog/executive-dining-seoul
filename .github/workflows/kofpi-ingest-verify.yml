name: KOFPI ingestion verify
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/public_enterprise_kofpi.py'
      - '.github/workflows/kofpi-ingest-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install parser
        run: pip install --disable-pip-version-check xlrd==2.0.2
      - name: Parse KOFPI
        run: python pipeline/public_enterprise_kofpi.py
      - name: Ingest and build candidates
        run: |
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
          python - <<'PY'
          import json
          raw=json.load(open('data/raw/public_enterprise_expense.json',encoding='utf-8'))
          cand=json.load(open('reports/public-enterprise-candidates.json',encoding='utf-8'))
          rows=[r for r in raw['rows'] if r.get('source_key')=='kofpi']
          cs=[x for x in cand['candidates'] if '한국임업진흥원' in (x.get('institutions') or [])]
          print('KOFPI_ROWS',len(rows))
          print('KOFPI_MERCHANTS',len({r.get('merchant') for r in rows if r.get('merchant')}))
          print('KOFPI_ROLES',json.dumps(sorted({r.get('role') for r in rows if r.get('role')}),ensure_ascii=False))
          print('KOFPI_DATE_MIN',min((r.get('used_date') for r in rows if r.get('used_date')),default=''))
          print('KOFPI_DATE_MAX',max((r.get('used_date') for r in rows if r.get('used_date')),default=''))
          print('KOFPI_CANDIDATES',len(cs))
          print('KOFPI_TOP',json.dumps([{'merchant':x.get('merchant'),'visits':x.get('visits')} for x in cs[:12]],ensure_ascii=False))
          if not rows or not cs:
              raise SystemExit('KOFPI did not produce publishable candidates')
          PY
