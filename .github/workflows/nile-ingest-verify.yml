name: NILE isolated ingestion verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nile-ingest-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pypdf==6.1.1
      - name: Parse NILE sequentially
        run: python pipeline/public_enterprise_nile.py
      - name: Ingest and build candidates
        run: |
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
          python - <<'PY'
          import json
          d=json.load(open('reports/public-enterprise-discovery.json',encoding='utf-8'))
          raw=json.load(open('data/raw/public_enterprise_expense.json',encoding='utf-8'))
          cand=json.load(open('reports/public-enterprise-candidates.json',encoding='utf-8'))
          src=next(x for x in d['sources'] if x.get('key')=='nile')
          rows=[r for r in raw['rows'] if r.get('source_key')=='nile']
          cs=[x for x in cand['candidates'] if '국가평생교육진흥원' in (x.get('institutions') or [])]
          print('NILE_ISOLATED',json.dumps({
              'status':src.get('status'),
              'attachments':len(src.get('attachments') or []),
              'rows':len(rows),
              'merchants':len({r.get('merchant') for r in rows if r.get('merchant')}),
              'date_min':min((r.get('used_date') for r in rows if r.get('used_date')),default=''),
              'date_max':max((r.get('used_date') for r in rows if r.get('used_date')),default=''),
              'candidates':len(cs),
              'top':[{'merchant':x.get('merchant'),'visits':x.get('visits')} for x in cs[:12]],
              'errors':(src.get('errors') or [])[:8],
          },ensure_ascii=False))
          if not rows or not cs:
              raise SystemExit('NILE did not produce publishable candidates')
          PY
