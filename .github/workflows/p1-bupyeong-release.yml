name: P1 Bupyeong 2026 September exact-source strict release
on:
  push:
    branches:
      - fix/p1-three-source-row-forensics-20261029
    paths:
      - .github/workflows/p1-bupyeong-release.yml
permissions:
  contents: write
jobs:
  strict-release-check:
    if: github.ref == 'refs/heads/fix/p1-three-source-row-forensics-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/p1-three-source-row-forensics-20261029
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verified spreadsheet and PDF parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Run exact official cell fixtures and existing safety regression
        run: |
          PYTHONPATH=pipeline python -m unittest -v test_p1_official_file_forensics test_council_p1_adapters test_full_reconciliation_p0 test_icheon_discovery_safety test_council_recovery
          python pipeline/regression_checks.py
      - name: Discover Bupyeong 2026 and historical reference documents
        run: python pipeline/capital_backfill.py --since 2024-12 --until 2026-10 --source bupyeong
      - name: Guard official source identity and complete file discovery
        run: python pipeline/guard_full_council.py --source bupyeong --phase discovery --baseline-ref HEAD
      - name: Reconcile actual official Excel documents; retain immutable historical transactions
        run: python pipeline/ingest_council_expense.py --source bupyeong --incremental
      - name: Normalize only newly sourced dates and protect historical rows
        run: python pipeline/repair_raw_dates.py --source bupyeong --min-valid 0.0 --preserve-baseline-ref HEAD
      - name: Independent strict QA, old row/file identity and 2025 duplicated-sheet audit
        run: |
          PYTHONPATH=pipeline python pipeline/audit_p1_bupyeong_release.py
          python pipeline/build_source_candidates.py --source bupyeong --top 100
          python pipeline/regression_checks.py
          python pipeline/build_signal_reports.py
          python pipeline/quality_gate.py
          python pipeline/audit_coordinates.py
          python pipeline/build_site.py --output /tmp/bupyeong-index.html
          test -s /tmp/bupyeong-index.html
      - name: Commit only exact-source approved Bupyeong rows to P1 PR branch
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=pipeline python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('reports/p1-bupyeong-strict-release-audit.json').read_text(encoding='utf-8'))
          assert a['status']=='PASS' and a['strict_qa']['status']=='PUBLISH_READY'
          assert a['new_rows']==92 and a['reused_source_rows_not_duplicated']==959
          assert a['historical_integrity']['lost_row_count']==0
          assert a['historical_integrity']['changed_row_count']==0
          assert a['historical_integrity']['lost_file_count']==0
          assert a['historical_integrity']['changed_file_count']==0
          assert json.loads(Path('reports/quality.json').read_text(encoding='utf-8'))['passed'] is True
          PY
          git add -- data/raw/bupyeong_expense.json
          git add -- reports/bupyeong-executive-candidates.json reports/bupyeong-executive-candidates.md reports/bupyeong-ingestion.md
          git add -- reports/capital-backfill-discovery-bupyeong.json reports/capital-backfill-discovery-bupyeong.md
          git add -- reports/p1-bupyeong-strict-release-audit.json
          echo 'Files to publish in P1 PR:'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | grep -Ec '^data/raw/bupyeong_expense.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-bupyeong-strict-release-results
          path: |
            reports/p1-bupyeong-strict-release-audit.json
            reports/quality.json
            reports/coordinate-audit.json
          retention-days: 14
          if-no-files-found: warn
)" -eq 1
          if git diff --cached --name-only | grep -Eq '^data/raw/(gapyeong|gimpo)_expense.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-bupyeong-strict-release-results
          path: |
            reports/p1-bupyeong-strict-release-audit.json
            reports/quality.json
            reports/coordinate-audit.json
          retention-days: 14
          if-no-files-found: warn
; then
            echo 'Attempted to stage an unapproved council source'; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 92 strictly verified Sep 2026 Bupyeong rows, retain all historic source records"
          git push origin HEAD:fix/p1-three-source-row-forensics-20261029
      - name: Preserve provenance diagnostic; no direct production publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-bupyeong-strict-release-results
          path: |
            reports/p1-bupyeong-strict-release-audit.json
            reports/quality.json
            reports/coordinate-audit.json
          retention-days: 14
          if-no-files-found: warn
