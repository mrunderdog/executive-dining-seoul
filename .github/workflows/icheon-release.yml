name: Icheon 2026 June verified source release (one time)
on:
  pull_request:
    paths:
      - 'pipeline/icheon_release_guard.py'
      - '.github/workflows/icheon-release.yml'
permissions:
  contents: write
jobs:
  release-qa:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/icheon-discovery-qa-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/icheon-discovery-qa-20261028
          fetch-depth: 0
      - name: Prevent rerunning a committed release
        id: guard
        run: |
          if test -e reports/icheon-release-audit.json; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install official data parsers
        if: steps.guard.outputs.run == 'true'
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Capture original Icheon rows, files, global venue entities and rankings
        if: steps.guard.outputs.run == 'true'
        run: PYTHONPATH=pipeline python pipeline/icheon_release_guard.py baseline
      - name: Refresh official Icheon only through strict QA and candidate builder
        if: steps.guard.outputs.run == 'true'
        run: |
          python pipeline/incremental_monthly_refresh.py --lookback-months 5 --workers 1 --source icheon
          python - <<'PY'
          import json
          d=json.load(open('reports/incremental-council-status.json',encoding='utf-8'))
          assert d['sources']==1,d
          assert d['results'][0]['source']=='icheon' and d['results'][0]['status']=='UPDATED',d
          assert d['results'][0]['stages']['strict_qa']['ok'] is True,d
          print('STRICT OFFICIAL QA',d['results'][0]['stages']['strict_qa']['tail'])
          PY
      - name: Verify exact 42+3 rows, no original loss, no false roles/dates and ranking drift
        if: steps.guard.outputs.run == 'true'
        run: PYTHONPATH=pipeline python pipeline/icheon_release_guard.py verify
      - name: Full quality and site regression gates
        if: steps.guard.outputs.run == 'true'
        run: |
          python pipeline/regression_checks.py
          PYTHONPATH=pipeline python -m unittest -v test_icheon_discovery_safety test_council_recovery test_refresh_health test_monthly_entity_guards
          python pipeline/test_data_story.py
          python pipeline/build_signal_reports.py
          python pipeline/quality_gate.py
          python pipeline/audit_coordinates.py
          python pipeline/build_site.py --output /tmp/icheon-release-index.html
          test -s /tmp/icheon-release-index.html
          node --check site/app.js
          node --check site/data_story.js
          python - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('reports/quality.json').read_text(encoding='utf-8'))
          release=json.loads(Path('reports/icheon-release-audit.json').read_text(encoding='utf-8'))
          assert qa['passed'] is True,qa['errors']
          assert release['status']=='PASS',release
          assert release['verified_new_rows']==45
          print('Icheon full release gate PASS. Restaurants:',release['entities_before'],release['entities_after'])
          PY
      - name: Commit only strictly verified Icheon official data to release branch
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/raw/icheon_expense.json
          git add -- reports/icheon-executive-candidates.json reports/icheon-executive-candidates.md reports/icheon-ingestion.md
          git add -- reports/capital-backfill-discovery-icheon.json reports/capital-backfill-discovery-icheon.md
          git add -- reports/icheon-release-audit.json reports/signal-intelligence.json reports/signal-intelligence.md
          git diff --cached --name-only
          test "$(git diff --cached --name-only | grep -Ec '^data/raw/icheon_expense.json$')" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: recover 45 verified Icheon June council transactions"
          git push origin HEAD:fix/icheon-discovery-qa-20261028
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.run == 'true'
        with:
          name: icheon-strict-release-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/icheon-release-audit.json
            reports/quality.json
            reports/coordinate-audit.json
            reports/incremental-council-status.json
