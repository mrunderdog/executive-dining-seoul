name: EX ALIO probe
on:
  push:
    branches: [feat/ex-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX parser
        run: pip install openpyxl==3.1.5
      - name: Download and inspect EX 2025 workbook
        run: |
          python - <<'PY'
          import io, json, urllib.request
          from openpyxl import load_workbook
          url='https://alio.go.kr/download/file.json?d=2026041303157881&f=101'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ExecutiveDiningSeoul/2.1','Referer':'https://alio.go.kr/'})
          with urllib.request.urlopen(req,timeout=90) as r:
              blob=r.read()
              print('STATUS',r.status,'CTYPE',r.headers.get('Content-Type'),'DISP',r.headers.get('Content-Disposition'),'BYTES',len(blob),'MAGIC',blob[:8])
          wb=load_workbook(io.BytesIO(blob),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
              print('SHEET',ws.title)
              for i,row in enumerate(ws.iter_rows(values_only=True),1):
                  vals=['' if v is None else str(v) for v in row]
                  if any(x.strip() for x in vals):
                      print('ROW',i,json.dumps(vals,ensure_ascii=False))
                  if i>=70:break
          PY
