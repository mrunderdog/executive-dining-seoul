name: EX official-site probe
on:
  push:
    branches: [feat/ex-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Find EX official business-expense route
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          seeds=[
            'https://www.ex.co.kr/',
            'https://seonhahwang-ex.netlify.app/',
          ]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read();cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          for base in seeds:
              print('BASE',base)
              try: html=get(base)
              except Exception as e: print('ERR',type(e).__name__,e); continue
              print('BYTES',len(html))
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',html,re.S|re.I):
                  href=urllib.parse.urljoin(base,m.group(1))
                  text=' '.join(re.sub(r'<[^>]+>',' ',m.group(2)).split())
                  joined=(text+' '+href)
                  if re.search(r'업무추진비|청렴|integrity|expense|윤리',joined,re.I):
                      print('LINK',text,href)
              for pat in ['업무추진비','청렴 자료실','사전공표정보']:
                  m=re.search(pat,html,re.I)
                  if m: print('SNIP',pat,html[max(0,m.start()-2500):m.start()+5500].replace('\n',' ')[:8000])
          PY
