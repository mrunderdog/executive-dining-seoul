name: EX ALIO probe
on:
  push:
    branches: [feat/ex-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe Korea Expressway Corporation ALIO disclosure
        run: |
          python - <<'PY'
          import re, urllib.request
          urls=[
            'https://alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0183&disclosureNo=&reportFormRootNo=20701',
            'https://alio.go.kr/item/itemReportTerm.do?apbaId=C0183&disclosureNo=&reportFormRootNo=20701',
          ]
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          for url in urls:
              print('URL',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read();ct=r.headers.get('Content-Type');cs=r.headers.get_content_charset() or 'utf-8'
                  html=raw.decode(cs,errors='replace')
                  print('STATUS OK BYTES',len(raw),'CTYPE',ct)
              except Exception as e:
                  print('ERR',type(e).__name__,e);continue
              pats=['한국도로공사','기관장 업무추진비','2025','xlsx','xls','download','atch','file']
              for pat in pats:
                  m=re.search(re.escape(pat),html,re.I)
                  print('PAT',pat,bool(m))
                  if m: print(html[max(0,m.start()-3500):min(len(html),m.start()+10000)].replace('\n',' ')[:14000])
              for m in re.finditer(r'<a\b[^>]*>',html,re.I):
                  tag=m.group(0)
                  if re.search(r'xlsx|xls|download|file|atch',tag,re.I):
                      print('ATAG',tag)
          PY
