name: EX ALIO probe
on:
  push:
    branches: [feat/ex-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve ALIO download endpoint
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0183&disclosureNo=&reportFormRootNo=20701'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read();cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          html=get(base)
          print('HTML',len(html))
          for pat in [r'disclosureNo\s*[:=][^,;\n]+',r'\$submissionNo\s*=\s*[^;]+',r'submissionNo\s*[:=][^,;\n]+',r'downReportSelectedFiles\s*:\s*function\s*\([^)]*\)\s*\{']:
              for m in re.finditer(pat,html,re.I):
                  print('HTML_MATCH',pat,html[max(0,m.start()-1000):min(len(html),m.start()+4000)].replace('\n',' ')[:5000])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          for src in scripts:
              if 'downloadUtils' not in src: continue
              url=urllib.parse.urljoin(base,src)
              js=get(url)
              print('JS_URL',url,'LEN',len(js))
              for fn in ['downReportAttachFile','downReportContentFile','downReportPdfFile']:
                  m=re.search(r'(?:var\s+)?'+re.escape(fn)+r'\s*=\s*function|function\s+'+re.escape(fn)+r'\s*\(',js,re.I)
                  if m: print('FUNC',fn,js[max(0,m.start()-1500):min(len(js),m.start()+6500)].replace('\n',' ')[:8000])
          PY
