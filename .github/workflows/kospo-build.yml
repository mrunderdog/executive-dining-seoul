name: KOSPO adapter build
on:
  push:
    branches: [feat/kospo-adapter]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch KOSPO adapter and registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('pipeline/public_enterprise_discovery.py')
          s=p.read_text(encoding='utf-8')
          anchor='def discover_kdhc(src,year):\n'
          fn=r'''def discover_kospo(src,year):
    base=(src.get("listing_urls") or [""])[0]
    lookback=max(0,int(src.get("lookback_years",1)))
    years=sorted({year-i for i in range(lookback+1)})
    out={"key":src["key"],"institution":src["institution"],"cohort":src.get("cohort","public_enterprise_leadership"),"default_role":src.get("default_role","사장"),"years":years,"pages":[base],"attachments":[],"errors":[]}
    try:doc=fetch(base)
    except Exception as e:
        out["errors"].append(f"listing {base}: {type(e).__name__}: {e}")
        out["parseable_attachments"]=0;out["status"]="FETCH_FAILED";return out
    dm=re.search(r'disclosureNo\s*:\s*"([^"]+)"',doc) or re.search(r'\$submissionNo\s*=\s*"?([0-9]+)',doc)
    if not dm:
        out["errors"].append("ALIO disclosureNo missing")
        out["parseable_attachments"]=0;out["status"]="NO_FILES_FOUND";return out
    disclosure=dm.group(1)
    seen=set()
    for fm in re.finditer(r'<option\s+value="([^"]+)">\s*([^<]+\.(?:xlsx?|xls))\s*</option>',doc,re.I):
        file_no,label=fm.group(1),html.unescape(fm.group(2)).strip()
        ym=re.search(r'(20\d{2})',label)
        if not ym:continue
        y=int(ym.group(1))
        if y not in years:continue
        url=f"https://www.alio.go.kr/download/file.json?d={disclosure}&f={file_no}"
        if url in seen:continue
        seen.add(url)
        out["attachments"].append({"text":label,"url":url,"download_url":url,"year":y,"month":None,"parent":base,"attachment_id":f"{disclosure}|{file_no}"})
    out["parseable_attachments"]=len(out["attachments"])
    out["status"]="PARSEABLE_FOUND" if out["attachments"] else "NO_FILES_FOUND"
    return out

'''
          if 'def discover_kospo(src,year):' not in s:
              if anchor not in s: raise SystemExit('discovery insertion anchor missing')
              s=s.replace(anchor,fn+anchor)
          dispatch='    if src.get("key")=="kdhc" and src.get("verified") and src.get("publish"):\n        return discover_kdhc(src,year)\n'
          repl=dispatch+'    if src.get("key")=="kospo" and src.get("verified") and src.get("publish"):\n        return discover_kospo(src,year)\n'
          if 'return discover_kospo(src,year)' not in s:
              if dispatch not in s: raise SystemExit('dispatch anchor missing')
              s=s.replace(dispatch,repl)
          p.write_text(s,encoding='utf-8')

          q=Path('pipeline/ingest_central_executive_expense.py')
          t=q.read_text(encoding='utf-8')
          anchor2='        if meta.get("key")=="kogas":\n            source_category=role\n            role=clean(meta.get("default_role")) or "기관장"\n'
          repl2=anchor2+'        if meta.get("key")=="kospo":\n            source_category=role\n            role=clean(meta.get("default_role")) or "사장"\n'
          if 'if meta.get("key")=="kospo":' not in t:
              if anchor2 not in t: raise SystemExit('normalizer anchor missing')
              t=t.replace(anchor2,repl2)
          q.write_text(t,encoding='utf-8')

          r=Path('sources/public_enterprise_registry.json')
          d=json.loads(r.read_text(encoding='utf-8'))
          d['as_of']='2026-10-02'
          d['sources']=[x for x in d['sources'] if x.get('key') not in {'kospo','kowepo','ewp'}]
          d['sources'].extend([
            {
              'key':'kospo','institution':'한국남부발전','cohort':'public_enterprise_leadership','verified':True,'publish':True,'refresh_policy':'monthly','default_role':'사장','format_hint':'xlsx-alio-detail','lookback_years':1,
              'listing_urls':['https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0043&disclosureNo=&reportFormRootNo=20701'],
              'note':'ALIO 기관장 업무추진비 정기공시(C0043 / 20701). 2025 공식 XLSX에 일자·목적·장소·참석대상·참석인원·금액의 거래별 세부내역이 공개되어 연도별 ALIO XLSX adapter로 수집.'
            },
            {
              'key':'kowepo','institution':'한국서부발전','cohort':'public_enterprise_leadership','verified':True,'publish':False,'refresh_policy':'track_only','default_role':'기관장','format_hint':'xlsx-aggregate-only',
              'listing_urls':['https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0082&disclosureNo=&reportFormRootNo=20701'],
              'note':'ALIO 2025 공식 XLSX를 직접 검증했으나 집행월·집행내역·건수·집행금액만 있고 merchant/사용처가 없어 지도 데이터로 출판 불가.'
            },
            {
              'key':'ewp','institution':'한국동서발전','cohort':'public_enterprise_leadership','verified':True,'publish':False,'refresh_policy':'track_only','default_role':'기관장','format_hint':'xlsx-aggregate-only',
              'listing_urls':['https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0066&disclosureNo=&reportFormRootNo=20701'],
              'note':'ALIO 2025 공식 XLSX를 직접 검증했으나 집행월·집행내역·금액만 있고 merchant/사용처가 없어 지도 데이터로 출판 불가.'
            }
          ])
          r.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Run KOSPO pipeline
        run: |
          python pipeline/public_enterprise_discovery.py --year 2026 --incremental --detail-limit 24
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
      - name: Verify KOSPO parsing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          c=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          s=next(x for x in d['sources'] if x['key']=='kospo')
          rows=[x for x in r.get('rows',[]) if x.get('institution')=='한국남부발전']
          cs=[x for x in c.get('candidates',[]) if '한국남부발전' in (x.get('institutions') or [])]
          print('KOSPO_DISCOVERY',json.dumps({'status':s.get('status'),'attachments':s.get('attachments')},ensure_ascii=False))
          print('KOSPO_ROWS',json.dumps(rows,ensure_ascii=False))
          print('KOSPO_CANDIDATES',json.dumps(cs,ensure_ascii=False))
          assert s.get('status')=='PARSEABLE_FOUND'
          assert len(s.get('attachments') or [])>=2
          assert len(rows)>=42, len(rows)
          assert all((x.get('role') or '')=='사장' for x in rows)
          assert any(x.get('merchant')=='남포면옥' and x.get('amount')==36000 for x in rows)
          assert any(x.get('merchant')=='백호양대창 이수점' and x.get('amount')==74000 for x in rows)
          assert cs
          PY
      - name: Commit adapter and generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/public_enterprise_discovery.py pipeline/ingest_central_executive_expense.py sources/public_enterprise_registry.json reports/public-enterprise-discovery.json reports/public-enterprise-ingestion.md reports/public-enterprise-candidates.json reports/public-enterprise-candidates.md data/raw/public_enterprise_expense.json
          git commit -m "feat: add KOSPO merchant-level expense adapter"
          git push origin HEAD:feat/kospo-adapter
