name: KEPCO attachment probe

on:
  push:
    branches:
      - feat/kepco-adapter

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Probe KEPCO download via browser network
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/kepco-chrome \
            "https://www.kepco.co.kr/home/disclosure/mandisclosure/etc/expenses.do" \
            >/tmp/kepco-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT

          cat > /tmp/kepco-probe.mjs <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function target(){
            for(let i=0;i<120;i++){
              try{
                const xs=await (await fetch('http://127.0.0.1:9222/json')).json();
                const p=xs.find(x=>x.type==='page' && x.url.includes('kepco.co.kr'));
                if(p?.webSocketDebuggerUrl)return p;
              }catch{}
              await sleep(250);
            }
            throw new Error('target timeout');
          }
          const t=await target();
          const ws=new WebSocket(t.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.addEventListener('open',res,{once:true});ws.addEventListener('error',rej,{once:true});});
          let seq=0; const pending=new Map(); const reqs=[]; const responses=[];
          ws.addEventListener('message',e=>{
            const m=JSON.parse(e.data);
            if(m.id && pending.has(m.id)){
              const p=pending.get(m.id); pending.delete(m.id);
              if(m.error)p.reject(new Error(JSON.stringify(m.error))); else p.resolve(m.result);
              return;
            }
            if(m.method==='Network.requestWillBeSent'){
              const r=m.params?.request||{};
              reqs.push({url:r.url,method:r.method,postData:r.postData||'',headers:r.headers||{},type:m.params?.type||''});
            }
            if(m.method==='Network.responseReceived'){
              const r=m.params?.response||{};
              responses.push({url:r.url,status:r.status,mimeType:r.mimeType,headers:r.headers||{}});
            }
          });
          function cdp(method,params={}){
            return new Promise((resolve,reject)=>{
              const id=++seq; pending.set(id,{resolve,reject}); ws.send(JSON.stringify({id,method,params}));
            });
          }
          async function ev(expression){
            const r=await cdp('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});
            if(r.exceptionDetails)throw new Error(JSON.stringify(r.exceptionDetails));
            return r.result?.value;
          }
          await cdp('Runtime.enable'); await cdp('Page.enable'); await cdp('Network.enable');
          let ready=false;
          for(let i=0;i<120;i++){
            ready=await ev("document.readyState==='complete' && typeof G_FILE!=='undefined' && typeof G_FILE.downloadFile==='function'");
            if(ready)break;
            await sleep(250);
          }
          if(!ready)throw new Error('G_FILE not ready');
          const impl=await ev(`({
            keys:Object.keys(G_FILE),
            download:String(G_FILE.downloadFile),
            preview:(typeof GU!=='undefined'&&GU.fn_PreviewFile2)?String(GU.fn_PreviewFile2):''
          })`);
          console.log('G_FILE_IMPL',JSON.stringify(impl));
          const chosen=await ev(`(() => {
            const cards=[...document.querySelectorAll('.card')];
            const card=cards.find(c =>
              [...c.querySelectorAll('.badge')].some(b=>b.textContent.trim()==='기관장') &&
              /사장\s*업무추진비/.test(c.querySelector('.title')?.textContent||'')
            );
            if(!card)return null;
            const btn=card.querySelector('button[onclick*="G_FILE.downloadFile"]');
            return {title:card.querySelector('.title')?.textContent.trim()||'',onclick:btn?.getAttribute('onclick')||''};
          })()`);
          console.log('CHOSEN',JSON.stringify(chosen));
          if(!chosen?.onclick)throw new Error('institution-head download button missing');
          const before=reqs.length;
          await ev(`(() => {
            const cards=[...document.querySelectorAll('.card')];
            const card=cards.find(c =>
              [...c.querySelectorAll('.badge')].some(b=>b.textContent.trim()==='기관장') &&
              /사장\s*업무추진비/.test(c.querySelector('.title')?.textContent||'')
            );
            card.querySelector('button[onclick*="G_FILE.downloadFile"]').click();
            return true;
          })()`);
          await sleep(6000);
          const delta=reqs.slice(before);
          console.log('NETWORK_DELTA',JSON.stringify(delta));
          console.log('RESPONSES',JSON.stringify(responses.filter(x=>delta.some(d=>d.url===x.url))));
          ws.close();
          NODE

          node /tmp/kepco-probe.mjs
