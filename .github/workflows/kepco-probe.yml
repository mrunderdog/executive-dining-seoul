name: KEPCO adapter QA
on:
  push:
    branches: [feat/kepco-adapter]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Run pipeline
        run: |
          python pipeline/public_enterprise_discovery.py --year 2026 --detail-limit 24
          python pipeline/ingest_public_enterprise_expense.py
          python pipeline/build_public_enterprise_candidates.py
      - name: Check KEPCO
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          c=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          s=next(x for x in d['sources'] if x['key']=='kepco')
          rows=[x for x in r.get('rows',[]) if x.get('institution')=='한국전력공사']
          cs=[x for x in c.get('candidates',[]) if '한국전력공사' in (x.get('institutions') or [])]
          print('KEPCO_DISCOVERY',json.dumps({'status':s.get('status'),'attachments':len(s.get('attachments') or [])},ensure_ascii=False))
          print('KEPCO_ROWS',json.dumps(rows[:20],ensure_ascii=False))
          print('KEPCO_CANDIDATES',json.dumps(cs[:20],ensure_ascii=False))
          assert s.get('status')=='PARSEABLE_FOUND'
          assert len(s.get('attachments') or [])>=2
          assert rows
          assert cs
          PY
      - name: Regression
        run: python pipeline/regression_checks.py
