name: KEPCO publish QA
on:
  push:
    branches: [feat/kepco-adapter]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Refresh public-enterprise data
        run: |
          python pipeline/public_enterprise_discovery.py --year 2026 --detail-limit 24
          python pipeline/ingest_public_enterprise_expense.py
          python pipeline/build_public_enterprise_candidates.py
          python pipeline/geocode_extra_cache.py
          python pipeline/geocode_cache.py --mode auto
      - name: Validate KEPCO candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          rows=[x for x in raw.get('rows',[]) if x.get('institution')=='한국전력공사']
          cs=[x for x in cand.get('candidates',[]) if '한국전력공사' in (x.get('institutions') or [])]
          print('KEPCO_ROWS',json.dumps(rows,ensure_ascii=False))
          print('KEPCO_CANDIDATES',json.dumps(cs,ensure_ascii=False))
          assert rows
          assert cs
          PY
      - name: Quality and regression
        run: |
          python pipeline/audit_coordinates.py
          python pipeline/quality_gate.py
          python pipeline/regression_checks.py
          python pipeline/build_site.py --output dist/index.html
          node --check site/app.js
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/kepco-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/kepco-site-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/kepco-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
      - name: Commit generated KEPCO data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add KEPCO institution-head dining baseline"
          git push origin HEAD:feat/kepco-adapter
