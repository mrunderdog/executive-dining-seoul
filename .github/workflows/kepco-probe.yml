name: KEPCO attachment probe

on:
  push:
    branches:
      - feat/kepco-adapter

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect KEPCO download implementation
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request

          base='https://www.kepco.co.kr/home/disclosure/mandisclosure/etc/expenses.do'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*;q=0.8'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  raw=r.read()
                  c=r.headers.get_content_charset() or 'utf-8'
              try:return raw.decode(c)
              except:return raw.decode('utf-8',errors='replace')

          html=get(base)
          print('HTML_BYTES',len(html.encode('utf-8')))
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          print('SCRIPTS',len(scripts))
          for src in scripts:
              url=urllib.parse.urljoin(base,src)
              print('SCRIPT',url)
              try: js=get(url)
              except Exception as e:
                  print('SCRIPT_ERR',url,type(e).__name__,e)
                  continue
              for pat in ('downloadFile','G_FILE','fn_PreviewFile2'):
                  m=re.search(re.escape(pat),js,re.I)
                  if m:
                      lo=max(0,m.start()-2500); hi=min(len(js),m.start()+5000)
                      print('MATCH',pat,url)
                      print(js[lo:hi].replace('\n',' ')[:7500])
          # Also inspect inline source around actual calls.
          for pat in ('G_FILE.downloadFile','GU.fn_PreviewFile2'):
              m=re.search(re.escape(pat),html)
              if m:
                  lo=max(0,m.start()-1800); hi=min(len(html),m.start()+2600)
                  print('INLINE',pat)
                  print(html[lo:hi].replace('\n',' ')[:4400])
          PY
