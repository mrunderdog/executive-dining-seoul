name: KEPCO attachment probe

on:
  push:
    branches:
      - feat/kepco-adapter

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe latest KEPCO institution-head attachment
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://www.kepco.co.kr/home/disclosure/mandisclosure/etc/expenses.do'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          req=urllib.request.Request(base,headers={'User-Agent':ua,'Accept':'text/html,*/*;q=0.8'})
          with urllib.request.urlopen(req,timeout=60) as resp:
              html=resp.read().decode(resp.headers.get_content_charset() or 'utf-8',errors='replace')
          # Find institution-head cards and download calls.
          cards=re.findall(r'<div class="card[^>]*>(.*?)</div>\s*</div>',html,re.S|re.I)
          candidates=[]
          for card in cards:
              text=re.sub(r'<[^>]+>',' ',card)
              text=' '.join(text.replace('&#039;',"'").split())
              if '기관장' not in text or '사장 업무추진비' not in text:
                  continue
              m=re.search(r"G_FILE\.downloadFile\('([^']+)'\s*,\s*'([^']+)'\)",card)
              if m:
                  candidates.append((text,m.group(1),m.group(2)))
          print('CANDIDATES',len(candidates))
          if not candidates:
              # fallback across the full page using a bounded window around titles
              for tm in re.finditer(r"<strong class=\"title\">(.*?)</strong>",html,re.S|re.I):
                  title=re.sub(r'<[^>]+>',' ',tm.group(1))
                  title=' '.join(title.replace('&#039;',"'").split())
                  window=html[max(0,tm.start()-500):min(len(html),tm.end()+5000)]
                  if '사장 업무추진비' not in title or '기관장' not in window:
                      continue
                  m=re.search(r"G_FILE\.downloadFile\('([^']+)'\s*,\s*'([^']+)'\)",window)
                  if m:candidates.append((title,m.group(1),m.group(2)))
          print('FOUND',[(x[0],x[1],x[2]) for x in candidates[:5]])
          if not candidates: raise SystemExit('no institution-head file call')
          title,file_no,file_seq=candidates[0]
          endpoint='https://www.kepco.co.kr/c2r/FileDownload.do'
          data=urllib.parse.urlencode({'fileNo':file_no,'fileSeq':file_seq}).encode()
          req=urllib.request.Request(endpoint,data=data,headers={
              'User-Agent':ua,
              'Referer':base,
              'Content-Type':'application/x-www-form-urlencoded',
              'Accept':'*/*'
          })
          with urllib.request.urlopen(req,timeout=90) as resp:
              blob=resp.read()
              print('STATUS',resp.status)
              print('CONTENT_TYPE',resp.headers.get('Content-Type'))
              print('CONTENT_DISPOSITION',resp.headers.get('Content-Disposition'))
              print('BYTES',len(blob))
              print('MAGIC',blob[:32].hex())
              open('/tmp/kepco-latest.bin','wb').write(blob)
          PY
