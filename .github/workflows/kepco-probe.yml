name: KEPCO raw layout probe

on:
  push:
    branches:
      - feat/kepco-adapter

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: pip install --disable-pip-version-check pypdf==6.1.1
      - name: Print latest KEPCO PDF rows
        run: |
          python - <<'PY'
          import json,re,time,urllib.parse,urllib.request
          from pipeline.ingest_central_executive_expense import rows_from
          base='https://www.kepco.co.kr/home/disclosure/mandisclosure/etc/expenses.do'
          ua='ExecutiveDiningSeoul/2.1 (+https://github.com/mrunderdog/executive-dining-seoul)'
          def request(req):
              last=None
              for n in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r:return r.read()
                  except Exception as e:
                      last=e;print('RETRY',n+1,type(e).__name__,e);time.sleep(2**n)
              raise last
          html=request(urllib.request.Request(base,headers={'User-Agent':ua,'Accept':'text/html,*/*'})).decode('utf-8',errors='replace')
          found=[]
          for tm in re.finditer(r'<strong class="title">(.*?)</strong>',html,re.S|re.I):
              title=' '.join(re.sub(r'<[^>]+>',' ',tm.group(1)).replace('&#039;',"'").split())
              win=html[max(0,tm.start()-900):min(len(html),tm.end()+5200)]
              if '기관장' not in win or '사장 업무추진비' not in title:continue
              m=re.search(r"G_FILE\.downloadFile\('([^']+)'\s*,\s*'([^']+)'\)",win)
              if m:found.append((title,m.group(1),m.group(2)))
          print('FOUND',found)
          title,no,seq=found[0]
          data=urllib.parse.urlencode({'fileNo':no,'fileSeq':seq}).encode()
          req=urllib.request.Request('https://www.kepco.co.kr/c2r/FileDownload.do',data=data,headers={
              'User-Agent':ua,'Referer':base,'Content-Type':'application/x-www-form-urlencoded','Accept':'*/*'})
          blob=request(req)
          print('BLOB',len(blob),blob[:8])
          for sheet,rows in rows_from(blob,title+' .pdf'):
              print('RAW',sheet,json.dumps(rows,ensure_ascii=False))
          PY
