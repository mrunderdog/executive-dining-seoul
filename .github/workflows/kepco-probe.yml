name: KEPCO adapter QA

on:
  push:
    branches:
      - feat/kepco-adapter

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Run public-enterprise pipeline
        run: |
          python pipeline/public_enterprise_discovery.py --year 2026 --detail-limit 24
          python pipeline/ingest_public_enterprise_expense.py
          python pipeline/build_public_enterprise_candidates.py
      - name: Inspect KEPCO result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          disc=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          raw=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          src=next(x for x in disc['sources'] if x['key']=='kepco')
          rows=[x for x in raw.get('rows',[]) if x.get('institution')=='한국전력공사']
          cands=[x for x in cand.get('candidates',[]) if '한국전력공사' in (x.get('institutions') or [])]
          print('KEPCO_DISCOVERY',json.dumps({
            'status':src.get('status'),
            'attachments':len(src.get('attachments') or []),
            'items':src.get('attachments')
          },ensure_ascii=False))
          print('KEPCO_ROWS',json.dumps({'count':len(rows),'sample':rows[:40]},ensure_ascii=False))
          print('KEPCO_CANDIDATES',json.dumps({'count':len(cands),'items':cands[:40]},ensure_ascii=False))
          if src.get('status')!='PARSEABLE_FOUND':
              raise SystemExit('KEPCO source not parseable')
          if len(src.get('attachments') or []) < 2:
              raise SystemExit('KEPCO attachment coverage too shallow')
          if not rows:
              raise SystemExit('KEPCO parsed rows missing')
          if not cands:
              raise SystemExit('KEPCO dining candidates missing')
          PY
      - name: Regression
        run: |
          python pipeline/regression_checks.py
