name: Probe ALIO attachment structure

on:
  push:
    branches:
      - feat/public-agency-executive-expense

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe
        run: |
          python - <<'PY'
          import requests,re,html
          h={'User-Agent':'Mozilla/5.0'}
          page_url='https://alio.go.kr/item/itemReportTerm.do?apbaId=C0397&disclosureNo=&reportFormRootNo=20701'
          page=requests.get(page_url,headers=h,timeout=30).text
          print('PAGE_LEN',len(page))
          for line in page.splitlines():
              if 'disclosureNo' in line or 'selectedDisclosureNo' in line or 'reportFileDown' in line:
                  s=' '.join(line.split())
                  if s: print('PAGE_LINE',s[:2000])
          js=requests.get('https://alio.go.kr/resources/js/page/portal/downloadUtils.js?v=202109131',headers=h,timeout=30).text
          idx=js.find('function downReportAttachFile')
          print('FUNC_IDX',idx)
          print('FUNC_BODY',' '.join(js[idx:idx+2200].split()) if idx>=0 else 'missing')
          PY
