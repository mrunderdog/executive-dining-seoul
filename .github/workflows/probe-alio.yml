name: Probe public agency detail sources

on:
  push:
    branches:
      - feat/public-agency-executive-expense

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check openpyxl==3.1.5 pypdf==6.1.1 requests
      - name: Inspect Korail and LH detailed attachments
        run: |
          python - <<'PY'
          import requests,io,json,re
          from openpyxl import load_workbook
          from pypdf import PdfReader
          h={'User-Agent':'Mozilla/5.0'}

          ku='https://info.korail.com/info/downloadBbsFile.do?atchmnflNo=28645'
          kr=requests.get(ku,headers=h,timeout=45)
          print('KDOWNLOAD',kr.status_code,len(kr.content),kr.headers.get('content-type'),kr.content[:8])
          wb=load_workbook(io.BytesIO(kr.content),data_only=True,read_only=True)
          for ws in wb.worksheets:
              print('KSHEET',ws.title,ws.max_row,ws.max_column)
              for row in ws.iter_rows(values_only=True):
                  vals=[str(x) if x is not None else '' for x in row]
                  if any(vals): print('KROW',json.dumps(vals,ensure_ascii=False))

          lu='https://www.lh.or.kr/boardDownload.es?bid=0018&list_no=733994&seq=1'
          lr=requests.get(lu,headers=h,timeout=45)
          print('LDOWNLOAD',lr.status_code,len(lr.content),lr.headers.get('content-type'),lr.content[:8])
          reader=PdfReader(io.BytesIO(lr.content))
          text='\n'.join((p.extract_text() or '') for p in reader.pages)
          print('LTEXT',re.sub(r'\s+',' ',text)[:12000])
          PY
