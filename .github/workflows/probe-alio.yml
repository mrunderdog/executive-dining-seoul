name: Probe ALIO attachment structure

on:
  push:
    branches:
      - feat/public-agency-executive-expense

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests openpyxl
      - name: Probe
        run: |
          python - <<'PY'
          import requests,io,json
          from openpyxl import load_workbook
          h={'User-Agent':'Mozilla/5.0','Referer':'https://alio.go.kr/'}
          u='https://alio.go.kr/download/file.json?f=101&d=2026041303157006'
          r=requests.get(u,headers=h,timeout=45)
          print('DOWNLOAD',r.status_code,len(r.content),r.headers.get('content-type'),r.headers.get('content-disposition'))
          print('HEAD',r.content[:20])
          wb=load_workbook(io.BytesIO(r.content),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets[:3]:
              print('SHEET',ws.title,ws.max_row,ws.max_column)
              for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,30),values_only=True):
                  vals=[str(x) if x is not None else '' for x in row]
                  if any(vals): print('ROW',json.dumps(vals,ensure_ascii=False))
          PY
