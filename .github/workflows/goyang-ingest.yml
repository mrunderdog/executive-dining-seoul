name: Capital council expense ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional single council source key to refresh (blank = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: capital-council-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install spreadsheet parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1

      - name: Run regression checks
        run: python pipeline/regression_checks.py

      - name: Refresh supported councils in parallel
        shell: bash
        run: |
          set +e
          SOURCES="goyang suwon hwaseong seongnam bucheon namyangju uijeongbu gwangmyeong gimpo ansan paju anseong icheon osan pocheon yangpyeong yongin gwangju guri uiwang gunpo dongducheon gwacheon gapyeong siheung yeoju yangju hanam yeoncheon michuhol bupyeong jemulpo yeongjong seohae yeonsu gyeyang ganghwa ongjin gyeonggi_council incheon_council"
          REQUESTED_SOURCE="${{ github.event.inputs.source }}"
          if [[ -n "$REQUESTED_SOURCE" ]]; then
            case " $SOURCES " in
              *" $REQUESTED_SOURCE "*) SOURCES="$REQUESTED_SOURCE" ;;
              *) echo "Unknown source: $REQUESTED_SOURCE"; exit 2 ;;
            esac
          fi
          echo "Refreshing sources: $SOURCES"
          refresh_one() {
            SOURCE="$1"
            LOG="/tmp/council-$SOURCE.log"
            STATUS="/tmp/council-$SOURCE.status"
            restore_last_good() {
              STAGE="$1"
              BASELINE="${STAGE}_FAILED"
              if git cat-file -e "HEAD:data/raw/${SOURCE}_expense.json" 2>/dev/null; then
                BASELINE="STALE_OK:${STAGE}"
              fi
              for F in "data/raw/${SOURCE}_expense.json" \
                       "reports/${SOURCE}-executive-candidates.json" \
                       "reports/${SOURCE}-executive-candidates.md" \
                       "reports/${SOURCE}-ingestion.md" \
                       "reports/capital-backfill-discovery-${SOURCE}.json" \
                       "reports/capital-backfill-discovery-${SOURCE}.md"; do
                if git cat-file -e "HEAD:$F" 2>/dev/null; then
                  git restore --source=HEAD -- "$F"
                else
                  python -c 'from pathlib import Path; import sys; Path(sys.argv[1]).unlink(missing_ok=True)' "$F"
                fi
              done
              echo "$BASELINE" > "$STATUS"
            }
            {
              echo "=== discover $SOURCE ==="
              python pipeline/capital_backfill.py --since 2024-12 --source "$SOURCE" || { restore_last_good "DISCOVERY"; exit 0; }
              echo "=== ingest $SOURCE ==="
              python pipeline/ingest_council_expense.py --source "$SOURCE" || { restore_last_good "INGEST"; exit 0; }
              # Normalize legacy dates; the incremental QA below enforces 100%
              # on every new/changed row without grandfathering new errors.
              python pipeline/repair_raw_dates.py --source "$SOURCE" --min-valid 0.0 || { restore_last_good "DATE_REPAIR"; exit 0; }
              PYTHONPATH=pipeline python pipeline/qa_council_publication.py --source "$SOURCE" --baseline-ref HEAD
              QA_RC=$?
              if [[ $QA_RC -eq 3 ]]; then restore_last_good "NO_CHANGE"; exit 0; fi
              if [[ $QA_RC -ne 0 ]]; then restore_last_good "STRICT_QA"; exit 0; fi
              python pipeline/build_source_candidates.py --source "$SOURCE" --top 100 || { restore_last_good "CANDIDATE"; exit 0; }
              echo "OK" > "$STATUS"
            } > "$LOG" 2>&1
          }
          PIDS=""
          for SOURCE in $SOURCES; do
            refresh_one "$SOURCE" &
            PIDS="$PIDS $!"
          done
          for PID in $PIDS; do wait "$PID"; done

          : > /tmp/council-status.tsv
          for SOURCE in $SOURCES; do
            STATE="$(cat "/tmp/council-$SOURCE.status" 2>/dev/null || echo UNKNOWN)"
            echo -e "$SOURCE\t$STATE" >> /tmp/council-status.tsv
            echo "===== $SOURCE : $STATE ====="
            tail -80 "/tmp/council-$SOURCE.log" || true
          done
          cat /tmp/council-status.tsv

      - name: Validate every successfully staged source
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('pipeline').resolve()))
          from qa_council_publication import assess_incremental, git_json

          status = {}
          order = []
          status_path = Path('/tmp/council-status.tsv')
          if status_path.exists():
              for line in status_path.read_text().splitlines():
                  if '\t' in line:
                      source, state = line.split('\t', 1)
                      status[source] = state
                      order.append(source)

          def exists_in_head(path: str) -> bool:
              return subprocess.run(
                  ['git', 'cat-file', '-e', f'HEAD:{path}'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0

          def restore_last_good(source: str, reason: str) -> str:
              paths = [
                  f'data/raw/{source}_expense.json',
                  f'reports/{source}-executive-candidates.json',
                  f'reports/{source}-executive-candidates.md',
                  f'reports/{source}-ingestion.md',
                  f'reports/capital-backfill-discovery-{source}.json',
                  f'reports/capital-backfill-discovery-{source}.md',
              ]
              has_last_good = (
                  exists_in_head(paths[0])
                  and exists_in_head(paths[1])
              )
              for path in paths:
                  p = Path(path)
                  if exists_in_head(path):
                      subprocess.run(
                          ['git', 'restore', '--source=HEAD', '--', path],
                          check=False,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                      )
                  elif p.exists():
                      p.unlink()
              new_state = f'STALE_OK:VALIDATION_{reason}' if has_last_good else f'VALIDATION_FAILED:{reason}'
              print(f'{source}: fresh data quarantined -> {new_state}')
              return new_state

          ok = 0
          for source in order:
              state = status[source]
              if state != 'OK':
                  print(source, state)
                  continue

              p = Path(f'data/raw/{source}_expense.json')
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
                  rows = d.get('rows', [])
                  if not rows:
                      raise ValueError('no_rows')

                  discovery = json.loads(Path(f'reports/capital-backfill-discovery-{source}.json').read_text(encoding='utf-8'))
                  qa = assess_incremental(
                      source, d, discovery,
                      git_json('HEAD', f'data/raw/{source}_expense.json'),
                      git_json('HEAD', f'reports/capital-backfill-discovery-{source}.json'),
                  )
                  if qa['status'] != 'PUBLISH_READY':
                      raise ValueError('strict_qa_' + ','.join(qa['failures']))

                  ok += 1
                  print(source, {
                      'state': state,
                      'rows': len(rows),
                      'verified_rows': qa['verified_rows'],
                      'coverage': qa['coverage'],
                      'files': len(d.get('files', [])),
                      'errors': len(d.get('errors', [])),
                  })
              except Exception as exc:
                  # A single degraded council must not block every other source.
                  # Revert that council to last-good (or remove an unpublishable
                  # first scrape), record its state, and continue the batch.
                  status[source] = restore_last_good(
                      source,
                      str(exc).replace(' ', '_')[:80],
                  )

          status_path.write_text(
              ''.join(f'{source}\t{status[source]}\n' for source in order),
              encoding='utf-8',
          )
          print(f'Strict QA publishable sources: {ok} (held sources retain their last-good files)')
          PY

      - name: Record council source health
        run: python pipeline/refresh_health.py --full-status /tmp/council-status.tsv

      - name: Commit successful council data and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\t' read -r SOURCE STATE; do
            if [[ "$STATE" != "OK" ]]; then
              continue
            fi
            [[ -f "data/raw/${SOURCE}_expense.json" ]] && git add "data/raw/${SOURCE}_expense.json"
            for F in reports/${SOURCE}-*; do
              [[ -e "$F" ]] && git add "$F"
            done
            for F in reports/capital-backfill-discovery-${SOURCE}.*; do
              [[ -e "$F" ]] && git add "$F"
            done
          done < /tmp/council-status.tsv
          git add reports/refresh-health.json
          if git diff --cached --quiet; then
            echo "No successful council data changes."
            exit 0
          fi
          git commit -m "data: refresh supported Capital Area councils"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Quality gate public dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html
