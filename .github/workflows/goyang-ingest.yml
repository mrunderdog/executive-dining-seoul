name: Goyang expense ingestion smoke test

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/ingest_council_expense.py'
      - 'pipeline/capital_backfill.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install spreadsheet parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2
      - name: Refresh official attachment discovery
        run: python pipeline/capital_backfill.py --since 2024-12 --source goyang
      - name: Download and normalize Goyang expense rows
        run: python pipeline/ingest_council_expense.py --source goyang
      - name: Sanity check normalized rows
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/raw/goyang_expense.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=d.get('rows',[])
          assert rows, 'no normalized rows'
          assert sum(1 for r in rows if r.get('merchant')) >= max(1, int(len(rows)*0.7)), 'merchant coverage too low'
          assert sum(1 for r in rows if isinstance(r.get('amount'), int) and r['amount']>=0) >= max(1, int(len(rows)*0.7)), 'amount coverage too low'
          print({'rows':len(rows),'files':len(d.get('files',[])),'errors':len(d.get('errors',[]))})
          PY
      - name: Commit staged raw dataset and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/goyang_expense.json reports/goyang-ingestion.md reports/capital-backfill-discovery.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: ingest Goyang expense rows"
          git pull --rebase origin main
          git push origin HEAD:main
