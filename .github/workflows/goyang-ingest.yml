name: Capital council expense ingestion

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/ingest_council_expense.py'
      - 'pipeline/repair_raw_dates.py'
      - 'pipeline/build_source_candidates.py'
      - 'pipeline/capital_backfill.py'
      - 'pipeline/published_sources.py'
      - '.github/workflows/goyang-ingest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capital-council-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install spreadsheet parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1

      - name: Refresh supported councils in parallel
        shell: bash
        run: |
          set +e
          SOURCES="goyang suwon hwaseong seongnam bucheon michuhol bupyeong yeonsu gyeyang ganghwa ongjin gyeonggi_council incheon_council"
          refresh_one() {
            SOURCE="$1"
            LOG="/tmp/council-$SOURCE.log"
            STATUS="/tmp/council-$SOURCE.status"
            restore_last_good() {
              STAGE="$1"
              if git cat-file -e "HEAD:data/raw/${SOURCE}_expense.json" 2>/dev/null && git cat-file -e "HEAD:reports/${SOURCE}-executive-candidates.json" 2>/dev/null; then
                git restore --source=HEAD -- "data/raw/${SOURCE}_expense.json" 2>/dev/null || true
                git restore --source=HEAD -- "reports/${SOURCE}-executive-candidates.json" "reports/${SOURCE}-executive-candidates.md" "reports/${SOURCE}-ingestion.md" 2>/dev/null || true
                echo "STALE_OK:${STAGE}" > "$STATUS"
              else
                echo "${STAGE}_FAILED" > "$STATUS"
              fi
            }
            {
              echo "=== discover $SOURCE ==="
              python pipeline/capital_backfill.py --since 2024-12 --source "$SOURCE" || { restore_last_good "DISCOVERY"; exit 0; }
              echo "=== ingest $SOURCE ==="
              python pipeline/ingest_council_expense.py --source "$SOURCE" || { restore_last_good "INGEST"; exit 0; }
              python pipeline/repair_raw_dates.py --source "$SOURCE" --min-valid 0.95 || { restore_last_good "DATE_QA"; exit 0; }
              python pipeline/build_source_candidates.py --source "$SOURCE" --top 100 || { restore_last_good "CANDIDATE"; exit 0; }
              echo "OK" > "$STATUS"
            } > "$LOG" 2>&1
          }
          PIDS=""
          for SOURCE in $SOURCES; do
            refresh_one "$SOURCE" &
            PIDS="$PIDS $!"
          done
          for PID in $PIDS; do wait "$PID"; done

          : > /tmp/council-status.tsv
          for SOURCE in $SOURCES; do
            STATE="$(cat "/tmp/council-$SOURCE.status" 2>/dev/null || echo UNKNOWN)"
            echo -e "$SOURCE\t$STATE" >> /tmp/council-status.tsv
            echo "===== $SOURCE : $STATE ====="
            tail -80 "/tmp/council-$SOURCE.log" || true
          done
          cat /tmp/council-status.tsv

      - name: Validate every successfully staged source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status={}
          p=Path('/tmp/council-status.tsv')
          if p.exists():
              for line in p.read_text().splitlines():
                  if '\t' in line:
                      k,v=line.split('\t',1); status[k]=v
          ok=0
          for source,state in status.items():
              usable = state=='OK' or state.startswith('STALE_OK:')
              if not usable:
                  print(source, state)
                  continue
              p=Path(f'data/raw/{source}_expense.json')
              d=json.loads(p.read_text(encoding='utf-8'))
              rows=d.get('rows',[])
              assert rows, f'{source}: no normalized rows'
              merchant=sum(bool(str(r.get('merchant') or '').strip()) for r in rows)/len(rows)
              amount=sum(isinstance(r.get('amount'), int) and r['amount']>=0 for r in rows)/len(rows)
              date=d.get('raw_quality',{}).get('valid_date_coverage',0)
              assert merchant >= .70, f'{source}: merchant coverage too low: {merchant:.1%}'
              assert amount >= .70, f'{source}: amount coverage too low: {amount:.1%}'
              assert date >= .95, f'{source}: date coverage too low: {date:.1%}'
              ok += 1
              print(source, {'state':state,'rows':len(rows),'merchant':merchant,'amount':amount,'date':date,'files':len(d.get('files',[])),'errors':len(d.get('errors',[]))})
          assert ok >= 1, f'no usable council source is available'
          PY

      - name: Quality gate public dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      - name: Commit successful council data and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\t' read -r SOURCE STATE; do
            if [[ "$STATE" != "OK" ]]; then
              for F in reports/capital-backfill-discovery-${SOURCE}.*; do
                [[ -e "$F" ]] && git add "$F"
              done
              continue
            fi
            [[ -f "data/raw/${SOURCE}_expense.json" ]] && git add "data/raw/${SOURCE}_expense.json"
            for F in reports/${SOURCE}-*; do
              [[ -e "$F" ]] && git add "$F"
            done
            for F in reports/capital-backfill-discovery-${SOURCE}.*; do
              [[ -e "$F" ]] && git add "$F"
            done
          done < /tmp/council-status.tsv
          if git diff --cached --quiet; then
            echo "No successful council data changes."
            exit 0
          fi
          git commit -m "data: refresh supported Capital Area councils"
          git pull --rebase origin main
          git push origin HEAD:main
