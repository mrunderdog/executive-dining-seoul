name: Prosecution archive probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prosecution-archive-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect Newstapa prosecution page assets
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request
          UA='Mozilla/5.0 ExecutiveDiningSeoulProbe/1.0'
          page='https://pages.newstapa.org/2023/07_prosecution/expense.html'
          req=urllib.request.Request(page,headers={'User-Agent':UA})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(); enc=r.headers.get_content_charset() or 'utf-8'
          doc=raw.decode(enc,errors='replace')
          print('PAGE_BYTES',len(raw))
          for needle in ('늘봄','청계산','윤석열','문무일','restaurant','latitude','longitude','lat','lng','__next_f'):
              print('NEEDLE',needle,'COUNT',doc.lower().count(needle.lower()))
              pos=doc.lower().find(needle.lower())
              if pos>=0:
                  print('CONTEXT',doc[max(0,pos-1500):pos+5000])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',doc,re.I)
          links=re.findall(r'<link[^>]+href=["\']([^"\']+)["\']',doc,re.I)
          for s in scripts:
              print('SCRIPT',urllib.parse.urljoin(page,html.unescape(s)))
          for x in sorted(set(re.findall(r'''(?:https?:)?//[^"'\s<>]+|[^"'\s<>]+\.(?:json|csv)(?:\?[^"'\s<>]*)?''',doc,re.I))):
              print('DATAREF',x[:1000])
          extra_chunks=[]
          for rel in re.findall(r'''static/chunks/app/[^"'\\]+?\.js''',doc,re.I):
              url=urllib.parse.urljoin(page,'./_next/'+rel if not rel.startswith('_next/') else './'+rel)
              if url not in extra_chunks:
                  extra_chunks.append(url)
          for url in extra_chunks:
              print('EXTRA_SCRIPT',url)
          for s in scripts:
              url=urllib.parse.urljoin(page,html.unescape(s))
              if url not in extra_chunks:
                  extra_chunks.append(url)
          for url in extra_chunks:
              try:
                  q=urllib.request.Request(url,headers={'User-Agent':UA})
                  with urllib.request.urlopen(q,timeout=15) as rr:
                      blob=rr.read()
                  text=blob.decode('utf-8',errors='replace')
                  needles=('늘봄','청계산','윤석열','문무일','restaurant','merchant','.json','.csv','mapbox','kakao','latitude','longitude','37.','127.','store','place')
                  print('ASSET',url,'BYTES',len(blob))
                  for needle in needles:
                      low=text.lower(); nlow=needle.lower()
                      count=low.count(nlow)
                      if not count: continue
                      print('ASSET_NEEDLE',needle,'COUNT',count)
                      start=0
                      for _ in range(min(count,8)):
                          pos=low.find(nlow,start)
                          if pos<0: break
                          print('SNIP',needle,text[max(0,pos-900):pos+2200].replace('\\n',' ')[:3200])
                          start=pos+len(nlow)
                  refs=sorted(set(re.findall(r'''(?:https?:)?//[^"'\\s<>]+|[^"'\\s<>]+\\.(?:json|csv)(?:\\?[^"'\\s<>]*)?''',text,re.I)))
                  for ref in refs[:120]:
                      print('CHUNK_REF',ref[:1600])
              except Exception as e:
                  print('ASSET_ERROR',url,type(e).__name__,e)
          PY
