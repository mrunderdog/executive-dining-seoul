name: SPO detail probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spo-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: pip install --disable-pip-version-check pypdf==6.1.1
      - name: Probe latest SPO expense detail
        run: |
          python - <<'PY'
          import io, urllib.parse, urllib.request
          from pypdf import PdfReader
          url='https://www.spo.go.kr/site/spo/ex/announce/AnnounceInfoView.do'
          data=urllib.parse.urlencode({'seqId':'715441','infoId':'300','infoSeq':'1'}).encode()
          req=urllib.request.Request(url,data=data,headers={
              'User-Agent':'Mozilla/5.0 ExecutiveDiningSeoulProbe/1.0',
              'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
              'X-Requested-With':'XMLHttpRequest',
              'Accept':'text/html,*/*;q=0.8',
          })
          with urllib.request.urlopen(req,timeout=12) as r:
              raw=r.read(); enc=r.headers.get_content_charset() or 'utf-8'
          doc=raw.decode(enc,errors='replace')
          print('BYTES',len(raw))
          print(doc[:25000])
          pdf='https://www.spo.go.kr/cmm/fms/FileDown.do?atchFileId=FILE_000000000635051&fileSn=0'
          preq=urllib.request.Request(pdf,headers={'User-Agent':'Mozilla/5.0 ExecutiveDiningSeoulProbe/1.0'})
          with urllib.request.urlopen(preq,timeout=12) as r:
              blob=r.read()
          print('PDF BYTES',len(blob),blob[:8])
          reader=PdfReader(io.BytesIO(blob))
          for i,p in enumerate(reader.pages[:4],1):
              txt=p.extract_text(extraction_mode='layout') or p.extract_text() or ''
              print('PDF PAGE',i)
              print(txt[:12000])
          PY
