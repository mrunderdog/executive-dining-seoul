name: KECO ingestion verify
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/public_enterprise_keco.py'
      - '.github/workflows/keco-ingest-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLS parser
        run: pip install --disable-pip-version-check xlrd==2.0.2
      - name: Parse KECO
        run: python pipeline/public_enterprise_keco.py
      - name: Ingest and build candidates
        run: |
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
          python - <<'PY'
          import json
          raw=json.load(open('data/raw/public_enterprise_expense.json',encoding='utf-8'))
          cand=json.load(open('reports/public-enterprise-candidates.json',encoding='utf-8'))
          rows=[r for r in raw['rows'] if r.get('source_key')=='keco']
          c=[x for x in cand['candidates'] if '한국환경공단' in (x.get('institutions') or [])]
          print('KECO_ROWS',len(rows))
          print('KECO_MERCHANTS',len({r.get('merchant') for r in rows if r.get('merchant')}))
          print('KECO_ROLES',json.dumps(sorted({r.get('role') for r in rows if r.get('role')}),ensure_ascii=False))
          print('KECO_DATE_MIN',min((r.get('used_date') for r in rows if r.get('used_date')),default=''))
          print('KECO_DATE_MAX',max((r.get('used_date') for r in rows if r.get('used_date')),default=''))
          print('KECO_CANDIDATES',len(c))
          print('KECO_TOP',json.dumps([{'merchant':x['merchant'],'visits':x['visits']} for x in c[:12]],ensure_ascii=False))
          if not rows or not c:
              raise SystemExit('KECO did not produce publishable candidates')
          PY
