name: Inline JSON script security tests

on:
  pull_request:
    paths:
      - 'pipeline/build_site.py'
      - 'pipeline/test_inline_json_safety.py'
      - '.github/workflows/security-inline-json.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run security regression tests
        run: PYTHONPATH=pipeline python -m unittest -v pipeline/test_inline_json_safety.py
      - name: Verify Python syntax
        run: python -m py_compile pipeline/build_site.py pipeline/test_inline_json_safety.py
