name: Capital source adapter smoke test

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/capital_backfill.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capital-source-smoke
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Smoke-test each supported source without writing to main
        shell: bash
        run: |
          set +e
          FAIL=0
          for SOURCE in goyang suwon hwaseong seongnam bucheon namyangju uijeongbu gwangmyeong gimpo ansan paju anseong icheon osan pocheon yangpyeong yongin gwangju guri uiwang gunpo dongducheon gwacheon gapyeong siheung yeoju michuhol bupyeong jemulpo yeongjong seohae yeonsu gyeyang ganghwa ongjin gyeonggi_council incheon_council; do
            echo "=== smoke $SOURCE ==="
            python pipeline/capital_backfill.py --since 2024-12 --source "$SOURCE"
            RC=$?
            if [[ $RC -ne 0 ]]; then
              echo "::warning::$SOURCE discovery failed in smoke test"
              FAIL=$((FAIL+1))
            fi
          done
          echo "Smoke-test failures: $FAIL"
          # This workflow is observational only; source-specific failures are
          # handled by the production ingestion workflow without blocking peers.
          exit 0
