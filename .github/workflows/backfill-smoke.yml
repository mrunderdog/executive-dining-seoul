name: Capital source adapter smoke test

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/capital_backfill.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Discover Suwon/Goyang/Bupyeong official posts and attachments
        run: python pipeline/capital_backfill.py --since 2024-12
      - name: Commit discovery report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/capital-backfill-discovery.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh capital-area backfill discovery"
          git pull --rebase origin main
          git push origin HEAD:main
