name: Public agency detail QA

on:
  push:
    branches:
      - feat/public-agency-executive-expense

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 beautifulsoup4 requests
      - name: Ingest ALIO tracker
        run: python pipeline/ingest_public_agency_executive_expense.py --latest-files 1
      - name: Ingest detailed agency source
        run: python pipeline/ingest_public_agency_detail_expense.py --korail-pages 3 --korail-items 24
      - name: Build candidates
        run: python pipeline/build_public_agency_executive_candidates.py
      - name: Show results
        run: |
          cat reports/public-agency-detail-ingestion.md
          cat reports/public-agency-executive-candidates.md
      - name: Regression
        run: python pipeline/regression_checks.py
      - name: Build site
        run: python pipeline/build_site.py --output /tmp/index.html
