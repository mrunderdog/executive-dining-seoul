name: KPS production verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kps-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify production KPS adapter
        run: python pipeline/public_enterprise_kps.py
