name: Search return and enrichment QA

on:
  push:
    branches:
      - fix/search-return-and-enrichment

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression
        run: python pipeline/regression_checks.py
      - name: Build
        run: python pipeline/build_site.py --output dist/index.html
      - name: Coverage report
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          html=Path('dist/index.html').read_text(encoding='utf-8')
          s=html.index('const DATA=')+len('const DATA=')
          e=html.index(',STATS=',s)
          rows=json.loads(html[s:e])
          def blank(x): return x is None or (isinstance(x,str) and not x.strip())
          out={'total':len(rows)}
          out['missing_address']=sum(blank(r.get('address')) for r in rows)
          out['missing_phone']=sum(blank((r.get('business') or {}).get('phone')) for r in rows)
          out['missing_url']=sum(blank((r.get('business') or {}).get('url')) for r in rows)
          out['missing_category']=sum(blank((r.get('business') or {}).get('category')) or '확인 필요' in str((r.get('business') or {}).get('category')) for r in rows)
          out['address_backfilled']=sum(r.get('address_enrichment_source')=='nominatim_exact_name' for r in rows)
          print('COVERAGE',json.dumps(out,ensure_ascii=False))
          PY
      - name: Syntax
        run: node --check site/app.js
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/ed-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/ed-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/ed-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
