name: FOWI source probe
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_fowi.py'
      - '.github/workflows/fowi-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check openpyxl==3.1.5
      - run: python pipeline/probe_fowi.py
