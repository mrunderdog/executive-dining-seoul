name: HRDK source probe
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_hrdk.py'
      - '.github/workflows/hrdk-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install parser
        run: pip install --disable-pip-version-check pdfplumber==0.11.7
      - name: Probe HRDK
        run: python pipeline/probe_hrdk.py
