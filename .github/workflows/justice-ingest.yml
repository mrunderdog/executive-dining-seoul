name: Justice leadership expense ingestion

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: 'Refresh mode'
        required: true
        type: choice
        options:
          - incremental
          - full
        default: incremental

permissions:
  contents: write

concurrency:
  group: published-data-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six

      - name: Discover justice leadership sources
        run: python pipeline/justice_leadership_discovery.py

      - name: Ingest justice leadership expenses
        id: ingest
        shell: bash
        run: |
          if [[ "${{ inputs.refresh_mode }}" == "full" ]]; then
            OUT="$(python pipeline/ingest_justice_leadership_expense.py)"
          else
            OUT="$(python pipeline/ingest_justice_leadership_expense.py --incremental)"
          fi
          echo "$OUT"
          if echo "$OUT" | grep -q '"status": "NO_CHANGE"'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build justice leadership dining candidates
        if: steps.ingest.outputs.changed == 'true' || inputs.refresh_mode == 'full'
        run: python pipeline/build_justice_leadership_candidates.py

      - name: Refresh historical prosecution archive
        if: inputs.refresh_mode == 'full'
        run: python pipeline/ingest_prosecution_archive.py

      - name: Validate justice output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('data/raw/justice_leadership_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/justice-leadership-candidates.json').read_text(encoding='utf-8'))
          rows=raw.get('rows',[])
          merchant=[r for r in rows if str(r.get('merchant') or '').strip()]
          print({'rows':len(rows),'merchant_rows':len(merchant),'eligible':cand.get('eligible_count',0)})
          if not rows or not merchant:
              raise SystemExit('justice output is empty')
          archive=Path('reports/prosecution-archive-candidates.json')
          if archive.exists():
              d=json.loads(archive.read_text(encoding='utf-8'))
              if int(d.get('entity_count') or 0) < 70:
                  raise SystemExit('prosecution archive extraction degraded below 70 entities')
          PY

      - name: Geocode supplemental cohorts
        if: steps.ingest.outputs.changed == 'true' || inputs.refresh_mode == 'full'
        run: python pipeline/geocode_extra_cache.py

      - name: Quality gate public dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      - name: Commit justice data and reports
        if: steps.ingest.outputs.changed == 'true' || inputs.refresh_mode == 'full'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/justice_leadership_expense.json reports/justice-leadership-* data/geocode_cache.json || true
          if [[ "${{ inputs.refresh_mode }}" == "full" ]]; then
            git add data/raw/prosecution_archive_restaurants.json reports/prosecution-archive-* || true
          fi
          if git diff --cached --quiet; then
            echo "No justice data changes."
            exit 0
          fi
          git commit -m "data: ${{ inputs.refresh_mode }} justice refresh"
          git pull --rebase origin main
          git push origin HEAD:main
