name: Justice leadership expense ingestion

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: 'Refresh mode'
        required: true
        type: choice
        options:
          - incremental
          - full
          - validate
        default: incremental

permissions:
  contents: write

concurrency:
  group: published-data-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parsers
        if: inputs.refresh_mode != 'validate'
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six

      - name: Refresh justice datasets safely
        run: python pipeline/refresh_justice.py --mode "${{ inputs.refresh_mode }}"

      - name: Geocode supplemental cohorts
        if: inputs.refresh_mode != 'validate'
        run: python pipeline/geocode_extra_cache.py

      - name: Quality gate public dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      - name: Commit refreshed data
        if: inputs.refresh_mode != 'validate'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/raw/justice_leadership_expense.json \
            data/raw/prosecution_archive_restaurants.json \
            data/geocode_cache.json \
            reports/justice-leadership-* \
            reports/prosecution-archive-* \
            reports/justice-refresh-status.json || true
          if git diff --cached --quiet; then
            echo "No justice data changes."
            exit 0
          fi
          git commit -m "data: ${{ inputs.refresh_mode }} justice refresh"
          git pull --rebase origin main
          git push origin HEAD:main
