name: KHNP ALIO probe
on:
  push:
    branches: [feat/khnp-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX parser
        run: pip install openpyxl==3.1.5
      - name: Resolve and inspect KHNP institution-head workbook
        run: |
          python - <<'PY'
          import io,json,re,time,urllib.request
          from openpyxl import load_workbook
          pages=[
            'https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0220&disclosureNo=&reportFormRootNo=20701',
            'https://alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0220&disclosureNo=&reportFormRootNo=20701',
          ]
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          html=None;page=None
          for candidate in pages:
            for attempt in range(3):
              try:
                req=urllib.request.Request(candidate,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
                with urllib.request.urlopen(req,timeout=40) as r:
                  html=r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
                page=candidate;break
              except Exception as e:
                print('PAGE_RETRY',candidate,attempt+1,type(e).__name__,e);time.sleep(attempt+1)
            if html: break
          if not html: raise SystemExit('KHNP ALIO page unavailable')
          print('PAGE',page,'BYTES',len(html))
          dm=re.search(r'disclosureNo\s*:\s*"([^"]+)"',html)
          if not dm:
            dm=re.search(r'\$submissionNo\s*=\s*"?([0-9]+)',html)
          print('DISCLOSURE',dm.group(1) if dm else None)
          opts=re.findall(r'<option\s+value="([^"]+)">\s*([^<]+\.(?:xlsx?|xls))\s*</option>',html,re.I)
          print('OPTIONS',json.dumps(opts,ensure_ascii=False))
          if not dm or not opts: raise SystemExit('attachment metadata missing')
          disclosure=dm.group(1)
          target=next(((a,b) for a,b in opts if '2025' in b),None) or next(((a,b) for a,b in opts if '2024' in b),None)
          if not target: raise SystemExit('2025/2024 workbook missing')
          file_no,file_name=target
          hosts=['https://www.alio.go.kr','https://alio.go.kr']
          blob=None
          for host in hosts:
            url=f'{host}/download/file.json?d={disclosure}&f={file_no}'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':page})
              with urllib.request.urlopen(req,timeout=90) as r:
                blob=r.read(); print('FILE',file_name,'URL',url,'BYTES',len(blob),'CTYPE',r.headers.get('Content-Type'),'MAGIC',blob[:8])
              break
            except Exception as e: print('FILE_ERR',url,type(e).__name__,e)
          if not blob: raise SystemExit('workbook download failed')
          wb=load_workbook(io.BytesIO(blob),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
            print('SHEET',ws.title)
            for i,row in enumerate(ws.iter_rows(values_only=True),1):
              vals=['' if v is None else str(v) for v in row]
              if any(x.strip() for x in vals): print('ROW',i,json.dumps(vals,ensure_ascii=False))
              if i>=120: break
          PY
