name: P1 Ansan Hwaseong real Full Refresh audit
on:
  push:
    branches: [audit/ansan-hwaseong-current-source-20261113]
  workflow_dispatch:
  pull_request:
    paths:
      - pipeline/audit_ansan_hwaseong_full_reconcile.py
      - .github/workflows/p1-ansan-hwaseong-full-audit.yml
      - pipeline/ingest_council_expense.py
      - pipeline/qa_council_publication.py
      - pipeline/test_p1_ansan_hwaseong_full_reconcile.py
      - pipeline/audit_hwaseong_period_duplicates.py
      - pipeline/prepare_p1_source_only_subset.py
      - pipeline/p1_ansan_hwaseong_original_exceptions.json
permissions:
  contents: read
jobs:
  real-source-full-reconciliation:
    strategy:
      fail-fast: false
      matrix:
        source: [ansan, hwaseong]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install supported official Excel and PDF readers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Verify strict original-source parser regression tests
        run: |
          PYTHONPATH=pipeline python -m unittest -v test_p1_ansan_hwaseong_full_reconcile test_full_reconciliation_p0 test_council_p1_adapters
          python pipeline/regression_checks.py
          python pipeline/quality_gate.py
      - name: Run original public-source reconciliation without publishing
        run: python -u pipeline/audit_ansan_hwaseong_full_reconcile.py --source ${{ matrix.source }}
      - name: Stage SHA-attested partial source-only review with all original exceptions accounted for
        run: python -u pipeline/prepare_p1_source_only_subset.py --source ${{ matrix.source }}
      - name: Test exact independently sourced month-boundary duplicates (Hwaseong)
        if: matrix.source == 'hwaseong'
        run: PYTHONPATH=pipeline python pipeline/audit_hwaseong_period_duplicates.py
      - name: Attach strict audit results, including failed source stages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-full-audit-${{ matrix.source }}
          path: reports/p1-ansan-hwaseong-qa/
          retention-days: 14
          if-no-files-found: warn
