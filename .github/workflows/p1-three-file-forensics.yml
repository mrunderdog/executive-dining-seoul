name: P1 three councils official-file forensic comparison
on:
  pull_request:
    paths:
      - pipeline/diagnose_p1_three_sources.py
      - .github/workflows/p1-three-file-forensics.yml
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        source: [gapyeong, gimpo, bupyeong]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official PDF/XLS readers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Discover current exact source posts
        run: python pipeline/capital_backfill.py --since 2024-12 --until 2026-10 --source ${{ matrix.source }}
      - name: Compare actual official file bytes to mapped original cells
        run: PYTHONPATH=pipeline python -u pipeline/diagnose_p1_three_sources.py --source ${{ matrix.source }}
      - name: Attach forensics; never publish source data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-forensics-${{ matrix.source }}
          path: reports/p1-forensics/${{ matrix.source }}/
          retention-days: 14
          if-no-files-found: warn
