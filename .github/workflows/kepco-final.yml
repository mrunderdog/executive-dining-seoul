name: KEPCO final publish QA
on:
  push:
    branches: [feat/kepco-adapter]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Rebuild enriched public-enterprise data
        run: |
          python pipeline/build_public_enterprise_candidates.py
          python pipeline/geocode_extra_cache.py
          python pipeline/geocode_cache.py --mode auto
      - name: Verify KEPCO enrichment and coordinates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,'pipeline')
          from extra_published import public_enterprise_records
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          cs=[x for x in cand.get('candidates',[]) if '한국전력공사' in (x.get('institutions') or [])]
          print('KEPCO_CANDIDATES',json.dumps(cs,ensure_ascii=False))
          rec=[x for x in public_enterprise_records() if '한국전력공사' in (x.get('institutions') or [])]
          print('KEPCO_RECORDS',json.dumps(rec,ensure_ascii=False))
          assert len(rec)>=2
          assert all(x.get('address') for x in rec)
          assert all(isinstance(x.get('lat'),(int,float)) and isinstance(x.get('lon'),(int,float)) for x in rec)
          PY
      - name: Quality, build and browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/quality_gate.py
          python pipeline/regression_checks.py
          python pipeline/build_site.py --output dist/index.html
          node --check site/app.js
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/final-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/final-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/final-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
      - name: Commit final generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/public-enterprise-candidates.json reports/public-enterprise-candidates.md data/geocode_cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: geocode verified KEPCO dining venues"
          git push origin HEAD:feat/kepco-adapter
