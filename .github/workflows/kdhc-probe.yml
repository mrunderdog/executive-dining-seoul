name: KDHC metadata probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect KDHC disclosure registry CSVs
        run: |
          python - <<'PY'
          import csv,io,urllib.request
          files={
            'management':'https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003514624&fileDetailSn=1&insertDataPrcus=N',
            'preinfo':'https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003514628&fileDetailSn=1&insertDataPrcus=N',
          }
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          for key,url in files.items():
              print('FILESET',key,url)
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':'https://www.data.go.kr/'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  blob=r.read()
              print('BYTES',len(blob),'MAGIC',blob[:20])
              txt=None
              for enc in ['utf-8-sig','cp949','euc-kr','utf-8']:
                  try:
                      txt=blob.decode(enc);print('ENC',enc);break
                  except: pass
              if txt is None: raise SystemExit('decode failed')
              rows=list(csv.reader(io.StringIO(txt)))
              print('HEADER',rows[0] if rows else [])
              print('ROWCOUNT',len(rows))
              for i,row in enumerate(rows,1):
                  joined=' | '.join(row)
                  if any(term in joined for term in ['업무추진비','기관장','경영공시','사전정보']):
                      print('MATCH',i,joined)
          PY
