name: KDHC ALIO probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve ALIO static disclosure download
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          jsurl='https://www.alio.go.kr/resources/js/page/portal/downloadUtils.js?v=202109131'
          req=urllib.request.Request(jsurl,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=60) as r:
              js=r.read().decode('utf-8',errors='replace')
          for fn in ['downReportContentFile','downReportAttachFile']:
              m=re.search(r'function\s+'+fn+r'\s*\([^)]*\)\s*\{',js)
              if m:
                  print('FUNC',fn,js[m.start():m.start()+1800].replace('\n',' '))
          doc='https://alio.go.kr/upload/disclosure/2025/04/10/2025041002972199/doc.html'
          req=urllib.request.Request(doc,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=60) as r:
              html=r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
          for pat in [r'id=["\']submission_no["\'][^>]*value=["\']([^"\']+)',r'submission[_-]?no',r'2025041002972199']:
              for m in list(re.finditer(pat,html,re.I))[:10]:
                  print('DOCMATCH',pat,html[max(0,m.start()-500):m.start()+1800].replace('\n',' '))
          PY
