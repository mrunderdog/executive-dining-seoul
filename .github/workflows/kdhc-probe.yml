name: KDHC target-id probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect KDHC management disclosure ordering
        run: |
          python - <<'PY'
          import csv,io,urllib.request
          url='https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003514624&fileDetailSn=1&insertDataPrcus=N'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.data.go.kr/'})
          with urllib.request.urlopen(req,timeout=60) as r: txt=r.read().decode('utf-8-sig')
          rows=list(csv.reader(io.StringIO(txt)))
          for i,row in enumerate(rows[1:],1):
              print('META',i,' | '.join(row))
          PY
