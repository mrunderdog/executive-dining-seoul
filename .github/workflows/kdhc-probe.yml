name: KDHC known-detail probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test reader against a known indexed KDHC detail page
        run: |
          python - <<'PY'
          import urllib.request
          targets=[
            'http://www.kdhc.co.kr/kdhc/infoOthbc/infoPrmlgtDtl/list.do?menuNo=200013&pageIndex=1&publictMth=BBS01&publictTrgetId=29',
            'https://www.kdhc.co.kr/kdhc/infoOthbc/infoPrmlgtDtl/list.do?menuNo=200013&pageIndex=1&publictMth=BBS01&publictTrgetId=29',
          ]
          for target in targets:
              print('TARGET',target)
              url='https://r.jina.ai/'+target
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      txt=r.read().decode('utf-8',errors='replace')
                  print('OK',len(txt))
                  print(txt[:40000])
              except Exception as e:
                  print('ERR',type(e).__name__,e)
          PY
