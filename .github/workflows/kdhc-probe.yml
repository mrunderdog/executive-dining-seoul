name: KDHC official-site route probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe official site through reader and network diagnostics
        shell: bash
        run: |
          set +e
          echo "== DNS =="
          getent ahosts www.kdhc.co.kr || true
          getent ahosts kdhc.co.kr || true
          echo "== HTTP probes =="
          curl -4 -I -L --connect-timeout 8 --max-time 20 http://www.kdhc.co.kr/ || true
          curl -4 -I -L --connect-timeout 8 --max-time 20 https://www.kdhc.co.kr/ || true
          echo "== Jina reader =="
          python - <<'PY'
          import re,urllib.request
          urls=[
            'https://r.jina.ai/https://www.kdhc.co.kr/',
            'https://r.jina.ai/http://www.kdhc.co.kr/',
          ]
          for url in urls:
              print('READER',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      txt=r.read().decode('utf-8',errors='replace')
                  print('BYTES',len(txt))
                  print(txt[:30000])
              except Exception as e:
                  print('ERR',type(e).__name__,e)
          PY
