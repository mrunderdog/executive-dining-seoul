name: KDHC source-link probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trace merchant-level KDHC source links
        run: |
          python - <<'PY'
          import re, html, urllib.parse, urllib.request
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          urls=[
            'https://gonggongbap.kr/restaurants/419826',
            'https://gonggongbap.kr/restaurants/401570',
          ]
          for url in urls:
              print('PAGE',url)
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read();cs=r.headers.get_content_charset() or 'utf-8'
              doc=raw.decode(cs,errors='replace')
              print('BYTES',len(doc))
              for term in ['한국지역난방공사','원문 보기','2026. 03. 25','2025. 12. 24','source','kdhc','alio']:
                  for m in list(re.finditer(re.escape(term),doc,re.I))[:10]:
                      print('SNIP',term,doc[max(0,m.start()-3000):min(len(doc),m.start()+7000)].replace('\n',' ')[:10000])
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',doc,re.S|re.I):
                  href=html.unescape(m.group(1))
                  text=' '.join(re.sub(r'<[^>]+>',' ',m.group(2)).split())
                  if re.search(r'원문|source|kdhc|alio|지역난방',text+' '+href,re.I):
                      print('LINK',text,urllib.parse.urljoin(url,href))
          PY
