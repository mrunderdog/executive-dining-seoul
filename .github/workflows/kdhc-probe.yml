name: KDHC ALIO probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX parser
        run: pip install openpyxl==3.1.5
      - name: Inspect current KDHC institution-head workbook
        run: |
          python - <<'PY'
          import io,json,re,time,urllib.request
          from openpyxl import load_workbook
          pages=[
              'https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0261&disclosureNo=&reportFormRootNo=20701',
              'https://alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0261&disclosureNo=&reportFormRootNo=20701',
          ]
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          html=None;page=None
          for candidate in pages:
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(candidate,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
                      with urllib.request.urlopen(req,timeout=35) as r:
                          html=r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
                      page=candidate;break
                  except Exception as e:
                      print('PAGE_RETRY',candidate,attempt+1,type(e).__name__,e);time.sleep(attempt+1)
              if html:break
          if not html: raise SystemExit('KDHC ALIO page unavailable')
          dm=re.search(r'disclosureNo\s*:\s*"([^"]+)"',html)
          opts=re.findall(r'<option\s+value="([^"]+)">\s*([^<]+\.xlsx?)\s*</option>',html,re.I)
          print('DISCLOSURE',dm.group(1) if dm else None)
          print('OPTIONS',opts)
          if not dm or not opts: raise SystemExit('KDHC attachment metadata missing')
          disclosure=dm.group(1)
          candidates=[x for x in opts if '2025' in x[1]]
          if not candidates: candidates=opts[:1]
          file_no,file_name=candidates[0]
          urls=[
              f'https://www.alio.go.kr/download/file.json?d={disclosure}&f={file_no}',
              f'https://alio.go.kr/download/file.json?d={disclosure}&f={file_no}',
          ]
          blob=None
          for url in urls:
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':page})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          blob=r.read()
                          print('FILE',file_name,'URL',url,'BYTES',len(blob),'MAGIC',blob[:8],'CTYPE',r.headers.get('Content-Type'))
                      break
                  except Exception as e:
                      print('FILE_RETRY',url,attempt+1,type(e).__name__,e);time.sleep(attempt+1)
              if blob:break
          if not blob: raise SystemExit('KDHC workbook download failed')
          wb=load_workbook(io.BytesIO(blob),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
              print('SHEET',ws.title)
              for i,row in enumerate(ws.iter_rows(values_only=True),1):
                  vals=['' if v is None else str(v) for v in row]
                  if any(x.strip() for x in vals): print('ROW',i,json.dumps(vals,ensure_ascii=False))
                  if i>=160: break
          PY
