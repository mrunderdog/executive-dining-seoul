name: KDHC source-link recovery
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recover original KDHC links through rendered public index
        run: |
          python - <<'PY'
          import re,urllib.request
          urls=[
            'https://r.jina.ai/https://gonggongbap.kr/restaurants/419826',
            'https://r.jina.ai/https://gonggongbap.kr/restaurants/401570',
            'https://r.jina.ai/https://gonggongbap.kr/restaurants/405594',
          ]
          for url in urls:
              print('URL',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      txt=r.read().decode('utf-8',errors='replace')
              except Exception as e:
                  print('ERR',type(e).__name__,e);continue
              print('BYTES',len(txt))
              for line in txt.splitlines():
                  if ('한국지역난방공사' in line or '원문' in line or 'kdhc' in line.lower()) and ('http' in line or '원문' in line):
                      print('LINE',line)
              for m in re.finditer(r'https?://[^\s)\]>]+',txt):
                  u=m.group(0)
                  if 'kdhc' in u.lower(): print('KDHC_URL',u)
          PY
