name: KDHC official-route probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read KDHC official disclosure lists through reader
        run: |
          python - <<'PY'
          import re, urllib.request
          targets=[
            'https://www.kdhc.co.kr/kdhc/publict/publict/list.do?menuNo=200077',
            'https://www.kdhc.co.kr/kdhc/infoOthbc/infoPrmlgt/list.do?menuNo=200013',
          ]
          for target in targets:
              url='https://r.jina.ai/'+target
              print('TARGET',target)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      txt=r.read().decode('utf-8',errors='replace')
              except Exception as e:
                  print('ERR',type(e).__name__,e);continue
              print('BYTES',len(txt))
              for term in ['경영진 업무추진비','기관장 업무추진비','업무추진비','재무처 재무부']:
                  ms=list(re.finditer(re.escape(term),txt,re.I))
                  print('TERM',term,'COUNT',len(ms))
                  for m in ms[:12]:
                      print('SNIP',txt[max(0,m.start()-2200):min(len(txt),m.start()+6500)])
          PY
