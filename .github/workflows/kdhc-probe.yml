name: KDHC ALIO probe
on:
  push:
    branches: [feat/kdhc-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect KDHC ALIO disclosure and attachment links
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          urls=[
            'https://alio.go.kr/upload/disclosure/2025/04/10/2025041002972199/doc.html',
            'https://www.alio.go.kr/upload/disclosure/2025/04/10/2025041002972199/doc.html',
          ]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read();cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          html=None;base=None
          for u in urls:
              try:
                  html=get(u);base=u;print('FETCH',u,'BYTES',len(html));break
              except Exception as e: print('ERR',u,type(e).__name__,e)
          if not html: raise SystemExit('static ALIO disclosure unavailable')
          pats=['한국지역난방공사','업무추진비(2024).xlsx','download','fileNo','disclosureNo','submissionNo','2025041002972199']
          for pat in pats:
              for m in list(re.finditer(re.escape(pat),html,re.I))[:4]:
                  print('SNIP',pat,html[max(0,m.start()-3000):min(len(html),m.start()+9000)].replace('\n',' ')[:12000])
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',html,re.S|re.I):
              href=html.unescape(m.group(1)) if False else m.group(1)
              text=' '.join(re.sub(r'<[^>]+>',' ',m.group(2)).split())
              if re.search(r'업무추진비|xlsx|xls|download|file',text+' '+href,re.I):
                  print('LINK',text,urllib.parse.urljoin(base,href))
          for m in re.finditer(r'(?:src|href)=["\']([^"\']+\.js[^"\']*)["\']',html,re.I):
              print('SCRIPT',urllib.parse.urljoin(base,m.group(1)))
          PY
