name: Verify official restaurant licenses (next seven regions)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pipeline/audit_restaurant_licenses.py'\n      - 'pipeline/build_license_review_queue.py'\n      - 'pipeline/test_license_review_queue.py'
      - 'pipeline/localdata_regions.py'
      - 'sources/localdata_orgcodes.json'
      - '.github/workflows/official-restaurant-license-next-seven.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-restaurant-license-next-seven.yml'
permissions:
  contents: read
jobs:
  official-seven-region-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official CSV and audit published venues in seven new jurisdictions
        run: |
          python pipeline/audit_restaurant_licenses.py --fetch-official --scope all \
            --regions 경기의정부시,서울강북구,충남보령시,경기수원시,경기과천시,서울관악구,서울은평구 \
            --output reports/next-seven-region-license-audit.json
      - name: Check dataset isolation and evidence semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/next-seven-region-license-audit.json').read_text(encoding='utf-8'))
          expected={'경기의정부시','서울강북구','충남보령시','경기수원시','경기과천시','서울관악구','서울은평구'}
          assert set(d['geographic_scope'])==expected
          assert len(d['sources'])==7
          assert d['total_venues']>=63
          assert sum(r['venues'] for r in d['by_region'].values())==d['total_venues']
          assert all(s['jurisdiction_confirmed_rows']>0 and s['routable_rows']>0
                     and s['jurisdiction_confirmed_rows']/s['routable_rows']>=0.8 for s in d['sources'])
          assert all(not v['payment_branch_verified'] and not v['personal_attendance_verified']
                     for v in d['venues'])
          print('Seven-region evidence verified:',
                json.dumps({'total':d['total_venues'],'exact_name_address':d['exact_business_and_address_matches'],
                 'name_building':d['name_and_building_matches'],'by_region':d['by_region']},ensure_ascii=False))
          PY
      - name: Unit-test review queue\n        run: PYTHONPATH=pipeline python -m unittest pipeline/test_license_review_queue.py\n      - name: Build unmatched evidence review queue\n        run: |\n          python pipeline/build_license_review_queue.py --audit reports/next-seven-region-license-audit.json --output reports/next-seven-unmatched-review-queue.json\n      - name: Upload official-source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localdata-next-seven-official-audit
          path: |\n            reports/next-seven-region-license-audit.json\n            reports/next-seven-unmatched-review-queue.json
          retention-days: 30
          if-no-files-found: warn
