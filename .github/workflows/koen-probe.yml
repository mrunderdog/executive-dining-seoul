name: KOEN finalize
on:
  push:
    branches: [feat/koen-adapter]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record KOEN aggregate-only status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('sources/public_enterprise_registry.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['as_of']='2026-10-02'
          d['sources']=[x for x in d['sources'] if x.get('key')!='koen']
          d['sources'].append({
            'key':'koen',
            'institution':'한국남동발전',
            'cohort':'public_enterprise_leadership',
            'verified':True,
            'publish':False,
            'refresh_policy':'track_only',
            'default_role':'기관장',
            'format_hint':'xlsx-aggregate-only',
            'listing_urls':['https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId=C0042&disclosureNo=&reportFormRootNo=20701'],
            'note':'ALIO 기관장 업무추진비 정기공시(C0042 / 20701) 확인. 2026 공시의 2025년 기관장 업무추진비 내역 XLSX를 직접 검증했으나 연월·주요내역·건수·금액만 있고 merchant/사용처가 없어 지도 데이터로 출판 불가.'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/public_enterprise_registry.json
          git commit -m "data: classify KOEN disclosure as aggregate-only"
          git push origin HEAD:feat/koen-adapter
