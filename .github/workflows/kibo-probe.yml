name: KIBO source probe
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_kibo.py'
      - '.github/workflows/kibo-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python pipeline/probe_kibo.py
