name: Public enterprise source QA

on:
  push:
    branches:
      - feat/public-enterprise-kepco-kogas

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Inspect official board HTML patterns
        run: |
          python - <<'PY'
          import re, urllib.request
          urls={
            'kepco':'https://www.kepco.co.kr/home/disclosure/mandisclosure/etc/expenses.do',
            'kogas':'https://www.kogas.or.kr/site/koGas/goBoard.do?Key=1060101050000&boardNo=57',
          }
          for key,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
              print('HTML',key,'bytes',len(html))
              targets=["'26. 7월 사장 업무추진비 세부추진내역","2026년 5월 기관장·임원 업무추진비 사용내역"]
              found=False
              for p in targets:
                  m=re.search(re.escape(p),html,re.I)
                  if m:
                      print('TARGETSNIP',key,p,html[max(0,m.start()-2600):m.start()+5200].replace('\n',' ')[:7800])
                      found=True
                      break
              if not found:
                  print('NOSNIP',key)
              if key=='kogas':
                  m=re.search(r'function\\s+readPermissionChk\\s*\\([^)]*\\)\\s*\\{',html,re.I)
                  if m: print('FUNC_KOGAS',html[m.start():m.start()+5000].replace('\\n',' ')[:5000])
              if key=='kepco':
                  for pat in [r'1454',r'사장\\s*업무추진비',r'fn_FileDown',r'fileDown',r'download']:
                      m=re.search(pat,html,re.I)
                      if m:
                          print('FUNC_KEPCO',pat,html[max(0,m.start()-2200):m.start()+5000].replace('\\n',' ')[:7000])
                          break
          PY
      - name: Discover sources
        run: |
          python pipeline/public_enterprise_discovery.py --detail-limit 24
          python - <<'PY'
          import json
          d=json.load(open('reports/public-enterprise-discovery.json',encoding='utf-8'))
          for s in d['sources']:
              print('DISCOVERY',json.dumps({k:s.get(k) for k in ['key','institution','status','parseable_attachments']},ensure_ascii=False),'attachments',len(s.get('attachments',[])),'errors',len(s.get('errors',[])))
          PY
      - name: Ingest
        run: python pipeline/ingest_public_enterprise_expense.py
      - name: Build candidates
        run: python pipeline/build_public_enterprise_candidates.py
      - name: Inspect outputs
        run: |
          python - <<'PY'
          import json
          raw=json.load(open('data/raw/public_enterprise_expense.json',encoding='utf-8'))
          cand=json.load(open('reports/public-enterprise-candidates.json',encoding='utf-8'))
          from collections import Counter
          print('RAW_ROWS',len(raw.get('rows',[])))
          print('INSTITUTIONS',json.dumps(Counter(r.get('institution') for r in raw.get('rows',[])),ensure_ascii=False))
          print('FILES',len(raw.get('files',[])),'ERRORS',len(raw.get('errors',[])))
          print('CANDIDATES',cand.get('eligible_count'),cand.get('entity_count'),cand.get('meal_rows'))
          for c in cand.get('candidates',[])[:25]:
              print('CAND',json.dumps({k:c.get(k) for k in ['merchant','address','visits','spend','institutions','score']},ensure_ascii=False))
          PY
      - name: Build site
        run: python pipeline/build_site.py --output dist/index.html
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/ed-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/ed-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/ed-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
