name: KOMIPO v2 final QA
on:
  push:
    branches: [feat/komipo-adapter-v2]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Run clean KOMIPO pipeline
        run: |
          python -m py_compile pipeline/public_enterprise_komipo.py
          python pipeline/public_enterprise_komipo.py
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
          python pipeline/geocode_extra_cache.py
          python pipeline/geocode_cache.py --mode auto
      - name: Verify source and map records
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'pipeline')
          from extra_published import public_enterprise_records
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          raw=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          src=next(x for x in d['sources'] if x.get('key')=='komipo')
          rows=[x for x in raw.get('rows',[]) if x.get('institution')=='한국중부발전']
          cs=[x for x in cand.get('candidates',[]) if '한국중부발전' in (x.get('institutions') or [])]
          rec=[x for x in public_enterprise_records() if '한국중부발전' in (x.get('institutions') or [])]
          print('KOMIPO_QA',json.dumps({'status':src.get('status'),'posts':src.get('parseable_attachments'),'rows':len(rows),'candidates':len(cs),'published':len(rec),'errors':src.get('errors')},ensure_ascii=False))
          assert src.get('status')=='PARSEABLE_FOUND'
          assert len(rows)>=10
          assert any(x.get('merchant')=='유일초밥' for x in rows)
          assert len(cs)>=8
          by_name={x.get('name'):x for x in rec}
          required=['유일초밥','보령한우','윤가네간장게장','시골집염소탕','산도155','석갈비','어영차바다야']
          assert all(by_name.get(n,{}).get('address') for n in required)
          cache=json.loads(Path('data/geocode_cache.json').read_text(encoding='utf-8')).get('records') or {}
          geocoded=sum(1 for n in required if isinstance((cache.get(n+'|공기업·공공기관') or {}).get('lat'),(int,float)) and isinstance((cache.get(n+'|공기업·공공기관') or {}).get('lon'),(int,float)))
          print('KOMIPO_GEOCODED',geocoded)
          assert geocoded>=6
          PY
      - name: Quality and browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/quality_gate.py
          python pipeline/regression_checks.py
          python pipeline/build_site.py --output dist/index.html
          node --check site/app.js
          grep -q '한국중부발전' dist/index.html
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/komipo-v2-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/komipo-v2-chrome --window-size=1440,900 \
            http://127.0.0.1:8765/ >/tmp/komipo-v2-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for ATTEMPT in 1 2 3; do
            if node pipeline/browser_map_smoke.mjs; then break; fi
            if [ "$ATTEMPT" -eq 3 ]; then exit 1; fi
            sleep 2
          done
