name: KOMIPO board probe
on:
  push:
    branches: [feat/komipo-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect president tab and attachments
        run: |
          python - <<'PY'
          import re,html,ssl,urllib.parse,urllib.request
          from concurrent.futures import ThreadPoolExecutor,as_completed
          base='https://www.komipo.co.kr/kor/board/BRD_000065/boardMain.do?mnCd=FN010712'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1';ctx=ssl._create_unverified_context()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=18,context=ctx) as r:
                  raw=r.read();cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          main=get(base)
          print('MAIN_BYTES',len(main))
          # Extract role-tab URLs directly from HTML instead of guessing codes.
          tabs=[]
          for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',main,re.S|re.I):
              attrs=m.group(1);txt=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',m.group(2))).split())
              if txt not in {'전체','사장','상임감사위원','본부장','본사처·실장','사업소장','부서장'}:continue
              hrefm=re.search(r'href=["\']([^"\']+)',attrs,re.I)
              onclick=re.search(r'onclick=["\']([^"\']+)',attrs,re.I)
              tabs.append((txt,hrefm.group(1) if hrefm else '',onclick.group(1) if onclick else ''))
          print('TABS',tabs)
          president=[x for x in tabs if x[0]=='사장']
          codes=[]
          for _,href,onclick in president:
              for src in (href,onclick):
                  codes += re.findall(r'(KH\d+)',src)
          codes=list(dict.fromkeys(codes))
          if not codes:
              # Known page currently exposes this role-code family; only probe a handful in parallel.
              codes=['KH041301','KH041302','KH041303','KH041304','KH041305','KH041306']
          print('PRES_CODES',codes)
          def page_fetch(cp):
              code,page=cp;u=base+f'&schTabCd={code}&pageIndex={page}'
              try:return code,page,u,get(u)
              except Exception as e:return code,page,u,e
          pages=[]
          with ThreadPoolExecutor(max_workers=12) as pool:
              futs=[pool.submit(page_fetch,(c,p)) for c in codes for p in range(1,8)]
              for fut in as_completed(futs):pages.append(fut.result())
          posts=[];seen=set()
          for code,page,u,doc in pages:
              if isinstance(doc,Exception):continue
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',doc,re.S|re.I):
                  attrs=m.group(1);txt=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',m.group(2))).split())
                  if '사장' not in txt or '업무추진비' not in txt:continue
                  if not re.search(r'20(?:24|25|26)년',txt):continue
                  hrefm=re.search(r'href=["\']([^"\']+)',attrs,re.I);onclick=re.search(r'onclick=["\']([^"\']+)',attrs,re.I)
                  key=(txt,hrefm.group(1) if hrefm else '',onclick.group(1) if onclick else '')
                  if key not in seen:seen.add(key);posts.append((code,page)+key)
          posts.sort(reverse=True)
          print('POST_COUNT',len(posts))
          for x in posts[:40]:print('POST',x)
          def detail_url(item):
              code,page,txt,href,onclick=item
              if href and href.lower() not in ('javascript:;','#'):return urllib.parse.urljoin(base,href)
              nums=re.findall(r'\d{4,}',onclick)
              return f'https://www.komipo.co.kr/kor/board/BRD_000065/boardView.do?boardSeq={nums[0]}&mnCd=FN010712&pageIndex=1&schTabCd={code}' if nums else None
          for item in posts[:6]:
              du=detail_url(item)
              if not du:continue
              try:d=get(du)
              except Exception as e:print('DETAIL_ERR',du,type(e).__name__,e);continue
              print('DETAIL',item[2],du,'BYTES',len(d))
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',d,re.S|re.I):
                  attrs=m.group(1);label=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',m.group(2))).split())
                  if re.search(r'xls|xlsx|pdf|hwp|첨부|다운',label+' '+attrs,re.I):print('ATTACH_A',label,attrs)
              for pat in ['fileDown','download','atch','fileSeq','fileNo','boardFile']:
                  m=re.search(pat,d,re.I)
                  if m:print('DETAIL_SNIP',pat,d[max(0,m.start()-1400):m.start()+4200].replace('\n',' ')[:5600])
          PY
