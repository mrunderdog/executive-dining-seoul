name: KOMIPO merchant verdict
on:
  push:
    branches: [feat/komipo-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download latest president HWPX and inspect text
        run: |
          python - <<'PY'
          import re,html,ssl,urllib.parse,urllib.request,zipfile,io
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1';ctx=ssl._create_unverified_context()
          referer='https://www.komipo.co.kr/kor/board/BRD_000065/boardView.do?mnCd=FN010712'
          fields={
            'pageIndex':'1','mnCd':'FN010712','boardSeq':'22892','boardCd':'BRD_000065',
            'atchFileId':'CMS0000000002026090813333051110059','fileSn':'1','formNo':'','schTabCd':'KH041301'
          }
          data=urllib.parse.urlencode(fields).encode()
          headers={'User-Agent':ua,'Accept':'*/*','Referer':referer,'Content-Type':'application/x-www-form-urlencoded'}
          req=urllib.request.Request('https://www.komipo.co.kr/atch/fileDown.do',data=data,headers=headers)
          with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
              blob=r.read(); print('STATUS',r.status,'CTYPE',r.headers.get('Content-Type'),'DISP',r.headers.get('Content-Disposition'),'BYTES',len(blob),'MAGIC',blob[:8])
          if not zipfile.is_zipfile(io.BytesIO(blob)):
              print('NOT_ZIP_HEAD',blob[:500]); raise SystemExit('download is not HWPX/ZIP')
          z=zipfile.ZipFile(io.BytesIO(blob))
          names=[n for n in z.namelist() if n.lower().endswith('.xml')]
          texts=[]
          for n in names:
              s=z.read(n).decode('utf-8',errors='ignore')
              # HWPX text nodes use hp:t; stripping tags preserves table cell order reasonably for verdicting.
              vals=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in re.findall(r'<(?:hp:)?t[^>]*>(.*?)</(?:hp:)?t>',s,re.S|re.I)]
              vals=[v for v in vals if v]
              if vals:texts.extend(vals)
          print('TEXT',repr(texts[:500]))
          joined=' | '.join(texts)
          print('MERCHANT_TERMS',[(x, x in joined) for x in ['사용처','장소','상호','업체명','식당']])
          print('VERDICT_TEXT_LEN',len(joined))
          PY
