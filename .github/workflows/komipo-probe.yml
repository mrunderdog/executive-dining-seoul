name: KOMIPO board probe
on:
  push:
    branches: [feat/komipo-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect president tab and attachments
        run: |
          python - <<'PY'
          import re,html,urllib.parse,urllib.request
          base='https://www.komipo.co.kr/kor/board/BRD_000065/boardMain.do?mnCd=FN010712'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read(); cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          main=get(base)
          print('MAIN_BYTES',len(main))
          # Print tab controls / schTabCd values around role labels.
          for label in ['사장','상임감사위원','본부장','본사처·실장','사업소장','부서장']:
              for m in list(re.finditer(label,main))[:4]:
                  print('TAB_SNIP',label,main[max(0,m.start()-1200):m.start()+2200].replace('\n',' ')[:3400])
          vals=sorted(set(re.findall(r'schTabCd[=\\\"\'\s:]+([A-Za-z0-9_]+)',main)))
          print('TAB_CODES',vals)
          # Probe likely tab codes and pages; collect president posts.
          candidates=['']+['KH04130'+str(i) for i in range(1,9)]
          seen=set();pres=[]
          for code in candidates:
              for page in range(1,6):
                  url=base+f'&schTabCd={code}&pageIndex={page}'
                  try: doc=get(url)
                  except Exception as e:
                      print('PAGE_ERR',code,page,type(e).__name__,e);continue
                  text=' '.join(re.sub(r'<[^>]+>',' ',doc).split())
                  titles=re.findall(r'(20(?:24|25|26)년[^<\n]{0,100}?사장[^<\n]{0,100}?업무추진비[^<\n]{0,100})',doc,re.I)
                  if titles: print('HIT_PAGE',code,page,[html.unescape(re.sub(r'<[^>]+>',' ',x)) for x in titles[:20]])
                  for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',doc,re.S|re.I):
                      attrs=m.group(1); txt=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',m.group(2))).split())
                      if '사장' not in txt or '업무추진비' not in txt: continue
                      hrefm=re.search(r'href=[\"\']([^\"\']+)',attrs,re.I)
                      onclick=re.search(r'onclick=[\"\']([^\"\']+)',attrs,re.I)
                      key=(txt,hrefm.group(1) if hrefm else '',onclick.group(1) if onclick else '')
                      if key in seen: continue
                      seen.add(key);pres.append(key)
          print('PRESIDENT_LINKS')
          for x in pres[:100]:print(x)
          # Resolve any direct boardView link and inspect attachment markup.
          for txt,href,onclick in pres[:8]:
              detail=None
              if href and href.lower()!='javascript:;': detail=urllib.parse.urljoin(base,href)
              if not detail:
                  nums=re.findall(r'\d{4,}',onclick)
                  if nums:
                      detail=f'https://www.komipo.co.kr/kor/board/BRD_000065/boardView.do?boardSeq={nums[0]}&mnCd=FN010712&pageIndex=1'
              if not detail: continue
              try:ddoc=get(detail)
              except Exception as e: print('DETAIL_ERR',detail,type(e).__name__,e);continue
              print('DETAIL',txt,detail,'BYTES',len(ddoc))
              for pat in ['첨부파일','xlsx','xls','pdf','fileDown','download','atch','fileSeq','fileNo']:
                  m=re.search(pat,ddoc,re.I)
                  if m: print('DETAIL_SNIP',pat,ddoc[max(0,m.start()-2500):m.start()+7000].replace('\n',' ')[:9500])
          PY
