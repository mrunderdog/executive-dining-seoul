name: KOMIPO source registration
on:
  push:
    branches: [feat/komipo-adapter]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Register KOMIPO source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('sources/public_enterprise_registry.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if not any(x.get('key')=='komipo' for x in d.get('sources',[])):
              d['sources'].append({
                  'key':'komipo',
                  'institution':'한국중부발전',
                  'cohort':'public_enterprise_leadership',
                  'verified':True,
                  'publish':True,
                  'refresh_policy':'monthly',
                  'default_role':'사장',
                  'format_hint':'hwpx-detail',
                  'lookback_years':1,
                  'listing_urls':['https://www.komipo.co.kr/kor/board/BRD_000065/boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1'],
                  'note':'한국중부발전 공식 업무추진비 게시판 사장 탭(KH041301). 월별 HWPX에 사용일자·목적·사용처(장소)·인원·금액의 거래별 내역이 공개됨. KOMIPO 전용 adapter가 TLS runner 우회와 HWPX 표 파싱을 담당.'
              })
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/public_enterprise_registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: register KOMIPO president expense source'
          git push origin HEAD:feat/komipo-adapter
