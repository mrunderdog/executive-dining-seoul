name: KOMIPO merchant verdict
on:
  push:
    branches: [feat/komipo-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Print download script sources only
        run: |
          python - <<'PY'
          import re,html,ssl,urllib.parse,urllib.request
          base='https://www.komipo.co.kr/kor/board/BRD_000065/'
          page=base+'boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1';ctx=ssl._create_unverified_context()
          data=urllib.parse.urlencode({'pageIndex':'1','mnCd':'FN010712','boardSeq':'22892','schTabCd':'KH041301'}).encode()
          h={'User-Agent':ua,'Accept':'text/html,*/*','Referer':page,'Content-Type':'application/x-www-form-urlencoded'}
          with urllib.request.urlopen(urllib.request.Request(base+'boardView.do?mnCd=FN010712',data=data,headers=h),timeout=30,context=ctx) as r:
              doc=r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
          scripts=[urllib.parse.urljoin(base,html.unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',doc,re.I)]
          print('SCRIPTS',repr(scripts))
          token='CMS0000000002026090813333051110059'
          i=doc.find("download('"+token)
          print('CALL_SNIP',doc[max(0,i-1800):i+2200].replace('\n',' ') if i>=0 else 'missing')
          for pat in ['board.download','var board','const board','let board']:
              m=re.search(re.escape(pat),doc,re.I)
              if m: print('INLINE',pat,doc[max(0,m.start()-1200):m.start()+3500].replace('\n',' ')[:4700])
          PY
