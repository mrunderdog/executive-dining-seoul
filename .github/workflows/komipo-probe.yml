name: KOMIPO focused QA
on:
  push:
    branches: [feat/komipo-adapter]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install document parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Run focused KOMIPO adapter
        run: |
          python pipeline/public_enterprise_komipo.py
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
      - name: Verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          c=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          src=next(x for x in d['sources'] if x.get('key')=='komipo')
          rows=[x for x in r.get('rows',[]) if x.get('institution')=='한국중부발전']
          cs=[x for x in c.get('candidates',[]) if '한국중부발전' in (x.get('institutions') or [])]
          print('KOMIPO_DISCOVERY',json.dumps({'status':src.get('status'),'posts':src.get('parseable_attachments'),'rows':len(src.get('inline_rows') or []),'errors':src.get('errors')},ensure_ascii=False))
          print('KOMIPO_ROWS',json.dumps(rows,ensure_ascii=False))
          print('KOMIPO_CANDIDATES',json.dumps(cs,ensure_ascii=False))
          assert src.get('status')=='PARSEABLE_FOUND'
          assert rows and any('유일초밥' in (x.get('merchant') or '') for x in rows)
          assert cs
          PY
