name: KOMIPO board probe
on:
  push:
    branches: [feat/komipo-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve president detail and attachment endpoint
        run: |
          python - <<'PY'
          import re,html,ssl,urllib.parse,urllib.request
          base='https://www.komipo.co.kr/kor/board/BRD_000065/boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1';ctx=ssl._create_unverified_context()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=25,context=ctx) as r:
                  raw=r.read();cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          doc=get(base)
          print('PAGE_BYTES',len(doc))
          # function definition
          for pat in ['board.view = function','board.view=function','view : function','board.view']:
              m=re.search(re.escape(pat),doc,re.I)
              if m: print('VIEW_FUNC_SNIP',doc[max(0,m.start()-2200):m.start()+6500].replace('\n',' ')[:8700])
          count=0
          for m in re.finditer(r'<a\b[^>]*>.*?</a>',doc,re.S|re.I):
              tag=m.group(0);txt=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',tag)).split())
              if '사장' in txt and '업무추진비' in txt and re.search(r'20(?:25|26)년',txt):
                  print('PRES_ANCHOR',tag.replace('\n',' ')[:5000]);count+=1
                  if count>=5:break
          # Also expose nearby hidden inputs for the first matching title.
          m=re.search(r'2026년\s*8월\s*사장\s*업무추진비',doc)
          if m: print('TITLE_CONTEXT',doc[max(0,m.start()-5000):m.start()+7000].replace('\n',' ')[:12000])
          PY
