name: KOMIPO merchant verdict
on:
  push:
    branches: [feat/komipo-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect two president posts only
        run: |
          python - <<'PY'
          import re,html,ssl,urllib.parse,urllib.request
          base='https://www.komipo.co.kr/kor/board/BRD_000065/'
          page=base+'boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1';ctx=ssl._create_unverified_context()
          def request(url,data=None):
              h={'User-Agent':ua,'Accept':'text/html,*/*','Referer':page,'Content-Type':'application/x-www-form-urlencoded'}
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h),timeout=30,context=ctx) as r:
                  raw=r.read(); cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          def clean(s): return ' '.join(html.unescape(re.sub(r'<[^>]+>',' ',s or '')).split())
          for seq,title in [('22892','2026-08'),('21403','2025-12')]:
              data=urllib.parse.urlencode({'pageIndex':'1','mnCd':'FN010712','boardSeq':seq,'schTabCd':'KH041301'}).encode()
              doc=request(base+'boardView.do?mnCd=FN010712',data)
              print('POST',title,seq,'bytes='+str(len(doc)))
              found=[]
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',doc,re.S|re.I):
                  attrs=m.group(1); label=clean(m.group(2))
                  joined=label+' '+attrs
                  if re.search(r'\.xlsx?|\.xls|\.pdf|\.hwp|\.hwpx|첨부|다운|file',joined,re.I):
                      href=(re.search(r'href=["\']([^"\']+)',attrs,re.I) or [None,''])[1]
                      onclick=(re.search(r'onclick=["\']([^"\']+)',attrs,re.I) or [None,''])[1]
                      found.append((label,html.unescape(href),html.unescape(onclick)))
              print('ATTACHMENTS',title,repr(found[:12]))
              # compact JS/function clues only
              clues=[]
              for pat in [r'fileDown\s*\([^)]*\)',r'download\w*\s*\([^)]*\)',r'fn_\w*down\w*\s*\([^)]*\)']:
                  clues += [x.group(0)[:500] for x in re.finditer(pat,doc,re.I)]
              print('DOWNLOAD_CLUES',title,repr(clues[:12]))
          PY
