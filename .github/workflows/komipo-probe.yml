name: KOMIPO board probe
on:
  push:
    branches: [feat/komipo-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect latest president detail attachments
        run: |
          python - <<'PY'
          import re,html,ssl,urllib.parse,urllib.request
          base='https://www.komipo.co.kr/kor/board/BRD_000065/'
          page=base+'boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1'
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1';ctx=ssl._create_unverified_context()
          def req(url,data=None):
              headers={'User-Agent':ua,'Accept':'text/html,*/*','Referer':page,'Content-Type':'application/x-www-form-urlencoded'}
              r=urllib.request.Request(url,data=data,headers=headers)
              with urllib.request.urlopen(r,timeout=30,context=ctx) as x:
                  raw=x.read();cs=x.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          for seq,title in [('22892','2026-08'),('21403','2025-12')]:
              data=urllib.parse.urlencode({'pageIndex':'1','mnCd':'FN010712','boardSeq':seq,'schTabCd':'KH041301'}).encode()
              doc=req(base+'boardView.do?mnCd=FN010712',data)
              print('DETAIL',title,seq,'BYTES',len(doc))
              # basic view fields / content
              for pat in ['첨부파일','업로드파일','xlsx','xls','pdf','hwp','fileDown','download','atch','fileSeq','fileNo','fileSn','boardFile']:
                  for m in list(re.finditer(pat,doc,re.I))[:3]:
                      print('SNIP',title,pat,doc[max(0,m.start()-2200):m.start()+6500].replace('\n',' ')[:8700])
              # every likely attachment/download anchor
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',doc,re.S|re.I):
                  attrs=m.group(1);label=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',m.group(2))).split())
                  if re.search(r'xls|xlsx|pdf|hwp|첨부|다운|file',label+' '+attrs,re.I):
                      print('ATTACH_A',title,label,attrs)
              # forms and download JS definitions
              for m in re.finditer(r'<form\b[^>]*>.*?</form>',doc,re.S|re.I):
                  block=m.group(0)
                  if re.search(r'file|down|attach',block,re.I):print('FORM',title,block.replace('\n',' ')[:9000])
          PY
