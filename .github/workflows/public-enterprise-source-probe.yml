name: Public enterprise source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-enterprise-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install workbook parser
        run: pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Test KAMCO eGov file endpoint
        run: |
          python - <<'PY'
          import io, json, http.cookiejar, urllib.request
          import openpyxl
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36'
          parent='https://www.kamco.or.kr/portal/bbs/view.do?bIdx=22548&mId=0601060603&ptIdx=479'
          endpoints=[
            'https://www.kamco.or.kr/cmm/fms/FileDown.do?atchFileId=FILE_000000000011287&fileSn=0',
            'https://www.kamco.or.kr/cmm/fms/FileDown.do?atchFileId=FILE_000000000011287&fileSn=0&bbsId=',
          ]
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          opener.addheaders=[('User-Agent',ua),('Accept-Language','ko-KR,ko;q=0.9,en;q=0.7')]
          opener.open(parent,timeout=45).read()
          for url in endpoints:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':parent,'Accept':'*/*'})
              try:
                  res=opener.open(req,timeout=45)
                  raw=res.read()
                  print('ENDPOINT',url)
                  print('STATUS',getattr(res,'status',None),'TYPE',res.headers.get('Content-Type'),'DISP',res.headers.get('Content-Disposition'),'BYTES',len(raw),'MAGIC',raw[:8])
                  if raw[:2]==b'PK':
                      wb=openpyxl.load_workbook(io.BytesIO(raw),data_only=True,read_only=True)
                      print('SHEETS',wb.sheetnames)
                      for ws in wb.worksheets[:3]:
                          print('SHEET',ws.title,'DIM',ws.max_row,ws.max_column)
                          for idx,row in enumerate(ws.iter_rows(min_row=1,max_row=min(ws.max_row,40),values_only=True),start=1):
                              vals=[str(x).strip() if x is not None else '' for x in row[:14]]
                              if any(vals): print('ROW',idx,json.dumps(vals,ensure_ascii=False))
                  else:
                      print('BODY',raw[:1200].decode('utf-8','replace'))
              except Exception as e:
                  print('ERROR',url,type(e).__name__,e)
          PY
