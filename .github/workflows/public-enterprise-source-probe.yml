name: Public enterprise source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-enterprise-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install workbook parser
        run: pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Inspect KAMCO workbook
        run: |
          python - <<'PY'
          import io, json, sys, urllib.request
          from pathlib import Path
          import openpyxl
          sys.path.insert(0,'pipeline')
          import public_enterprise_kamco as kamco
          fresh=kamco.discover(2026)
          print('KAMCO_PROBE',json.dumps({
              'status':fresh.get('status'),
              'pages':len(fresh.get('pages') or []),
              'attachments':len(fresh.get('attachments') or []),
              'errors':(fresh.get('errors') or [])[:5],
              'sample':(fresh.get('attachments') or [])[:3],
          },ensure_ascii=False))
          for att in (fresh.get('attachments') or [])[:3]:
              req=urllib.request.Request(att['url'],headers={'User-Agent':'Mozilla/5.0','Referer':att.get('parent') or 'https://www.kamco.or.kr/'})
              raw=urllib.request.urlopen(req,timeout=35).read()
              print('FILE',att['text'],'bytes=',len(raw),'magic=',raw[:8])
              wb=openpyxl.load_workbook(io.BytesIO(raw),data_only=True,read_only=True)
              print('SHEETS',wb.sheetnames)
              for ws in wb.worksheets[:2]:
                  print('SHEET',ws.title,'dim',ws.max_row,ws.max_column)
                  for idx,row in enumerate(ws.iter_rows(min_row=1,max_row=min(ws.max_row,25),values_only=True),start=1):
                      vals=[str(x).strip() if x is not None else '' for x in row[:12]]
                      if any(vals): print('ROW',idx,json.dumps(vals,ensure_ascii=False))
          PY
