name: Public enterprise source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-enterprise-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install workbook parser
        run: pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Probe KAMCO parsed rows
        run: |
          python -m py_compile pipeline/public_enterprise_kamco.py
          python pipeline/public_enterprise_kamco.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          x=next(s for s in d['sources'] if s.get('key')=='kamco')
          rows=x.get('inline_rows') or []
          print('KAMCO_RESULT',json.dumps({
              'status':x.get('status'),
              'pages':len(x.get('pages') or []),
              'attachments':len(x.get('attachments') or []),
              'rows':len(rows),
              'merchants':len({r.get('merchant') for r in rows}),
              'roles':sorted({r.get('role') for r in rows}),
              'dates':[min((r.get('used_date') for r in rows),default=''),max((r.get('used_date') for r in rows),default='')],
              'errors':(x.get('errors') or [])[:8],
              'sample':rows[:8],
          },ensure_ascii=False))
          if not rows:
              raise SystemExit('KAMCO produced no inline rows')
          PY
