name: Public enterprise source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-enterprise-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe KPS and KOMSCO
        run: |
          python -m py_compile pipeline/public_enterprise_kps.py pipeline/public_enterprise_komsco.py
          python pipeline/public_enterprise_kps.py
          python pipeline/public_enterprise_komsco.py
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,'pipeline')
          import public_enterprise_kps as kps
          import public_enterprise_komsco as komsco
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          for key in ('kps','komsco'):
              x=next((s for s in d.get('sources',[]) if s.get('key')==key),{})
              print('PROBE',key,json.dumps({
                  'status':x.get('status'),
                  'pages':len(x.get('pages') or []),
                  'attachments':len(x.get('attachments') or []),
                  'errors':(x.get('errors') or [])[:5],
                  'diagnostics':(x.get('diagnostics') or [])[:2],
                  'sample_attachments':(x.get('attachments') or [])[:5],
              },ensure_ascii=False))
          for key,url,fn in (
              ('KPS','https://www.kps.co.kr/open_kps/business/boardList.do?pageIndex=1',kps.fetch),
              ('KOMSCO','https://www.komsco.com/kor/article/ATCL7e0c1d65f',komsco.fetch),
          ):
              doc=fn(url)
              text=re.sub(r'\s+',' ',doc)
              print('BROWSER_META',key,'len=',len(doc),'title=',re.findall(r'<title[^>]*>(.*?)</title>',doc,re.I|re.S)[:1])
              for needle in ('2026','2025','업무추진비','첨부파일','download','file','onclick'):
                  pos=text.lower().find(needle.lower())
                  if pos>=0: print('BROWSER_SNIP',key,needle,text[max(0,pos-350):pos+1000])
          PY
