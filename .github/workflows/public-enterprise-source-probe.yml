name: Public enterprise source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-enterprise-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe KPS and KOMSCO markup
        run: |
          python -m py_compile pipeline/public_enterprise_kps.py pipeline/public_enterprise_komsco.py
          python pipeline/public_enterprise_kps.py
          python pipeline/public_enterprise_komsco.py
          python - <<'PY'
          import re,sys
          sys.path.insert(0,'pipeline')
          from public_enterprise_discovery import fetch, parse_links
          urls={
            'KPS':'https://www.kps.co.kr/open_kps/business/boardList.do?pageIndex=1',
            'KOMSCO':'https://www.komsco.com/kor/article/ATCL7e0c1d65f',
          }
          for key,url in urls.items():
              doc=fetch(url)
              print('RAW_META',key,'len=',len(doc),'title=',re.findall(r'<title[^>]*>(.*?)</title>',doc,re.I|re.S)[:1])
              text=re.sub(r'\s+',' ',doc)
              for needle in ('업무추진비','첨부','download','file','onclick','board'):
                  pos=text.lower().find(needle.lower())
                  if pos>=0:
                      print('RAW_SNIP',key,needle,text[max(0,pos-500):pos+1200])
              links=parse_links(url,doc)
              interesting=[x for x in links if any(t in ((x.get('text') or '')+' '+(x.get('url') or '')).lower() for t in ('업무추진비','file','download','board','article'))]
              print('RAW_LINKS',key,interesting[:30])
          PY
