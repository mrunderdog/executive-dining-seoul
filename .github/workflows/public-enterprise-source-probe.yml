name: Public enterprise source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-enterprise-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect KAMCO download helper
        run: |
          python - <<'PY'
          import re, urllib.request
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36'
          urls=[
            'https://www.kamco.or.kr/common/js/common/EgovFileUtils.js',
            'https://www.kamco.or.kr/dwr/interface/EgovFileMngDwr',
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':'https://www.kamco.or.kr/portal/bbs/view.do?bIdx=22548&mId=0601060603&ptIdx=479'})
              raw=urllib.request.urlopen(req,timeout=45).read()
              text=raw.decode('utf-8','replace')
              print('URL',url,'BYTES',len(raw))
              for needle in ('fn_egov_downFile','downFile','download','FILE_'):
                  pos=text.find(needle)
                  print('NEEDLE',needle,'POS',pos)
                  if pos>=0: print('SNIP',text[max(0,pos-1800):pos+3500].replace('\n',' '))
          PY
