name: KOMSCO markup probe

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/public_enterprise_komsco.py'
      - '.github/workflows/komsco-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komsco-markup-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe KOMSCO markup
        run: python pipeline/public_enterprise_komsco.py
