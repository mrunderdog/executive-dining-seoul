name: Build static coordinate cache

on:
  push:
    branches: [main]
    paths:
      - 'data/chunks/**'
      - 'data/raw/**'
      - 'reports/*-executive-candidates.json'
      - 'reports/*-province-candidates.json'
      - 'reports/education-police-approved-venues.json'
      - 'sources/entity_enrichment.json'
      - 'pipeline/geocode_cache.py'
      - 'pipeline/published_sources.py'
      - 'pipeline/extra_published.py'
      - 'pipeline/police_expense_publication.py'
      - 'sources/police_verified_expense_venues.json'
      - 'pipeline/audit_police_coordinates.py'
      - 'pipeline/coordinate_selection.py'
      - '.github/workflows/geocode.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-coordinate-cache
  cancel-in-progress: true

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Populate only uncached coordinates
        run: |
          python pipeline/geocode_extra_cache.py
          python pipeline/geocode_cache.py --mode auto

      - name: Verify all approved Police venue coordinates
        run: python pipeline/audit_police_coordinates.py

      - name: Verify legislator map QA
        if: hashFiles('reports/national-legislator-candidates.json') != ''
        run: python pipeline/qa_national_legislator_map.py

      - name: Verify published dataset quality
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      - name: Commit coordinate cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geocode_cache.json
          if git diff --cached --quiet; then
            echo "Coordinate cache already current."
            exit 0
          fi
          git commit -m "data: refresh static coordinate cache"
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; rebuilding on latest main (attempt $ATTEMPT/3)."
            git fetch origin main
            git reset --hard origin/main
            python pipeline/geocode_cache.py --mode auto
            python pipeline/audit_police_coordinates.py
            git add data/geocode_cache.json
            if git diff --cached --quiet; then
              echo "Latest main already contains an equivalent coordinate cache."
              exit 0
            fi
            git commit -m "data: refresh static coordinate cache"
          done
          echo "Could not publish coordinate cache after 3 attempts."
          exit 1
