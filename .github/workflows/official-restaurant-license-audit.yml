name: Verify official restaurant permits (four Seoul districts)
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/audit_restaurant_licenses.py'
      - '.github/workflows/official-restaurant-license-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: read
jobs:
  official-licensing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current LOCALDATA district CSVs and verify exact matches
        run: python pipeline/audit_restaurant_licenses.py --fetch-official --output reports/restaurant-license-audit.json
      - name: Upload original-source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localdata-restaurant-license-audit
          path: reports/restaurant-license-audit.json
          if-no-files-found: warn
          retention-days: 30
