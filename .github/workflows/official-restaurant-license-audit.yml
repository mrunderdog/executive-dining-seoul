name: Verify official restaurant permits (priority eight jurisdictions)
on:
  pull_request:
    paths:
      - 'pipeline/audit_restaurant_licenses.py'
      - 'pipeline/localdata_regions.py'
      - 'sources/localdata_orgcodes.json'
      - '.github/workflows/official-restaurant-license-audit.yml'
  push:
    branches: [main]
    paths:
      - 'pipeline/audit_restaurant_licenses.py'
      - 'pipeline/localdata_regions.py'
      - 'sources/localdata_orgcodes.json'
      - '.github/workflows/official-restaurant-license-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: read
jobs:
  official-licensing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit 8 priority districts across all published agency venues
        run: |
          python pipeline/audit_restaurant_licenses.py --fetch-official --scope all \
            --regions 서울서대문구,서울중구,서울종로구,서울서초구,서울영등포구,경기광명시,경기고양시,경기안양시 \
            --police-output reports/restaurant-license-audit.json \
            --output reports/all-agency-eight-region-license-audit.json
      - name: Validate jurisdiction and cohort isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename,expected_scope in [
              ("reports/restaurant-license-audit.json","police"),
              ("reports/all-agency-eight-region-license-audit.json","all"),
          ]:
              d=json.loads(Path(filename).read_text(encoding="utf-8"))
              assert d["scope"]==expected_scope, (filename,d["scope"])
              assert sum(r["venues"] for r in d["by_region"].values())==d["total_venues"], filename
              assert len(d["sources"])==8, filename
              assert all(s["jurisdiction_confirmed_rows"]>0 for s in d["sources"]),filename
              assert all(not v["payment_branch_verified"] and not v["personal_attendance_verified"]
                         for v in d["venues"]),filename
              if expected_scope=="police":assert d["total_venues"]==18
              else:assert d["total_venues"]>=100
          print("Region and evidence cohort audit reports validated")
          PY
      - name: Upload original-source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localdata-restaurant-license-audit
          path: |
            reports/restaurant-license-audit.json
            reports/all-agency-eight-region-license-audit.json
          if-no-files-found: warn
          retention-days: 30
