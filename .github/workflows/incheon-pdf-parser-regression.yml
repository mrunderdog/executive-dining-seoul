name: Incheon PDF parser forward-port regression

on:
  push:
    branches: [fix/incheon-pdf-parser-forwardport-20261113]
  pull_request:
    paths:
      - 'pipeline/ingest_council_expense.py'
      - 'pipeline/qa_council_publication.py'
      - 'pipeline/test_incheon_official_pdf.py'
      - 'pipeline/test_incheon_release_qa.py'
      - '.github/workflows/incheon-pdf-parser-regression.yml'

permissions:
  contents: read

jobs:
  parser-and-strict-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spreadsheet and PDF parser dependencies
        run: python -m pip install 'pypdf>=5,<7' 'openpyxl>=3.1,<4' xlrd
      - name: Syntax and original Incheon PDF fixture tests
        run: |
          python -m py_compile pipeline/ingest_council_expense.py pipeline/qa_council_publication.py
          PYTHONPATH=pipeline python -m unittest -v pipeline/test_incheon_official_pdf.py pipeline/test_incheon_release_qa.py pipeline/test_p1_official_file_forensics.py
      - name: Site and financial ledger regression gates
        run: |
          python pipeline/regression_checks.py
          python pipeline/quality_gate.py
      - name: Assert only parser/tests changed; existing financial records untouched
        run: |
          git diff --exit-code -- data/raw reports/incheon_council-executive-candidates.json
