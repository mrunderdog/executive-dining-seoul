name: KOGAS adapter probe
on:
  push:
    branches: [feat/kogas-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect KOGAS detail attachment patterns
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://www.kogas.or.kr'
          url=base+'/site/koGas/bbs/View.do?cbIdx=57&boardIdx=47734&Key=1060101050000&pageOffset=0&pageIndex=1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':base+'/site/koGas/goBoard.do?Key=1060101050000&boardNo=57'})
          with urllib.request.urlopen(req,timeout=60) as r:
              html=r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
          print('BYTES',len(html))
          print('TITLE',re.findall(r'<title>(.*?)</title>',html,re.I|re.S)[:1])
          pats=[r'첨부',r'download',r'file',r'xlsx',r'xls',r'pdf',r'hwp',r'47734']
          for pat in pats:
              m=re.search(pat,html,re.I)
              print('PAT',pat,bool(m))
              if m:
                  print(html[max(0,m.start()-5000):min(len(html),m.start()+15000)].replace('\n',' ')[:20000])
          for m in re.finditer(r'<a\b[^>]*>',html,re.I):
              tag=m.group(0)
              if re.search(r'down|file|첨부|xlsx|xls|pdf|hwp|hwpx',tag,re.I):
                  print('ATAG',tag)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          print('SCRIPTS',scripts)
          PY
