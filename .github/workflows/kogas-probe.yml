name: KOGAS adapter probe
on:
  push:
    branches: [feat/kogas-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect KOGAS static board functions
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.kogas.or.kr/site/koGas/goBoard.do?Key=1060101050000&boardNo=57'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              html=r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
          print('BYTES',len(html))
          pats=[
            r'function\s+readPermissionChk\s*\([^)]*\)',
            r'readPermissionChk\s*=',
            r'readPermissionChk\(',
            r'2026년\s*5월\s*기관장.*?임원\s*업무추진비\s*사용내역',
            r'47734',
          ]
          for pat in pats:
              m=re.search(pat,html,re.I|re.S)
              print('PATTERN',pat,'FOUND',bool(m))
              if m:
                  print(html[max(0,m.start()-5000):min(len(html),m.start()+12000)].replace('\n',' ')[:17000])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          print('SCRIPTS',scripts)
          PY
