name: KOGAS final publish QA
on:
  push:
    branches: [feat/kogas-adapter]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Refresh KOGAS public-enterprise data
        run: |
          python pipeline/public_enterprise_discovery.py --year 2026 --incremental --detail-limit 24
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
          python pipeline/geocode_extra_cache.py
          python pipeline/geocode_cache.py --mode auto
      - name: Verify KOGAS records
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'pipeline')
          from extra_published import public_enterprise_records
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          raw=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          s=next(x for x in d['sources'] if x['key']=='kogas')
          rows=[x for x in raw.get('rows',[]) if x.get('institution')=='한국가스공사']
          cs=[x for x in cand.get('candidates',[]) if '한국가스공사' in (x.get('institutions') or [])]
          rec=[x for x in public_enterprise_records() if '한국가스공사' in (x.get('institutions') or [])]
          print('KOGAS_DISCOVERY',json.dumps({'status':s.get('status'),'attachments':len(s.get('attachments') or [])},ensure_ascii=False))
          print('KOGAS_ROWS',json.dumps(rows,ensure_ascii=False))
          print('KOGAS_CANDIDATES',json.dumps(cs,ensure_ascii=False))
          print('KOGAS_RECORDS',json.dumps(rec,ensure_ascii=False))
          assert s.get('status')=='PARSEABLE_FOUND'
          assert len(s.get('attachments') or [])>=18
          names={x.get('merchant') for x in cs}
          assert '대구(초례담)' in names
          assert '대구(신서복어)' in names
          assert not any('이루팜' in (x.get('merchant') or '') or '빅핸즈' in (x.get('merchant') or '') for x in cs)
          by_name={x.get('name'):x for x in rec}
          assert by_name['대구(초례담)']['address']=='대구광역시 동구 혁신대로35길 3-7 3층'
          assert by_name['대구(신서복어)']['address']=='대구광역시 동구 반야월로 370-4'
          cache=json.loads(Path('data/geocode_cache.json').read_text(encoding='utf-8'))
          geo=cache.get('records') or {}
          for key in ['대구(초례담)|공기업·공공기관','대구(신서복어)|공기업·공공기관']:
              g=geo.get(key) or {}
              assert isinstance(g.get('lat'),(int,float)) and isinstance(g.get('lon'),(int,float)), (key,g)
          PY
      - name: Quality and browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/quality_gate.py
          python pipeline/regression_checks.py
          python pipeline/build_site.py --output dist/index.html
          node --check site/app.js
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/kogas-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/kogas-final-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/kogas-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
      - name: Commit generated KOGAS data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/public-enterprise-discovery.json reports/public-enterprise-ingestion.md reports/public-enterprise-candidates.json reports/public-enterprise-candidates.md data/raw/public_enterprise_expense.json data/geocode_cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add KOGAS institution-head dining baseline"
          git push origin HEAD:feat/kogas-adapter
