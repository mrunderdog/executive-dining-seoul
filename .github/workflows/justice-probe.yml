name: Justice source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/justice-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pypdf==6.1.1
      - name: Probe prosecution, MOJ, and Constitutional Court
        shell: bash
        run: |
          python - <<'PY'
          import io, re, urllib.parse, urllib.request, http.cookiejar
          from pypdf import PdfReader

          UA='Mozilla/5.0 ExecutiveDiningSeoulProbe/1.0'

          def req(url, data=None, headers=None, opener=None):
              h={'User-Agent':UA,'Accept':'*/*', **(headers or {})}
              if isinstance(data,dict):
                  data=urllib.parse.urlencode(data).encode()
                  h['Content-Type']='application/x-www-form-urlencoded; charset=UTF-8'
                  h['X-Requested-With']='XMLHttpRequest'
              request=urllib.request.Request(url,data=data,headers=h)
              return opener.open(request,timeout=25) if opener else urllib.request.urlopen(request,timeout=25)

          print('=== SPO AJAX ===')
          url='https://www.spo.go.kr/site/spo/ex/announce/AnnounceDetailInfo.do'
          try:
              with req(url,{'infoId':'300'}) as r:
                  raw=r.read(); enc=r.headers.get_content_charset() or 'utf-8'
                  doc=raw.decode(enc,errors='replace')
              print('status bytes',len(raw))
              for line in doc.splitlines():
                  s=' '.join(line.split())
                  if any(k in s for k in ('data-param','announceBoardList','AnnounceContent','doAnnounceInfoView','seqId','infoSeq','cbIdx')):
                      print(s[:1200])
          except Exception as e:
              print('SPO ERROR',type(e).__name__,e)

          print('=== MOJ COOKIE + REDIRECT ===')
          parent='https://www.moj.go.kr/bbs/moj/98/609220/artclView.do'
          dl='https://www.moj.go.kr/bbs/moj/98/498016/download.do'
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          try:
              with req(parent,opener=opener) as r:
                  body=r.read()
              print('parent ok',len(body),'cookies',[(c.name,c.value[:12]) for c in cj])
          except Exception as e:
              print('parent error',type(e).__name__,e)
          for headers in ({},{'Referer':parent}):
              try:
                  with req(dl,headers=headers,opener=opener) as r:
                      blob=r.read(1024)
                      print('download ok',r.status,r.geturl(),r.headers.get_content_type(),len(blob),blob[:8])
              except Exception as e:
                  print('download error',headers,type(e).__name__,e)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          nr=urllib.request.build_opener(NoRedirect(),urllib.request.HTTPCookieProcessor(cj))
          try:
              with req(dl,headers={'Referer':parent},opener=nr) as r:
                  print('no redirect',r.status,r.headers.get('Location'))
          except urllib.error.HTTPError as e:
              print('redirect response',e.code,e.headers.get('Location'))

          print('=== CCOURT PDF ===')
          cc='https://www.ccourt.go.kr/common/board/Download.do?bcIdx=4264985&cbIdx=1118&streFileNm=07ac9ba5-d3f5-41ed-8dfa-00a0b42eebe8.pdf'
          try:
              with req(cc) as r:
                  blob=r.read()
              print('cc bytes',len(blob),blob[:8])
              reader=PdfReader(io.BytesIO(blob))
              print('pages',len(reader.pages))
              for i,p in enumerate(reader.pages[:2],1):
                  txt=p.extract_text(extraction_mode='layout') or p.extract_text() or ''
                  print('PAGE',i)
                  print(txt[:8000])
          except Exception as e:
              print('CC ERROR',type(e).__name__,e)
          PY
