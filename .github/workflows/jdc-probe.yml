name: JDC ALIO probe
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/jdc_probe.py'
      - '.github/workflows/jdc-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python pipeline/jdc_probe.py
