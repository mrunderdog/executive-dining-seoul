name: Validate curated source-backed venue locations
on:
  pull_request:
    paths:
      - 'sources/curated_venue_address_evidence.json'
      - 'pipeline/source_address_evidence.py'
      - 'pipeline/extra_published.py'
      - 'pipeline/test_source_address_evidence.py'
      - '.github/workflows/curated-venue-address-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sources/curated_venue_address_evidence.json'
      - 'pipeline/source_address_evidence.py'
      - 'pipeline/extra_published.py'
      - 'pipeline/test_source_address_evidence.py'
      - '.github/workflows/curated-venue-address-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curated-venue-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate cohort, branch identity and evidence guards
        run: PYTHONPATH=pipeline python -m unittest -v pipeline/test_source_address_evidence.py
      - name: Recalculate overall address coverage without promoting payment identities
        run: |
          python pipeline/localdata_regions.py
          PYTHONPATH=pipeline python - <<'PY'
          import json
          from pathlib import Path
          from source_address_evidence import curated_location
          from extra_published import central_records, public_enterprise_records
          doc=json.loads(Path('sources/curated_venue_address_evidence.json').read_text(encoding='utf-8'))
          coverage=json.loads(Path('reports/localdata-regional-coverage.json').read_text(encoding='utf-8'))
          approved=[e for e in doc['entries'] if e['status']=='APPROVED_VENUE_LOCATION']
          review=[e for e in doc['entries'] if e['status']=='REVIEW_ONLY']
          existing=[e for e in doc['entries'] if e['status']=='ALREADY_ENRICHED']
          assert len(approved)==5 and len(existing)==1 and len(review)==1
          published={r['name']:r for r in central_records()+public_enterprise_records()}
          for e in approved:
              v=curated_location(e['cohort'],e['merchant'])
              assert v and published[e['merchant']]['address']==v['address']
              assert not v['payment_branch_verified'] and not v['individual_attendance_verified']
          out={
              'published_venue_count':coverage['total_published_venues'],
              'address_ready_count':coverage['road_building_verifiable'],
              'routed_venue_count':coverage['routed_venues'],
              'unrouted_venue_count':coverage['unrouted_venues'],
              'approved_venue_locations':[{'merchant':e['merchant'],'cohort':e['cohort'],
                  'address':e['address'],'basis':e['basis'],'payment_branch_verified':False,
                  'personal_attendance_verified':False} for e in approved],
              'previously_enriched_count':len(existing),
              'review_only_count':len(review),
              'policy':'Venue location corroboration is not payment branch identity or an attendee claim.'
          }
          Path('reports/curated-venue-location-audit.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Upload evidence and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-venue-location-qa
          path: |
            reports/curated-venue-location-audit.json
            reports/localdata-regional-coverage.json
          retention-days: 30
          if-no-files-found: warn
