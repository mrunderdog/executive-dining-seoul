name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Build static coordinate cache
      - Monthly data refresh
      - Signal intelligence reports
      - Central + National refresh
      - Rebuild council candidates
      - Regional executive refresh
      - Capital council expense ingestion
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.buildinfo.outputs.commit }}
      total: ${{ steps.buildinfo.outputs.total }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression checks
        run: python pipeline/regression_checks.py

      - name: Quality gate
        run: python pipeline/quality_gate.py

      - name: Audit coordinates
        run: python pipeline/audit_coordinates.py

      - name: Build static site
        run: python pipeline/build_site.py --output dist/index.html

      - name: Check frontend runtime syntax
        run: |
          node --check site/app.js
          python - <<'PY'
          from pathlib import Path
          html=Path('dist/index.html').read_text(encoding='utf-8')
          start=html.rfind('<script>')+8
          end=html.rfind('</script>')
          Path('/tmp/executive-dining-runtime.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/executive-dining-runtime.js

      - name: Browser smoke - map markers render
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_BIN" ]]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python -m http.server 8765 --directory dist >/tmp/executive-dining-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/executive-dining-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/executive-dining-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          if ! node pipeline/browser_map_smoke.mjs; then
            echo "--- chrome log ---"
            tail -200 /tmp/executive-dining-chrome.log || true
            echo "--- http log ---"
            tail -100 /tmp/executive-dining-http.log || true
            exit 1
          fi

      - name: Capture build identity
        id: buildinfo
        shell: bash
        run: |
          COMMIT="$(python -c 'import json; print(json.load(open("dist/build-meta.json", encoding="utf-8"))["git_commit"])')"
          TOTAL="$(python -c 'import json; print(json.load(open("dist/build-meta.json", encoding="utf-8"))["dataset_total"])')"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Built commit $COMMIT with $TOTAL restaurants"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy sync check
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
          EXPECTED_TOTAL: ${{ needs.build.outputs.total }}
        run: |
          set -e
          URL="${PAGE_URL%/}/build-meta.json?run=${{ github.run_id }}"
          for ATTEMPT in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$URL" -o /tmp/build-meta.json; then
              ACTUAL_COMMIT="$(python -c 'import json; print(json.load(open("/tmp/build-meta.json", encoding="utf-8"))["git_commit"])')"
              ACTUAL_TOTAL="$(python -c 'import json; print(json.load(open("/tmp/build-meta.json", encoding="utf-8"))["dataset_total"])')"
              echo "expected commit=$EXPECTED_COMMIT total=$EXPECTED_TOTAL"
              echo "deployed commit=$ACTUAL_COMMIT total=$ACTUAL_TOTAL"
              if [[ "$ACTUAL_COMMIT" == "$EXPECTED_COMMIT" && "$ACTUAL_TOTAL" == "$EXPECTED_TOTAL" ]]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Deployed site metadata does not match the build."
          exit 1
