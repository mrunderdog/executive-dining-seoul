name: Deploy Pages
# 2026-10-21: rebuild after strict-QA Icheon council data publication.

on:
  push:
    branches: [main]
    # Council source recovery release sync (2026-10): rebuild against the latest
    # QA-published source commits, not the earlier workflow-config commit.
    # Site inputs only. Workflow completions below still handle GITHUB_TOKEN
    # bot commits, which do not normally fire further push workflows.
    paths:
      - 'data/**'
      - 'sources/**'
      - 'seed/**'
      - 'pipeline/**'
      - 'site/**'
      - 'reports/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - Build static coordinate cache
      - Monthly data refresh
      - Signal intelligence reports
      - Central + National refresh
      - Rebuild council candidates
      - Regional executive refresh
      - Capital council expense ingestion
      - Publish verified education dining transactions
      - Public enterprise refresh on source change
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The build reads latest main for every trigger. Incoming workflow_run
# completions can be skipped/cancelled and must NOT cancel an in-flight
# successful deployment of a verified Pages build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Skip already deployed commit
        id: compare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # A manual run always forces a rebuild for recovery purposes.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          LIVE_SHA=""
          FILE="$(mktemp)"
          URL="https://mrunderdog.github.io/executive-dining-seoul/build-meta.json?check=${RUN_ID}"
          if curl -fsSL --retry 2 --max-time 20 "$URL" -o "$FILE"; then
            LIVE_SHA="$(python - "$FILE" <<'PY'
          import json,sys
          try:
              obj=json.load(open(sys.argv[1],encoding='utf-8'))
              print(str(obj.get('git_commit') or ''))
          except (OSError,ValueError,TypeError):
              print('')
          PY
          )"
          fi
          if [[ -n "$HEAD_SHA" && "$HEAD_SHA" == "$LIVE_SHA" ]]; then
            echo "Already deployed $HEAD_SHA: skipping duplicate build."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Current main $HEAD_SHA; deployed ${LIVE_SHA:-unknown}. Build required."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.buildinfo.outputs.commit }}
      total: ${{ steps.buildinfo.outputs.total }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression checks
        run: python pipeline/regression_checks.py

      - name: Test refresh gating
        run: PYTHONPATH=pipeline python -m unittest -v pipeline/test_refresh_needed.py

      - name: Test official council adapters and refresh monitoring
        run: PYTHONPATH=pipeline python -m unittest -v pipeline/test_council_recovery.py pipeline/test_refresh_health.py

      - name: Test data story semantics
        run: python pipeline/test_data_story.py

      - name: Quality gate
        run: python pipeline/quality_gate.py

      - name: Audit coordinates
        run: python pipeline/audit_coordinates.py

      - name: Build static site
        run: python pipeline/build_site.py --output dist/index.html

      - name: Verify removed transaction explorer is not deployed
        run: |
          test ! -e dist/transactions.html
          test ! -e dist/verified-transactions.json
          ! grep -q 'transactions.html' dist/index.html

      - name: Check frontend runtime syntax
        run: |
          node --check site/app.js
          node --check site/data_story.js
          python - <<'PY'
          from pathlib import Path
          html=Path('dist/index.html').read_text(encoding='utf-8')
          for key in ('id="dataStory"','id="storyLastBuild"','id="storyQa"','id="dataStoryGroups"'):
              assert key in html, key
          assert '__STORY__' not in html
          start=html.rfind('<script>')+8
          end=html.rfind('</script>')
          Path('/tmp/executive-dining-runtime.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/executive-dining-runtime.js

      - name: Browser smoke - map markers render
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_BIN" ]]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python -m http.server 8765 --directory dist >/tmp/executive-dining-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/executive-dining-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/executive-dining-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          if ! node pipeline/browser_map_smoke.mjs; then
            echo "--- chrome log ---"
            tail -200 /tmp/executive-dining-chrome.log || true
            echo "--- http log ---"
            tail -100 /tmp/executive-dining-http.log || true
            exit 1
          fi
      - name: Capture build identity
        id: buildinfo
        shell: bash
        run: |
          COMMIT="$(python -c 'import json; print(json.load(open("dist/build-meta.json", encoding="utf-8"))["git_commit"])')"
          TOTAL="$(python -c 'import json; print(json.load(open("dist/build-meta.json", encoding="utf-8"))["dataset_total"])')"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Built commit $COMMIT with $TOTAL restaurants"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.preflight.outputs.needs_build == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [preflight, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy sync check
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
          EXPECTED_TOTAL: ${{ needs.build.outputs.total }}
        run: |
          set -e
          URL="${PAGE_URL%/}/build-meta.json?run=${{ github.run_id }}"
          for ATTEMPT in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$URL" -o /tmp/build-meta.json; then
              ACTUAL_COMMIT="$(python -c 'import json; print(json.load(open("/tmp/build-meta.json", encoding="utf-8"))["git_commit"])')"
              ACTUAL_TOTAL="$(python -c 'import json; print(json.load(open("/tmp/build-meta.json", encoding="utf-8"))["dataset_total"])')"
              echo "expected commit=$EXPECTED_COMMIT total=$EXPECTED_TOTAL"
              echo "deployed commit=$ACTUAL_COMMIT total=$ACTUAL_TOTAL"
              if [[ "$ACTUAL_COMMIT" == "$EXPECTED_COMMIT" && "$ACTUAL_TOTAL" == "$EXPECTED_TOTAL" ]]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Deployed site metadata does not match the build."
          exit 1
