name: KECO source probe

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_keco.py'
      - '.github/workflows/keco-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLS parser
        run: pip install --disable-pip-version-check xlrd==2.0.2
      - name: Probe KECO disclosure
        run: python pipeline/probe_keco.py
