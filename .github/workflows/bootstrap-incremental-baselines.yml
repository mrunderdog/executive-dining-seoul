name: Bootstrap incremental baselines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-incremental-baselines.yml'

permissions:
  contents: write

concurrency:
  group: published-data-writer
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six

      - name: Bootstrap central-government raw baseline
        id: central
        shell: bash
        run: |
          set +e
          python pipeline/ingest_central_executive_expense.py --year 2026
          RC=$?
          if [[ $RC -ne 0 ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/raw/central_executive_expense.json')
          if not p.exists():
              raise SystemExit(2)
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=len(d.get('rows',[]))
          files=len(d.get('files',[]))
          print({'central_rows':rows,'central_files':files,'errors':len(d.get('errors',[]))})
          if rows < 3000 or files < 50:
              raise SystemExit(3)
          PY
          if [[ $? -ne 0 ]]; then
            echo "Central baseline did not meet bootstrap floor; preserve existing reports."
            git restore -- reports/central-executive-ingestion.md 2>/dev/null || true
            rm -f data/raw/central_executive_expense.json
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python pipeline/build_central_executive_candidates.py
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Refresh justice baseline with degradation guard
        id: justice
        shell: bash
        run: |
          set +e
          python pipeline/justice_leadership_discovery.py
          python pipeline/ingest_justice_leadership_expense.py --year 2026
          RC=$?
          if [[ $RC -ne 0 ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python pipeline/build_justice_leadership_candidates.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/raw/justice_leadership_expense.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          moj=[r for r in d.get('rows',[]) if r.get('institution')=='법무부']
          print({
              'justice_rows':len(d.get('rows',[])),
              'moj_rows':len(moj),
              'justice_files':len(d.get('files',[])),
              'errors':len(d.get('errors',[])),
          })
          # This is an upgrade bootstrap. Do not publish a worse MOJ snapshot
          # than the already committed 104-row state.
          if len(moj) < 104:
              raise SystemExit(4)
          PY
          [[ $? -eq 0 ]] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Refresh supplemental coordinates
        if: steps.central.outputs.ok == 'true' || steps.justice.outputs.ok == 'true'
        run: python pipeline/geocode_extra_cache.py

      - name: Quality gate
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      - name: Commit bootstrapped baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ steps.central.outputs.ok }}" == "true" ]]; then
            git add -f data/raw/central_executive_expense.json
            git add reports/central-executive-ingestion.md reports/central-executive-candidates.json reports/central-executive-candidates.md
          fi
          if [[ "${{ steps.justice.outputs.ok }}" == "true" ]]; then
            git add data/raw/justice_leadership_expense.json reports/justice-leadership-*
          fi
          git add data/geocode_cache.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "data: bootstrap incremental refresh baselines"
          git pull --rebase origin main
          git push origin HEAD:main
