name: Justice fast validation

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/ingest_central_executive_expense.py'
      - 'pipeline/ingest_justice_leadership_expense.py'
      - 'pipeline/justice_leadership_discovery.py'
      - 'pipeline/build_justice_leadership_candidates.py'
      - 'pipeline/ingest_prosecution_archive.py'
      - 'pipeline/refresh_justice.py'
      - 'sources/justice_leadership_registry.json'
      - '.github/workflows/justice-fast-validate.yml'
      - '.github/workflows/justice-ingest.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate committed last-good justice datasets
        run: python pipeline/refresh_justice.py --mode validate

      - name: Quality gate public dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html
