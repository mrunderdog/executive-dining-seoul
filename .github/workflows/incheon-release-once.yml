name: One-shot Incheon source-only partial release

on:
  push:
    branches: [release/incheon-source-only-partial-20261112]
    paths: ['.github/workflows/incheon-release-once.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: incheon-verified-partial-release-20261112
  cancel-in-progress: false

jobs:
  build-audited-json-commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/incheon-source-only-partial-20261112
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact SHA-bound audited partial-source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/incheon-artifact"
          gh run download 43164937694 -R "$GITHUB_REPOSITORY" \
            --name incheon-265-row-source-subset-not-published \
            --dir "$RUNNER_TEMP/incheon-artifact"
          for file in incheon_council_expense.json capital-backfill-discovery-incheon_council.json reparse_attestation.json manifest.json; do
            test -s "$RUNNER_TEMP/incheon-artifact/$file"
          done
      - name: Capture baseline static site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/incheon-before"
          python pipeline/quality_gate.py
          python pipeline/build_site.py --output "$RUNNER_TEMP/incheon-before/index.html"
      - name: Verify all 71 official transactions, 194 historic rows, and explicit partial-coverage status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,datetime,hashlib,json,os
          from collections import Counter
          from pathlib import Path
          from guard_full_council import check_integrity
          from qa_council_publication import assess_incremental,period_bounds
          from build_source_candidates import build_candidates

          d=Path(os.environ["RUNNER_TEMP"])/"incheon-artifact"
          raw=Path("data/raw/incheon_council_expense.json")
          discovery=Path("reports/capital-backfill-discovery-incheon_council.json")
          candidates=Path("reports/incheon_council-executive-candidates.json")
          old_bytes=raw.read_bytes()
          old_discovery_bytes=discovery.read_bytes()
          old_candidates_bytes=candidates.read_bytes()
          old=json.loads(old_bytes)
          old_disc=json.loads(old_discovery_bytes)
          package_bytes=(d/"incheon_council_expense.json").read_bytes()
          manifest=json.loads((d/"manifest.json").read_text())
          proposed=json.loads(package_bytes)
          proposed_disc=json.loads((d/"capital-backfill-discovery-incheon_council.json").read_text())
          proof=json.loads((d/"reparse_attestation.json").read_text())

          def sha(b): return hashlib.sha256(b).hexdigest()
          def stop(msg): raise SystemExit("STOP: "+msg)
          if any(sha(actual)!=manifest[field] for actual,field in [
              (old_bytes,"baseline_sha256"),
              (old_discovery_bytes,"baseline_discovery_sha256"),
              (old_candidates_bytes,"unchanged_candidates_sha256"),
              (package_bytes,"staged_sha256")]):
              stop("baseline or artifact SHA changed")
          if (manifest.get("status")!="SOURCE_ONLY_SUBSET_REVIEWABLE" or
              manifest.get("full_source_status")!="HOLD_SCANNED_ORIGINALS" or
              manifest.get("strict_qa_subset",{}).get("status")!="PUBLISH_READY" or
              manifest["strict_qa_subset"].get("verified_rows")!=71 or
              manifest.get("integrity",{}).get("status")!="PASS" or
              manifest.get("approved_to_merge") is not False or
              manifest.get("publish") is not False):
              stop("source-only audit status or scope not satisfied")
          if (len(old["rows"])!=194 or len(old["files"])!=10 or
              len(proposed["rows"])!=265 or len(proposed["files"])!=11 or
              proposed["rows"][:194]!=old["rows"] or
              proposed["files"][:10]!=old["files"] or
              proposed.get("errors")!=old.get("errors")):
              stop("immutable historical data was modified")
          if (proposed_disc["posts"][:-1]!=old_disc["posts"] or
              len(proposed_disc["posts"])!=len(old_disc["posts"])+1 or
              "msg_seq=1330" not in proposed_disc["posts"][-1]["post_url"]):
              stop("discovery history not append-only official 1330")
          new=proposed["rows"][194:]
          if len({x.get("row_id") for x in new})!=71 or set(x["row_id"] for x in new)&{x["row_id"] for x in old["rows"]}:
              stop("duplicate or modified original row IDs")
          expected={1320:(20,1496800),1322:(12,2750500),
                    1323:(2,321500),1326:(12,1995500),
                    1327:(12,1375200),1330:(13,2517800)}
          actual=Counter()
          totals=Counter()
          for row in new:
              url=row["source_attachment_url"]
              seq=int(url.split("msg_seq=")[-1].split("&")[0])
              if (seq not in expected or row.get("date_quality")!="source_verified_unranked"
                  or row.get("recommendation_status")!="HOLD_ORIGINAL_QA_AND_SCAN_COVERAGE"
                  or row.get("source_key")!="incheon_council"):
                  stop("unranked source-only row policy violated")
              try: used=datetime.date.fromisoformat(row["used_date"])
              except (TypeError,ValueError,KeyError):stop("invalid posted transaction date")
              bounds=period_bounds(row.get("source_period"))
              if not bounds or not bounds[0]<=used<=bounds[1] or not isinstance(row.get("amount"),int) or row["amount"]<=0:
                  stop("source period/amount mismatch")
              actual[seq]+=1
              totals[seq]+=row["amount"]
          if {seq:(actual[seq],totals[seq]) for seq in expected}!=expected:
              stop("independent six-file financial totals do not reconcile")
          if sum(totals.values())!=10457300:
              stop("missing source money")
          last=proposed["files"][-1]
          if (last.get("sha256")!="a958b2f26f025d100ba3c7d7310e434e21aad4c029d2fe6f4c0c9008e1a374e3"
              or [x.get("status") for x in last.get("sheets",[])]!=["DUPLICATE_OFFICIAL_PAGE_NO_NEW_ROWS","OK"]):
              stop("unverified duplicate industry PDF")
          if (proof.get("status")!="PASS" or proof.get("attested_files")!=5 or
              proof.get("total_attested_transactions")!=58 or
              len(proof.get("files",[]))!=5 or proof.get("old_file_metadata_mutated") is not False):
              stop("historical five-file reparse attestation not valid")
          historic_sha={x["url"]:x["sha256"] for x in old["files"]}
          for p in proof["files"]:
              if (p["official_url"] not in historic_sha or
                  p["baseline_sha256"]!=historic_sha[p["official_url"]] or
                  p["official_sha256"]!=p["baseline_sha256"] or
                  "NO_HEADER" not in p["original_sheet_statuses"] or
                  any(x not in ("OK","DUPLICATE_OFFICIAL_PAGE_NO_NEW_ROWS") for x in p["attested_page_statuses"])):
                  stop("historical official PDF provenance not complete")
          quarantined={x["msg_seq"]:x for x in manifest["excluded_original_documents"]}
          if (set(quarantined)!={1321,1329} or
              quarantined[1321].get("difference_krw")!=438200 or
              any("msg_seq="+str(seq) in x["source_attachment_url"] for x in new for seq in (1321,1329))):
              stop("scanned incomplete disclosures must remain quarantined")

          before_rank=build_candidates("incheon_council")[1]
          # The *financial source* is partial; do not imply full committee coverage.
          proposed["row_count"]=265
          proposed["new_files"]=1
          proposed["refresh_mode"]="source_only_partial_verified"
          proposed["generated_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
          proposed["source_recovery"]={
              "scope":"PARTIAL_2026_08_09_OFFICIAL_SOURCE",
              "status":"INCOMPLETE_SCANNED_COMMITTEE_DISCLOSURES",
              "new_verified_text_pdf_transactions":71,
              "new_verified_expense_total_krw":10457300,
              "reparse_evidence_workflow_run":43164937694,
              "original_historical_no_header_metadata_preserved":True,
              "new_transaction_ranking_eligible":False,
              "excluded_official_documents":manifest["excluded_original_documents"]
          }
          q=copy.deepcopy(old.get("raw_quality") or {})
          q["rows"]=q["transaction_rows"]=len(proposed["rows"])
          valid=0;within=0
          for row in proposed["rows"]:
              try: used=datetime.date.fromisoformat(str(row.get("used_date") or ""))
              except (ValueError,TypeError):continue
              valid+=1
              bounds=period_bounds(row.get("source_period"))
              if bounds and bounds[0]<=used<=bounds[1]: within+=1
          q["valid_date_coverage"]=q["all_row_valid_date_coverage"]=round(valid/265,4)
          q["in_period_date_coverage"]=q["all_row_in_period_date_coverage"]=round(within/265,4)
          proposed["raw_quality"]=q
          integrity=check_integrity("incheon_council",proposed,old)
          if integrity["status"]!="PASS":stop("full dataset integrity failed "+str(integrity["failures"]))

          # All historical NO_HEADER metadata stays immutable. For QA only,
          # overlay five independently SHA-attested PDF sheet statuses.
          view=copy.deepcopy(proposed)
          matches=0
          for entry in view["files"]:
              for item in proof["files"]:
                  if entry.get("url")==item["official_url"]:
                      current=[x.get("status") for x in entry.get("sheets",[])]
                      if current!=item["original_sheet_statuses"]:stop("original historical sheet statuses changed")
                      if len(current)!=len(item["attested_page_statuses"]):stop("page count mismatch")
                      for sheet,state,n in zip(entry["sheets"],item["attested_page_statuses"],item["attested_page_transactions"]):
                          sheet["status"]=state
                          sheet["parsed_rows"]=n
                          sheet["unparsed_transaction_like_rows"]=0
                      matches+=1
          if matches!=5:stop("incomplete historical QA-view attestation")
          qa=assess_incremental("incheon_council",view,proposed_disc,old,old_disc)
          if qa["status"]!="PUBLISH_READY" or qa["verified_rows"]!=71 or qa["failures"]:
              stop("transient strict QA failed "+str(qa))
          raw.write_text(json.dumps(proposed,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          discovery.write_text(json.dumps(proposed_disc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          after_rank=build_candidates("incheon_council")[1]
          if before_rank!=after_rank or candidates.read_bytes()!=old_candidates_bytes:
              stop("existing 118 recommendation candidates changed")
          print(json.dumps({"source":"incheon_council","scope":"PARTIAL_SOURCE_ONLY",
                            "baseline_rows":194,"source_rows":265,"new_rows":71,
                            "source_files":11,"quarantined_scan_ids":[1321,1329],
                            "attested_old_files":matches,"strict_qa":qa["status"],
                            "data_integrity":integrity["status"],"new_public_rankings":0},
                           ensure_ascii=False),flush=True)
          PY
      - name: Regression and actual static site before/after equivalence
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/regression_checks.py
          python pipeline/quality_gate.py
          mkdir -p "$RUNNER_TEMP/incheon-after"
          python pipeline/build_site.py --output "$RUNNER_TEMP/incheon-after/index.html"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          bmeta=json.loads((p/"incheon-before/build-meta.json").read_text())
          ameta=json.loads((p/"incheon-after/build-meta.json").read_text())
          if bmeta["dataset_total"]!=ameta["dataset_total"] or bmeta["dataset_total"]!=1356:
              raise SystemExit("STOP: public website record count changed")
          b=(p/"incheon-before/index.html").read_text(encoding="utf-8")
          a=(p/"incheon-after/index.html").read_text(encoding="utf-8")
          def field(text,start,stop):
              if start not in text: raise SystemExit("STOP: missing compiled site field "+start)
              return json.loads(text.split(start,1)[1].split(stop,1)[0])
          data_before=field(b,"const DATA=",",STATS=")
          data_after=field(a,"const DATA=",",STATS=")
          if data_before!=data_after or len(data_before)!=1356:
              raise SystemExit("STOP: published restaurant entities/rankings differ")
          origins_before=field(b,",ORIGINS=",";")
          origins_after=field(a,",ORIGINS=",";")
          if origins_before!=origins_after: raise SystemExit("STOP: published regions changed")
          stats_before=field(b,",STATS=",",ORIGINS=")
          stats_after=field(a,",STATS=",",ORIGINS=")
          health_before=stats_before.get("source_health",{}).get("incheon_council",{})
          health_after=stats_after.get("source_health",{}).get("incheon_council",{})
          if (health_before.get("raw_rows")!=194 or health_after.get("raw_rows")!=265
              or health_after.get("discovery_posts")!=health_before.get("discovery_posts",0)+1):
              raise SystemExit("STOP: only allowed 71-row + one-source-post health delta not observed")
          allowed={"raw_rows","discovery_posts","discovery_attachments"}
          if ({k:v for k,v in health_before.items() if k not in allowed}
              !={k:v for k,v in health_after.items() if k not in allowed}):
              raise SystemExit("STOP: unexpected Incheon source health changes")
          stats_before["source_health"].pop("incheon_council",None)
          stats_after["source_health"].pop("incheon_council",None)
          if stats_before!=stats_after:
              raise SystemExit("STOP: public site statistics outside Incheon source health differ")
          story_before=field(b,"const STORY=",";\n  const root=")
          story_after=field(a,"const STORY=",";\n  const root=")
          story_before.pop("generated_at_utc",None)
          story_after.pop("generated_at_utc",None)
          if story_before!=story_after:
              raise SystemExit("STOP: non-timestamp story metrics changed")
          # All other static HTML must be byte-identical; replace only the
          # serialized JSON objects compared above and recorded build time.
          def clean(text,meta):
              start="const DATA="
              end=";\nconst $="
              if end not in text: raise SystemExit("STOP: app payload boundary changed")
              left,right=text.split(start,1)
              remainder=right.split(end,1)[1]
              text=left+start+"__AUDITED_APP_DATA__"+end+remainder
              start="const STORY="
              end=";\n  const root="
              left,right=text.split(start,1)
              text=left+start+"__AUDITED_STORY__"+end+right.split(end,1)[1]
              return text.replace(meta["built_at"],"__AUDITED_BUILT_AT__")
          if clean(b,bmeta)!=clean(a,ameta):
              raise SystemExit("STOP: user-visible static HTML changed unexpectedly")
          print(json.dumps({"baseline_entities":len(data_before),
                            "proposed_entities":len(data_after),
                            "identical_public_restaurants":True,
                            "identical_rankings":True,
                            "only_incheon_source_health_count_changes":True,
                            "new_rankings":0,"publish":False},ensure_ascii=False))
          PY
      - name: Commit only two source JSON files and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/raw/incheon_council_expense.json reports/capital-backfill-discovery-incheon_council.json
          git rm -- .github/workflows/incheon-release-once.yml
          git commit -m 'data(incheon): release 71 verified PDF expenses as partial nonranking source'
          git push origin HEAD:release/incheon-source-only-partial-20261112
