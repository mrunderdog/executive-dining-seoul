name: Public enterprise refresh on source change

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/public_enterprise_discovery.py'
      - 'pipeline/public_enterprise_komipo.py'
      - 'pipeline/public_enterprise_hf.py'
      - 'pipeline/public_enterprise_hug.py'
      - 'pipeline/public_enterprise_ksure.py'
      - 'pipeline/public_enterprise_nps.py'
      - 'pipeline/public_enterprise_kosaf.py'
      - 'pipeline/public_enterprise_kicece.py'
      - 'pipeline/public_enterprise_hrdk.py'
      - 'pipeline/public_enterprise_kosha.py'
      - 'pipeline/public_enterprise_fira.py'
      - 'pipeline/public_enterprise_keco.py'
      - 'pipeline/public_enterprise_kobc.py'
      - 'pipeline/public_enterprise_nile.py'
      - 'pipeline/public_enterprise_koat.py'
      - 'pipeline/public_enterprise_kibo.py'
      - 'pipeline/public_enterprise_kps.py'
      - 'pipeline/public_enterprise_kamco.py'
      - 'pipeline/public_enterprise_kca.py'
      - 'pipeline/public_enterprise_komsco.py'
      - 'pipeline/ingest_public_enterprise_expense.py'
      - 'pipeline/build_public_enterprise_candidates.py'
      - 'sources/public_enterprise_registry.json'
      - 'sources/entity_enrichment.json'
      - '.github/workflows/public-enterprise-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-enterprise-source-refresh-v2
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 pdfplumber==0.11.7 --pre pyhwp six

      - name: Refresh public-enterprise sources
        run: |
          python -m py_compile pipeline/public_enterprise_discovery.py pipeline/public_enterprise_komipo.py pipeline/public_enterprise_hf.py pipeline/public_enterprise_hug.py pipeline/public_enterprise_ksure.py pipeline/public_enterprise_nps.py pipeline/public_enterprise_kosaf.py pipeline/public_enterprise_kicece.py pipeline/public_enterprise_hrdk.py pipeline/public_enterprise_kosha.py pipeline/public_enterprise_koat.py pipeline/public_enterprise_kibo.py pipeline/public_enterprise_nile.py pipeline/public_enterprise_fira.py pipeline/public_enterprise_keco.py pipeline/public_enterprise_kobc.py pipeline/public_enterprise_kps.py pipeline/public_enterprise_kamco.py pipeline/public_enterprise_kca.py pipeline/public_enterprise_komsco.py pipeline/ingest_public_enterprise_expense.py
          python pipeline/public_enterprise_discovery.py --incremental --detail-limit 24
          python pipeline/public_enterprise_komipo.py
          python pipeline/public_enterprise_hf.py
          python pipeline/public_enterprise_hug.py
          python pipeline/public_enterprise_ksure.py
          python pipeline/public_enterprise_nps.py
          python pipeline/public_enterprise_kosaf.py
          python pipeline/public_enterprise_kicece.py
          python pipeline/public_enterprise_hrdk.py
          python pipeline/public_enterprise_kosha.py
          python pipeline/public_enterprise_koat.py
          python pipeline/public_enterprise_kibo.py
          python pipeline/public_enterprise_nile.py
          python pipeline/public_enterprise_fira.py
          python pipeline/public_enterprise_keco.py
          python pipeline/public_enterprise_kobc.py
          python pipeline/public_enterprise_kps.py
          python pipeline/public_enterprise_kamco.py
          python pipeline/public_enterprise_kca.py
          python pipeline/public_enterprise_komsco.py
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
          python pipeline/geocode_extra_cache.py
          python pipeline/geocode_cache.py --mode auto

      - name: Inspect K-water publication
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'pipeline')
          from extra_published import public_enterprise_records
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          raw=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          src=next((x for x in d.get('sources',[]) if x.get('key')=='kwater'),{})
          rows=[x for x in raw.get('rows',[]) if x.get('institution')=='한국수자원공사']
          cs=[x for x in cand.get('candidates',[]) if '한국수자원공사' in (x.get('institutions') or [])]
          rec=[x for x in public_enterprise_records() if '한국수자원공사' in (x.get('institutions') or [])]
          print('KWATER_DISCOVERY',json.dumps({'status':src.get('status'),'pages':src.get('pages'),'inline_rows':len(src.get('inline_rows') or [])},ensure_ascii=False))
          print('KWATER_ROWS',json.dumps(rows,ensure_ascii=False))
          print('KWATER_CANDIDATES',json.dumps(cs,ensure_ascii=False))
          print('KWATER_PUBLISHED',json.dumps(rec,ensure_ascii=False))
          if src.get('status')!='PARSEABLE_FOUND' or not rows or not cs:
              raise SystemExit('K-water source did not produce publishable candidates')
          PY

      - name: Quality and regression
        run: |
          python pipeline/quality_gate.py
          python pipeline/regression_checks.py
          python pipeline/build_site.py --output dist/index.html
          node --check site/app.js

      - name: Browser map smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/pe-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/pe-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/pe-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for ATTEMPT in 1 2 3; do
            if node pipeline/browser_map_smoke.mjs; then
              break
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              echo "Browser smoke failed after 3 attempts."
              cat /tmp/pe-chrome.log || true
              cat /tmp/pe-http.log || true
              exit 1
            fi
            echo "Browser smoke transient failure; retrying ($ATTEMPT/3)."
            sleep 2
          done

      - name: Commit generated public-enterprise data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- data/geocode_cache.json
          git add reports/public-enterprise-discovery.json reports/public-enterprise-ingestion.md \
            reports/public-enterprise-candidates.json reports/public-enterprise-candidates.md \
            data/raw/public_enterprise_expense.json
          if git diff --cached --quiet; then
            echo "No generated public-enterprise changes."
            exit 0
          fi
          git commit -m "data: refresh public-enterprise dining baseline"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
              BAD=""
              for F in $CONFLICTS; do
                case "$F" in
                  reports/public-enterprise-discovery.json|reports/public-enterprise-ingestion.md|reports/public-enterprise-candidates.json|reports/public-enterprise-candidates.md|data/raw/public_enterprise_expense.json)
                    git checkout --theirs -- "$F"
                    git add "$F"
                    ;;
                  *) BAD="$BAD $F" ;;
                esac
              done
              if [[ -z "$BAD" ]] && [[ -n "$CONFLICTS" ]]; then
                GIT_EDITOR=true git rebase --continue
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                echo "Unexpected rebase conflicts:$BAD"
                git rebase --abort 2>/dev/null || true
              fi
            fi
            echo "Public-enterprise data push raced with another workflow (attempt $ATTEMPT/3)."
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          echo "Could not publish public-enterprise baseline after 3 attempts."
          exit 1
