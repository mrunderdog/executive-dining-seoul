name: P1 official board markup inspection (read-only)
on:
  pull_request:
    paths:
      - .github/workflows/p1-board-markup-inspection.yml
permissions:
  contents: read
jobs:
  markup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect official Gimpo JS click-handler route
        run: |
          PYTHONPATH=pipeline python - <<'PY'
          import re
          from capital_backfill import fetch_text
          u='https://gimpocouncil.go.kr/cnts/bbs/infoList.php?bbsCd=act&bbsSubCd=act0702'
          html=fetch_text(u)
          for token in ('goViewPage','fileDownLoad','boardView.php','infoView.php'):
              matches=list(re.finditer(re.escape(token),html,re.I))
              for m in matches[:4]:
                  print('GIMPO_SCRIPT',token,html[max(0,m.start()-320):m.end()+450].replace('\n',' ')[:800],flush=True)
          PY
          PYTHONPATH=pipeline python - <<'PY'
          import re
          from capital_backfill import fetch_text
          url='https://gimpocouncil.go.kr/cnts/bbs/infoView.php?bbsCd=act&bbsSubCd=act0702&bbsSn=748449'
          html=fetch_text(url)
          for token in ('의장단업무추진비_2026년2분기.xlsx','fileDownLoad(','FileDownLoad','flSn','fileSn'):
              for m in list(re.finditer(re.escape(token),html,re.I))[:4]:
                  print('GIMPO_DETAIL',token,html[max(0,m.start()-390):m.end()+550].replace('\n',' ')[:980],flush=True)
          PY
