name: FIRA source probe

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_fira.py'
      - '.github/workflows/fira-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: pip install --disable-pip-version-check pypdf==6.1.1 pdfplumber==0.11.7
      - name: Probe FIRA disclosure
        run: python pipeline/probe_fira.py
