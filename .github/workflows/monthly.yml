name: Monthly source check

on:
  schedule:
    # 03:00 UTC = 12:00 KST on the 15th of every month
    - cron: '0 3 15 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (optional)'
        required: false
      month:
        description: 'Target month 1-12 (optional)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build target arguments
        id: target
        shell: bash
        run: |
          ARGS=""
          if [[ -n "${{ github.event.inputs.year }}" && -n "${{ github.event.inputs.month }}" ]]; then
            ARGS="--year ${{ github.event.inputs.year }} --month ${{ github.event.inputs.month }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Check official monthly sources
        run: python pipeline/monthly_update.py ${{ steps.target.outputs.args }}

      - name: Quality gate current published dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      - name: Create monthly review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: monthly source status update'
          branch: bot/monthly-source-status
          delete-branch: true
          title: 'Monthly source status update'
          body: |
            Automated monthly source-discovery report.

            Review the report under `reports/` before merging.
            This workflow does **not** treat source discovery alone as new published expense data.
            District ingestion adapters must pass source lineage, entity matching and quality gates before `data/current.json` changes.
          labels: |
            monthly-update
