name: Monthly data refresh

on:
  schedule:
    # 03:00 UTC = 12:00 KST on the 15th of every month.
    # Scheduled runs are always FULL refreshes.
    - cron: '0 3 15 * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'FULL refresh: re-fetch all official/public sources (may take 10-20 min)'
        required: false
        type: boolean
        default: false
      year:
        description: 'Target year (optional, FULL refresh only)'
        required: false
      month:
        description: 'Target month 1-12 (optional, FULL refresh only)'
        required: false

permissions:
  contents: write

concurrency:
  group: published-data-writer
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    env:
      SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
      SEOUL_SERVICE_NAME: odExpense
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Decide refresh mode
        id: mode
        shell: bash
        run: |
          FULL=false
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.full_refresh }}" == "true" ]]; then
            FULL=true
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          if [[ "$FULL" == "true" ]]; then
            echo "FULL refresh: official/public sources will be re-fetched."
          else
            echo "FAST validation: source crawling/API ingestion is skipped."
          fi

      - name: Install spreadsheet parsers
        if: steps.mode.outputs.full == 'true'
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1

      - name: Build target arguments
        if: steps.mode.outputs.full == 'true'
        id: target
        shell: bash
        run: |
          ARGS=""
          if [[ -n "${{ github.event.inputs.year }}" && -n "${{ github.event.inputs.month }}" ]]; then
            ARGS="--year ${{ github.event.inputs.year }} --month ${{ github.event.inputs.month }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Check official monthly council sources
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/monthly_update.py ${{ steps.target.outputs.args }}

      - name: Check supplemental executive and legislator sources
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/supplemental_source_status.py ${{ steps.target.outputs.args }}

      - name: Refresh council sources independently
        if: steps.mode.outputs.full == 'true'
        shell: bash
        run: |
          set +e
          : > /tmp/monthly-council-status.tsv
          for SOURCE in goyang suwon hwaseong seongnam bucheon namyangju uijeongbu gwangmyeong gimpo ansan paju anseong icheon osan pocheon yangpyeong yongin gwangju guri uiwang gunpo dongducheon gwacheon gapyeong siheung yeoju yangju hanam yeoncheon michuhol bupyeong jemulpo yeongjong seohae yeonsu gyeyang ganghwa ongjin gyeonggi_council incheon_council; do
            restore_last_good() {
              STAGE="$1"
              if git cat-file -e "HEAD:data/raw/${SOURCE}_expense.json" 2>/dev/null && git cat-file -e "HEAD:reports/${SOURCE}-executive-candidates.json" 2>/dev/null; then
                git restore --source=HEAD -- "data/raw/${SOURCE}_expense.json" 2>/dev/null || true
                git restore --source=HEAD -- "reports/${SOURCE}-executive-candidates.json" "reports/${SOURCE}-executive-candidates.md" "reports/${SOURCE}-ingestion.md" 2>/dev/null || true
                echo -e "$SOURCE\tSTALE_OK:${STAGE}" >> /tmp/monthly-council-status.tsv
              else
                echo -e "$SOURCE\t${STAGE}_FAILED" >> /tmp/monthly-council-status.tsv
              fi
            }
            echo "=== discover $SOURCE ==="
            python pipeline/capital_backfill.py --since 2024-12 --source "$SOURCE"
            if [[ $? -ne 0 ]]; then restore_last_good "DISCOVERY"; continue; fi
            python pipeline/ingest_council_expense.py --source "$SOURCE"
            if [[ $? -ne 0 ]]; then restore_last_good "INGEST"; continue; fi
            python pipeline/repair_raw_dates.py --source "$SOURCE" --min-valid 0.95
            if [[ $? -ne 0 ]]; then restore_last_good "DATE_QA"; continue; fi
            python pipeline/build_source_candidates.py --source "$SOURCE" --top 100
            if [[ $? -ne 0 ]]; then restore_last_good "CANDIDATE"; continue; fi
            echo -e "$SOURCE\tOK" >> /tmp/monthly-council-status.tsv
          done
          cat /tmp/monthly-council-status.tsv

      - name: Ingest Seoul City Hall official OpenAPI
        if: steps.mode.outputs.full == 'true' && env.SEOUL_API_KEY != ''
        run: python pipeline/ingest_seoul_city_expense.py --since 2024-12

      - name: Build Seoul City Hall executive candidates
        if: steps.mode.outputs.full == 'true' && env.SEOUL_API_KEY != ''
        run: python pipeline/build_seoul_city_candidates.py --top 100

      - name: Note Seoul API key status
        if: steps.mode.outputs.full == 'true' && env.SEOUL_API_KEY == ''
        run: echo "SEOUL_API_KEY is not configured; Seoul City Hall raw ingestion is skipped."

      - name: Refresh regional executive sources independently
        if: steps.mode.outputs.full == 'true'
        shell: bash
        run: |
          set +e
          refresh_regional() {
            NAME="$1"
            RAW="$2"
            REPORT="$3"
            DISCOVERY_CMD="$4"
            INGEST_CMD="$5"
            DATE_SOURCE="$6"
            BUILD_CMD="$7"
            restore_last_good() {
              STAGE="$1"
              if git cat-file -e "HEAD:$RAW" 2>/dev/null && git cat-file -e "HEAD:$REPORT" 2>/dev/null; then
                git restore --source=HEAD -- "$RAW" 2>/dev/null || true
                case "$NAME" in
                  gyeonggi)
                    git restore --source=HEAD -- reports/gyeonggi-*.json reports/gyeonggi-*.md 2>/dev/null || true
                    ;;
                  incheon)
                    git restore --source=HEAD -- reports/incheon-*.json reports/incheon-*.md 2>/dev/null || true
                    ;;
                esac
                echo "$NAME STALE_OK:$STAGE"
              else
                echo "$NAME ${STAGE}_FAILED"
              fi
            }
            eval "$DISCOVERY_CMD" || { restore_last_good DISCOVERY; return 0; }
            eval "$INGEST_CMD" || { restore_last_good INGEST; return 0; }
            python pipeline/repair_raw_dates.py --source "$DATE_SOURCE" --min-valid 0.95 || { restore_last_good DATE_QA; return 0; }
            eval "$BUILD_CMD" || { restore_last_good CANDIDATE; return 0; }
            echo "$NAME OK"
          }

          refresh_regional \
            gyeonggi \
            data/raw/gyeonggi_province_expense.json \
            reports/gyeonggi-province-candidates.json \
            "python pipeline/gyeonggi_executive_discovery.py" \
            "python pipeline/ingest_gyeonggi_executive.py" \
            gyeonggi_province \
            "python pipeline/build_gyeonggi_candidates.py"

          refresh_regional \
            incheon \
            data/raw/incheon_province_expense.json \
            reports/incheon-province-candidates.json \
            "python pipeline/incheon_executive_discovery.py" \
            "python pipeline/ingest_incheon_executive.py" \
            incheon_province \
            "python pipeline/build_incheon_candidates.py"

      - name: Discover central-government executive expense files
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/central_executive_discovery.py

      - name: Ingest parseable central-government expense files
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/ingest_central_executive_expense.py

      - name: Build central-government executive candidates
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/build_central_executive_candidates.py

      - name: Discover justice leadership expense files
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/justice_leadership_discovery.py

      - name: Ingest justice leadership expense files
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/ingest_justice_leadership_expense.py

      - name: Build justice leadership dining candidates
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/build_justice_leadership_candidates.py

      - name: Ingest 2024 National Assembly political-fund spending
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/ingest_national_legislator_expense.py

      - name: Build National Assembly dining candidates
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/build_national_legislator_candidates.py

      - name: Sanity gate and quarantine degraded council refreshes
        if: steps.mode.outputs.full == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          status={}
          order=[]
          sp=Path('/tmp/monthly-council-status.tsv')
          if sp.exists():
              for line in sp.read_text().splitlines():
                  if '\t' in line:
                      k,v=line.split('\t',1)
                      status[k]=v
                      order.append(k)

          def exists_in_head(path: str) -> bool:
              return subprocess.run(
                  ['git','cat-file','-e',f'HEAD:{path}'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0

          def quarantine(source: str, reason: str) -> str:
              paths=[
                  f'data/raw/{source}_expense.json',
                  f'reports/{source}-executive-candidates.json',
                  f'reports/{source}-executive-candidates.md',
                  f'reports/{source}-ingestion.md',
              ]
              last_good=exists_in_head(paths[0]) and exists_in_head(paths[1])
              for path in paths:
                  p=Path(path)
                  if exists_in_head(path):
                      subprocess.run(
                          ['git','restore','--source=HEAD','--',path],
                          check=False,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                      )
                  elif p.exists():
                      p.unlink()
              state=(f'STALE_OK:VALIDATION_{reason}' if last_good
                     else f'VALIDATION_FAILED:{reason}')
              print(f'{source}: quarantined fresh refresh -> {state}')
              return state

          checked=0
          for source in order:
              state=status[source]
              usable=state=='OK' or state.startswith('STALE_OK:')
              if not usable:
                  print(source,state)
                  continue
              try:
                  p=Path(f'data/raw/{source}_expense.json')
                  d=json.loads(p.read_text(encoding='utf-8'))
                  rows=d.get('rows',[])
                  if not rows:
                      raise ValueError('no_rows')
                  tx=[r for r in rows if str(r.get('merchant') or '').strip()]
                  if len(tx)<10:
                      raise ValueError(f'too_few_transactions_{len(tx)}')
                  amount=sum(
                      isinstance(r.get('amount'),int) and r['amount']>=0
                      for r in tx
                  )/len(tx)
                  date=sum(
                      r.get('date_quality') in ('in_period','valid_outside_period')
                      for r in tx
                  )/len(tx)
                  if amount < .70:
                      raise ValueError(f'amount_{amount:.3f}')
                  if date < .95:
                      raise ValueError(f'date_{date:.3f}')
                  checked+=1
                  print(source,{
                      'rows':len(rows),
                      'transaction_rows':len(tx),
                      'amount':amount,
                      'date':date,
                  })
              except Exception as exc:
                  status[source]=quarantine(
                      source,
                      str(exc).replace(' ','_')[:80],
                  )

          sp.write_text(
              ''.join(f'{source}\t{status[source]}\n' for source in order),
              encoding='utf-8',
          )
          if checked < 1 and not any(v.startswith('STALE_OK:') for v in status.values()):
              raise SystemExit('no usable council source is available')
          PY

      - name: Geocode central and National Assembly pre-QA candidates
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/geocode_extra_cache.py

      - name: QA National Assembly restaurant entities and map coordinates
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/qa_national_legislator_map.py

      - name: Refresh static coordinates for QA-approved public dataset
        if: steps.mode.outputs.full == 'true'
        run: python pipeline/geocode_cache.py --mode auto

      - name: Fast-mode note
        if: steps.mode.outputs.full != 'true'
        run: echo "FAST mode uses committed reports/data and only validates the publish pipeline."

      - name: Audit published coordinates
        run: python pipeline/audit_coordinates.py

      - name: Quality gate published dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      - name: Commit generated monthly data and reports
        if: steps.mode.outputs.full == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data || true
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "chore: monthly data refresh"
          git push origin HEAD:main
