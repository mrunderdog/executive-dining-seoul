name: Monthly data refresh

on:
  schedule:
    # 03:00 UTC = 12:00 KST on the 15th of every month
    - cron: '0 3 15 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (optional)'
        required: false
      month:
        description: 'Target month 1-12 (optional)'
        required: false

permissions:
  contents: write

concurrency:
  group: monthly-data-refresh
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install spreadsheet parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2

      - name: Build target arguments
        id: target
        shell: bash
        run: |
          ARGS=""
          if [[ -n "${{ github.event.inputs.year }}" && -n "${{ github.event.inputs.month }}" ]]; then
            ARGS="--year ${{ github.event.inputs.year }} --month ${{ github.event.inputs.month }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Check official monthly sources
        run: python pipeline/monthly_update.py ${{ steps.target.outputs.args }}

      - name: Discover Capital Area source posts and attachments
        run: python pipeline/capital_backfill.py --since 2024-12

      - name: Ingest supported official spreadsheets
        shell: bash
        run: |
          # Goyang is the first row-level adapter. Additional councils join this block only
          # after their parser passes the same raw-data sanity gate.
          python pipeline/ingest_council_expense.py --source goyang

      - name: Sanity gate staged raw data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sources=['goyang']
          for source in sources:
              p=Path(f'data/raw/{source}_expense.json')
              d=json.loads(p.read_text(encoding='utf-8'))
              rows=d.get('rows',[])
              if not rows:
                  raise SystemExit(f'{source}: no normalized rows')
              merchant=sum(bool(str(r.get('merchant') or '').strip()) for r in rows)/len(rows)
              amount=sum(isinstance(r.get('amount'), int) and r['amount']>=0 for r in rows)/len(rows)
              if merchant < .70 or amount < .70:
                  raise SystemExit(f'{source}: raw coverage failed merchant={merchant:.1%}, amount={amount:.1%}')
              print(source, {'rows':len(rows),'merchant':merchant,'amount':amount})
          PY

      - name: Quality gate published dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      # Generated source reports/raw layers are committed only after all gates pass.
      # Published rankings remain a separate curated output until entity matching/scoring
      # for the newly ingested council has its own quality gate.
      - name: Commit generated monthly data and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data || true
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "chore: monthly data refresh"
          git pull --rebase origin main
          git push origin HEAD:main
