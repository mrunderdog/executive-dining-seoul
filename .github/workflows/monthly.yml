name: Monthly data refresh

on:
  schedule:
    # 03:00 UTC = 12:00 KST on the 15th of every month
    - cron: '0 3 15 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (optional)'
        required: false
      month:
        description: 'Target month 1-12 (optional)'
        required: false

permissions:
  contents: write

concurrency:
  group: monthly-data-refresh
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build target arguments
        id: target
        shell: bash
        run: |
          ARGS=""
          if [[ -n "${{ github.event.inputs.year }}" && -n "${{ github.event.inputs.month }}" ]]; then
            ARGS="--year ${{ github.event.inputs.year }} --month ${{ github.event.inputs.month }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Check official monthly sources
        run: python pipeline/monthly_update.py ${{ steps.target.outputs.args }}

      - name: Discover first Capital Area backfill sources
        run: python pipeline/capital_backfill.py --since 2024-12

      - name: Quality gate published dataset
        run: python pipeline/quality_gate.py

      - name: Verify site build
        run: python pipeline/build_site.py --output /tmp/index.html

      # The old job failed because repository policy blocked GITHUB_TOKEN from creating PRs.
      # Monthly refresh no longer depends on that setting: generated, quality-gated files are
      # committed directly to main. Pages then deploys the new main commit automatically.
      - name: Commit generated monthly data and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data || true
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "chore: monthly data refresh"
          git pull --rebase origin main
          git push origin HEAD:main
