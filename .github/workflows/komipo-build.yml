name: KOMIPO adapter build
on:
  push:
    branches: [feat/komipo-publish]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Connect KOMIPO adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('pipeline/public_enterprise_discovery.py')
          s=p.read_text(encoding='utf-8')
          if 'from komipo_adapter import discover_komipo' not in s:
              s=s.replace('from pathlib import Path\n','from pathlib import Path\nfrom komipo_adapter import discover_komipo\n')
          needle='    if src.get("key")=="kospo" and src.get("verified") and src.get("publish"):\n        return discover_kospo(src,year)\n'
          replacement=needle+'    if src.get("key")=="komipo" and src.get("verified") and src.get("publish"):\n        return discover_komipo(src,year,detail_limit)\n'
          if 'src.get("key")=="komipo"' not in s:
              s=s.replace(needle,replacement)
          p.write_text(s,encoding='utf-8')
          rp=Path('sources/public_enterprise_registry.json')
          reg=json.loads(rp.read_text(encoding='utf-8'))
          if not any(x.get('key')=='komipo' for x in reg['sources']):
              reg['sources'].append({
                'key':'komipo','institution':'한국중부발전','cohort':'public_enterprise_leadership',
                'verified':True,'publish':True,'refresh_policy':'monthly','default_role':'사장',
                'format_hint':'hwpx-monthly-detail','lookback_years':1,
                'listing_urls':['https://www.komipo.co.kr/kor/board/BRD_000065/boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1'],
                'note':'한국중부발전 공식 업무추진비 게시판 사장 탭(KH041301). 월별 HWPX에 사용일자·목적·사용처(장소)·대상·집행구분·인원·금액이 거래별 공개되어 HWPX adapter로 수집.'
              })
          rp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Install parsers
        run: pip install openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Run KOMIPO pipeline
        run: |
          python pipeline/public_enterprise_discovery.py --year 2026 --incremental --detail-limit 30
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          rows=[x for x in raw.get('rows',[]) if x.get('institution')=='한국중부발전']
          cs=[x for x in cand.get('candidates',[]) if '한국중부발전' in (x.get('institutions') or [])]
          print('KOMIPO_ROWS',json.dumps(rows[:80],ensure_ascii=False))
          print('KOMIPO_CANDIDATES',json.dumps(cs[:80],ensure_ascii=False))
          assert rows
          assert any('유일초밥' in (x.get('merchant') or '') for x in rows)
          assert cs
          PY
          python pipeline/regression_checks.py
      - name: Commit adapter and generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/komipo_adapter.py pipeline/public_enterprise_discovery.py sources/public_enterprise_registry.json reports/public-enterprise-discovery.json reports/public-enterprise-ingestion.md reports/public-enterprise-candidates.json reports/public-enterprise-candidates.md data/raw/public_enterprise_expense.json
          git commit -m "feat: add KOMIPO president HWPX dining adapter"
          git push origin HEAD:feat/komipo-publish
