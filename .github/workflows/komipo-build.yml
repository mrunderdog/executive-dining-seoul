name: KOMIPO adapter build
on:
  push:
    branches: [feat/komipo-publish]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Connect adapter, registry, and verified venue
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('pipeline/public_enterprise_discovery.py')
          s=p.read_text(encoding='utf-8')
          if 'from komipo_adapter import discover_komipo' not in s:
              s=s.replace('from pathlib import Path\n','from pathlib import Path\nfrom komipo_adapter import discover_komipo\n')
          needle='    if src.get("key")=="kospo" and src.get("verified") and src.get("publish"):\n        return discover_kospo(src,year)\n'
          if 'src.get("key")=="komipo"' not in s:
              s=s.replace(needle,needle+'    if src.get("key")=="komipo" and src.get("verified") and src.get("publish"):\n        return discover_komipo(src,year,detail_limit)\n')
          p.write_text(s,encoding='utf-8')

          rp=Path('sources/public_enterprise_registry.json')
          reg=json.loads(rp.read_text(encoding='utf-8'))
          if not any(x.get('key')=='komipo' for x in reg['sources']):
              reg['sources'].append({
                'key':'komipo','institution':'한국중부발전','cohort':'public_enterprise_leadership',
                'verified':True,'publish':True,'refresh_policy':'monthly','default_role':'사장',
                'format_hint':'hwpx-monthly-detail','lookback_years':1,
                'listing_urls':['https://www.komipo.co.kr/kor/board/BRD_000065/boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1'],
                'note':'한국중부발전 공식 업무추진비 게시판 사장 탭(KH041301). 월별 HWPX에 사용일자·목적·사용처(장소)·대상·집행구분·인원·금액이 거래별 공개되어 HWPX adapter로 수집.'
              })
          rp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ep=Path('sources/entity_enrichment.json')
          enr=json.loads(ep.read_text(encoding='utf-8'))
          enr.setdefault('source',{})['public_enterprise|유일초밥']={
              'display':'유일초밥','address':'충청남도 보령시 희망2길 25-2',
              'phone':'041-934-5901','category':'일식 · 초밥',
              'url':'https://www.daangn.com/kr/local-profile/%EC%9C%A0%EC%9D%BC%EC%B4%88%EB%B0%A5-yb2exnph4j4f/',
              'verified_at':'2026-10-04','confidence':'HIGH'
          }
          ep.write_text(json.dumps(enr,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate adapter on latest two president posts
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'pipeline')
          from komipo_adapter import discover_komipo
          src={'key':'komipo','institution':'한국중부발전','cohort':'public_enterprise_leadership','default_role':'사장','listing_urls':['https://www.komipo.co.kr/kor/board/BRD_000065/boardMain.do?mnCd=FN010712&schTabCd=KH041301&pageIndex=1']}
          out=discover_komipo(src,2026,2)
          print('KOMIPO_UNIT',json.dumps({'status':out['status'],'attachments':len(out['attachments']),'rows':out['inline_rows']},ensure_ascii=False))
          assert out['status']=='PARSEABLE_FOUND'
          assert any('유일초밥' in (x.get('merchant') or '') for x in out['inline_rows'])
          PY
      - name: Commit adapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/komipo_adapter.py pipeline/public_enterprise_discovery.py sources/public_enterprise_registry.json sources/entity_enrichment.json
          git commit -m "feat: add KOMIPO president HWPX dining adapter"
          git push origin HEAD:feat/komipo-publish
