name: KPX source probe

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_kpx.py'
      - '.github/workflows/kpx-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX parser
        run: pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Probe KPX disclosure
        run: python pipeline/probe_kpx.py
