name: Gyeonggi Open Data probe

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_gyeonggi_open_data.py'
      - '.github/workflows/gyeonggi-open-data-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gyeonggi-open-data-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe official direct CSV endpoints
        run: python pipeline/probe_gyeonggi_open_data.py
      - name: Commit probe report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/gyeonggi-open-data-probe.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: probe Gyeonggi Open Data downloads"
          git pull --rebase origin main
          git push origin HEAD:main
