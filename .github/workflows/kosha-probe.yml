name: KOSHA source probe
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_kosha.py'
      - '.github/workflows/kosha-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install browser probe
        run: pip install --disable-pip-version-check selenium==4.35.0
      - name: Probe KOSHA
        run: python pipeline/probe_kosha.py
