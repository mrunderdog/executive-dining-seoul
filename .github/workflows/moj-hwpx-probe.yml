name: MOJ structure probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moj-hwpx-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pypdf==6.1.1
      - name: Inspect MOJ HWPX and PDF rows
        shell: bash
        run: |
          python - <<'PY'
          import io, zipfile, urllib.request, http.cookiejar, xml.etree.ElementTree as ET
          from pypdf import PdfReader

          SOURCES=[
            ('기획조정실장','https://www.moj.go.kr/bbs/moj/98/608939/artclView.do','https://www.moj.go.kr/bbs/moj/98/497705/download.do'),
            ('법무실장','https://www.moj.go.kr/bbs/moj/98/608273/artclView.do','https://www.moj.go.kr/bbs/moj/98/496853/download.do'),
          ]
          def download(parent,url):
              jar=http.cookiejar.CookieJar()
              op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              h={'User-Agent':'ExecutiveDiningSeoulProbe/1.0','Accept':'*/*'}
              with op.open(urllib.request.Request(parent,headers=h),timeout=30) as r:r.read(256)
              h['Referer']=parent
              with op.open(urllib.request.Request(url,headers=h),timeout=60) as r:return r.read()
          def local(tag):return tag.split('}',1)[-1] if '}' in tag else tag
          for role,parent,url in SOURCES:
              print('===',role,'===')
              blob=download(parent,url); print('BYTES',len(blob),blob[:8])
              if blob.startswith(b'PK'):
                  with zipfile.ZipFile(io.BytesIO(blob)) as zf:
                      names=sorted(n for n in zf.namelist() if n.lower().startswith('contents/section') and n.lower().endswith('.xml'))
                      for name in names:
                          root=ET.fromstring(zf.read(name)); tno=0
                          for tbl in root.iter():
                              if local(tbl.tag)!='tbl':continue
                              tno+=1; rows=[]
                              for tr in tbl.iter():
                                  if local(tr.tag)!='tr':continue
                                  row=[]
                                  for tc in tr:
                                      if local(tc.tag)!='tc':continue
                                      parts=[node.text for node in tc.iter() if local(node.tag)=='t' and node.text]
                                      row.append(' '.join(' '.join(parts).split()))
                                  if any(row):rows.append(row)
                              if rows:
                                  print('TABLE',name,tno,'ROWS',len(rows))
                                  for i,row in enumerate(rows[:70],1):print(i,repr(row))
              elif blob.startswith(b'%PDF'):
                  reader=PdfReader(io.BytesIO(blob))
                  for pageno,page in enumerate(reader.pages,1):
                      try:txt=page.extract_text(extraction_mode='layout') or page.extract_text() or ''
                      except TypeError:txt=page.extract_text() or ''
                      print('PAGE',pageno,'TEXT')
                      for i,line in enumerate(txt.splitlines()[:120],1):
                          if line.strip():print(i,repr(line))
          PY
