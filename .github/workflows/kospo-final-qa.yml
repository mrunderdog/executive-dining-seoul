name: KOSPO final QA
on:
  push:
    branches: [feat/kospo-adapter]
    paths:
      - .github/workflows/kospo-final-qa.yml
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply verified KOSPO enrichment
        run: python .github/scripts/kospo_enrich.py
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Build transient coordinates
        run: |
          python pipeline/geocode_extra_cache.py
          python pipeline/geocode_cache.py --mode auto
      - name: Inspect KOSPO coordinate coverage
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'pipeline')
          from extra_published import public_enterprise_records
          c=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          cs=[x for x in c.get('candidates',[]) if '한국남부발전' in (x.get('institutions') or [])]
          rec=[x for x in public_enterprise_records() if '한국남부발전' in (x.get('institutions') or [])]
          cache=json.loads(Path('data/geocode_cache.json').read_text(encoding='utf-8')).get('records') or {}
          covered=[];missing=[]
          for x in cs:
              name=x.get('merchant') or ''
              g=cache.get(name+'|공기업·공공기관') or {}
              item={'name':name,'visits':x.get('visits'),'spend':x.get('spend'),'address':g.get('address'),'lat':g.get('lat'),'lon':g.get('lon')}
              (covered if isinstance(g.get('lat'),(int,float)) and isinstance(g.get('lon'),(int,float)) else missing).append(item)
          print('KOSPO_GEOCODED',json.dumps(covered,ensure_ascii=False))
          print('KOSPO_MISSING_COUNT',len(missing))
          assert len(cs)>=20, len(cs)
          assert len(rec)>=20, len(rec)
          assert len(covered)>=8, len(covered)
          required={'에스서울깍두기전포점','남도한식-정든님','백호양대창 이수점','세광양대창 수서점','산들해반포','민소한우(서린점)','호텔롯데 롯데호텔제주','남포면옥'}
          assert required.issubset({x['name'] for x in covered}), ({x['name'] for x in covered},required)
          PY
      - name: Quality and browser smoke
        run: |
          set -euo pipefail
          python pipeline/quality_gate.py
          python pipeline/regression_checks.py
          python pipeline/build_site.py --output dist/index.html
          node --check site/app.js
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/kospo-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --remote-debugging-port=9222 --user-data-dir=/tmp/kospo-chrome --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/kospo-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for ATTEMPT in 1 2 3; do
            if node pipeline/browser_map_smoke.mjs; then break; fi
            if [ "$ATTEMPT" -eq 3 ]; then cat /tmp/kospo-chrome.log || true; exit 1; fi
            sleep 2
          done
      - name: Commit verified enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/entity_enrichment.json
          git commit -m "data: enrich verified KOSPO venues"
          git push origin HEAD:feat/kospo-adapter
