name: Enrichment backlog QA

on:
  push:
    branches:
      - data/enrichment-batch-2

permissions:
  contents: read

jobs:
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression
        run: python pipeline/regression_checks.py
      - name: Build backlog
        run: |
          python pipeline/build_enrichment_backlog.py --limit 80
          python - <<'PY'
          import json
          d=json.load(open('reports/enrichment-backlog.json',encoding='utf-8'))
          print('SUMMARY',json.dumps({k:d[k] for k in ['total_records','safe_address_backfills','missing_address','missing_category','missing_phone','missing_url']},ensure_ascii=False))
          for i,r in enumerate(d['backlog'][:30],1): print('ROW',i,json.dumps(r,ensure_ascii=False))
          PY
      - name: Inspect newly resolved entities
        env:
          PYTHONPATH: pipeline
        run: |
          python - <<'PY'
          import json
          from data_io import load_payload
          from published_sources import merge_published_sources
          from extra_published import merge_extra_published
          from global_entities import merge_global_entities
          rows=merge_global_entities(merge_extra_published(merge_published_sources(load_payload()))).get('records',[])
          targets=('주문진곰치국','컴온','우사','광화문아띠','설가온')
          for r in rows:
              s=' '.join(str(x or '') for x in (r.get('name'),(r.get('business') or {}).get('display')))
              if any(t in s for t in targets):
                  print('TARGET',json.dumps({
                    'name':r.get('name'),'display':(r.get('business') or {}).get('display'),
                    'address':r.get('address'),'origins':r.get('origins'),'institutions':r.get('institutions'),
                    'cross':r.get('cross_institution'),'source_keys':r.get('source_keys')
                  },ensure_ascii=False))
          PY
      - name: Build site
        run: python pipeline/build_site.py --output dist/index.html
      - name: Syntax
        run: node --check site/app.js
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/ed-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/ed-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/ed-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
