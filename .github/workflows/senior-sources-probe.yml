name: Senior education police source probe
on:
  push:
    branches: [feat/senior-role-source-probes]
    paths:
      - 'pipeline/probe_education_police.py'
      - '.github/workflows/senior-sources-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/probe_education_police.py
