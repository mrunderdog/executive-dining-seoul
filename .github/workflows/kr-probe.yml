name: KR source probe

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_kr.py'
      - '.github/workflows/kr-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe KR disclosure
        run: python pipeline/probe_kr.py
