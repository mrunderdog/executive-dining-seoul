name: Signal intelligence reports

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/build_signal_reports.py'
      - 'pipeline/global_entities.py'
      - 'pipeline/extra_published.py'
      - 'pipeline/published_sources.py'
      - 'reports/*-executive-candidates.json'
      - 'reports/*-province-candidates.json'
      - 'reports/national-legislator-map-qa.json'
      - 'reports/education-police-approved-venues.json'
      - 'sources/entity_bridge_overrides.json'
      - '.github/workflows/signal-intelligence.yml'
  workflow_run:
    workflows:
      - Capital council expense ingestion
      - Rebuild council candidates
      - Central + National refresh
      - Regional executive refresh
      - Publish verified education dining transactions
      - Monthly data refresh
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-intelligence-reports
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build signal intelligence reports
        run: python pipeline/build_signal_reports.py

      - name: Commit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/signal-intelligence.json reports/signal-intelligence.md
          if git diff --cached --quiet; then
            echo "Signal reports unchanged."
            exit 0
          fi
          git commit -m "data: refresh signal intelligence reports"
          # Coordinate cache and report builders may race on main.
          # Retry only after rebasing the report-only commit against fresh main.
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict; stop rather than overwrite another report."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Signal report committed on attempt $ATTEMPT"
              exit 0
            fi
            echo "Remote main advanced during push (attempt $ATTEMPT/5)."
            sleep 2
          done
          echo "Could not publish signal reports after five attempts."
          exit 1
