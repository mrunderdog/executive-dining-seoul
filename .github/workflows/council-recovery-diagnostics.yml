name: Council recovery targeted diagnostics
on:
  pull_request:
    paths:
      - 'pipeline/ingest_council_expense.py'
      - 'pipeline/capital_backfill.py'
      - 'pipeline/test_council_recovery.py'
      - 'pipeline/probe_council_board_markup.py'
      - '.github/workflows/council-recovery-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify safe attachment handling
        run: PYTHONPATH=pipeline python -m unittest -v test_council_recovery
      - name: Capture real board click and download markup
        shell: bash
        run: |
          set +e
          mkdir -p reports/recovery
          python pipeline/probe_council_board_markup.py \
            --source hwaseong --source ansan --source icheon --source dongducheon \
            > reports/recovery/board-markup.log 2>&1
          PROBE_RC=$?
          cat reports/recovery/board-markup.log
          echo "Probe exit: $PROBE_RC"
      - name: Discover targeted councils without publishing
        shell: bash
        run: |
          mkdir -p reports/recovery
          for SOURCE in hwaseong ansan icheon dongducheon; do
            echo "### $SOURCE ###"
            python pipeline/capital_backfill.py --since 2026-07 --source "$SOURCE" >"reports/recovery/$SOURCE.log" 2>&1 || true
            cat "reports/recovery/$SOURCE.log"
            python - "$SOURCE" <<'PY'
          import json,sys
          from pathlib import Path
          key=sys.argv[1]
          p=Path(f'reports/capital-backfill-discovery-{key}.json')
          if p.exists():
              data=json.loads(p.read_text(encoding='utf-8'))
              posts=[x for x in data.get('posts',[]) if x.get('post_url')]
              atts=[a for x in posts for a in x.get('attachments',[]) if a.get('url')]
              print(f'{key}: posts={len(posts)}, attachments={len(atts)}')
              Path(f'reports/recovery/{key}.json').write_text(json.dumps({'posts':len(posts),'attachments':len(atts),'sample_posts':posts[:3]},ensure_ascii=False,indent=2))
          PY
          done
      - name: Install parsers for real transaction QA
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Trial ingest each source into ephemeral runner only
        shell: bash
        run: |
          set +e
          for SOURCE in hwaseong ansan icheon dongducheon; do
            echo "### trial ingest $SOURCE ###"
            python pipeline/ingest_council_expense.py --source "$SOURCE" >"reports/recovery/$SOURCE-ingest.log" 2>&1
            INGEST_RC=$?
            if [[ $INGEST_RC -ne 0 ]]; then
              echo "$SOURCE: INGEST_FAIL (exit $INGEST_RC)"
              tail -15 "reports/recovery/$SOURCE-ingest.log"
              continue
            fi
            python pipeline/repair_raw_dates.py --source "$SOURCE" --min-valid 0.95 >"reports/recovery/$SOURCE-dates.log" 2>&1
            DATE_RC=$?
            python - "$SOURCE" "$DATE_RC" <<'PY'
          import json,sys
          from pathlib import Path
          source=sys.argv[1];date_rc=int(sys.argv[2])
          raw=Path(f"data/raw/{source}_expense.json")
          obj=json.loads(raw.read_text(encoding="utf-8"))
          rows=obj.get("rows",[])
          usable=[x for x in rows if isinstance(x.get("amount"),(int,float)) and x["amount"]>0 and x.get("merchant") and x.get("used_date")]
          ratio=len(usable)/len(rows) if rows else 0
          outcome={"source":source,"rows":len(rows),"verified_amount_and_date_rows":len(usable),"amount_date_coverage":round(ratio,4),"date_QA_exit":date_rc,"can_publish": bool(rows and date_rc==0 and ratio>=0.95)}
          print(json.dumps(outcome,ensure_ascii=False))
          Path(f"reports/recovery/{source}-quality.json").write_text(json.dumps(outcome,ensure_ascii=False,indent=2))
          PY
          done
          # Diagnostic only. Neither raw records nor public site are committed.
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-recovery-diagnostics
          path: reports/recovery/
          retention-days: 7
