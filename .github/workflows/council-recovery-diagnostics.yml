name: Council recovery targeted diagnostics
on:
  pull_request:
    paths:
      - 'pipeline/ingest_council_expense.py'
      - 'pipeline/capital_backfill.py'
      - 'pipeline/test_council_recovery.py'
      - 'pipeline/test_full_reconciliation_p0.py'
      - 'pipeline/guard_full_council.py'
      - 'pipeline/qa_council_publication.py'
      - 'pipeline/probe_council_board_markup.py'
      - '.github/workflows/council-recovery-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify safe attachment handling
        run: PYTHONPATH=pipeline python -m unittest -v test_council_recovery test_full_reconciliation_p0
      - name: Capture real board click and download markup
        shell: bash
        run: |
          set +e
          mkdir -p reports/recovery
          python pipeline/probe_council_board_markup.py \
            --source hwaseong --source ansan --source icheon --source dongducheon \
            > reports/recovery/board-markup.log 2>&1
          PROBE_RC=$?
          cat reports/recovery/board-markup.log
          echo "Probe exit: $PROBE_RC"
      - name: Discover targeted councils without publishing
        shell: bash
        run: |
          mkdir -p reports/recovery
          for SOURCE in hwaseong ansan icheon dongducheon; do
            echo "### $SOURCE ###"
            python pipeline/capital_backfill.py --since 2026-07 --source "$SOURCE" >"reports/recovery/$SOURCE.log" 2>&1 || true
            cat "reports/recovery/$SOURCE.log"
            python - "$SOURCE" <<'PY'
          import json,sys
          from pathlib import Path
          key=sys.argv[1]
          p=Path(f'reports/capital-backfill-discovery-{key}.json')
          if p.exists():
              data=json.loads(p.read_text(encoding='utf-8'))
              posts=[x for x in data.get('posts',[]) if x.get('post_url')]
              atts=[a for x in posts for a in x.get('attachments',[]) if a.get('url')]
              print(f'{key}: posts={len(posts)}, attachments={len(atts)}')
              Path(f'reports/recovery/{key}.json').write_text(json.dumps({'posts':len(posts),'attachments':len(atts),'sample_posts':posts[:3]},ensure_ascii=False,indent=2))
          PY
          done
      - name: Install parsers for real transaction QA
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1
      - name: Trial ingest each source into ephemeral runner only
        shell: bash
        run: |
          set +e
          for SOURCE in hwaseong ansan icheon dongducheon; do
            echo "### trial ingest $SOURCE ###"
            python pipeline/ingest_council_expense.py --source "$SOURCE" >"reports/recovery/$SOURCE-ingest.log" 2>&1
            INGEST_RC=$?
            if [[ $INGEST_RC -ne 0 ]]; then
              echo "$SOURCE: INGEST_FAIL (exit $INGEST_RC)"
              tail -15 "reports/recovery/$SOURCE-ingest.log"
              continue
            fi
            python pipeline/repair_raw_dates.py --source "$SOURCE" --min-valid 1.0 >"reports/recovery/$SOURCE-dates.log" 2>&1
            DATE_RC=$?
            PYTHONPATH=pipeline python pipeline/qa_council_publication.py --source "$SOURCE" \
              >"reports/recovery/$SOURCE-quality.json" 2>&1
            QA_RC=$?
            if [[ $DATE_RC -ne 0 || $QA_RC -ne 0 ]]; then
              echo "$SOURCE: HOLD (date QA=$DATE_RC, strict lineage/date/amount QA=$QA_RC)"
            else
              echo "$SOURCE: PUBLISH_READY (100% official lineage/date/amount coverage)"
            fi
            cat "reports/recovery/$SOURCE-quality.json"
          done
          # Diagnostic only. Neither raw records nor public site are committed.
      - name: Inspect Icheon PDF table layout when ingestion is held
        if: always()
        shell: bash
        run: |
          PYTHONPATH=pipeline python - <<'PY'
          import json
          from pathlib import Path
          from ingest_council_expense import fetch_binary, workbook_rows

          path = Path('reports/capital-backfill-discovery-icheon.json')
          if not path.exists():
              print('No Icheon discovery to inspect.')
              raise SystemExit(0)
          posts = [p for p in json.loads(path.read_text(encoding='utf-8')).get('posts', [])
                   if p.get('post_url') and p.get('attachments')]
          samples = []
          for post in posts[:1]:
              for att in post['attachments'][:2]:
                  try:
                      blob = fetch_binary(att['url'], post['post_url'])
                      file_sample = {'title': att.get('text'), 'bytes': len(blob), 'pages': []}
                      for name, rows in workbook_rows(blob, att.get('text') or 'source.pdf'):
                          file_sample['pages'].append({
                              'name': name,
                              'total_extracted_lines': len(rows),
                              'first_lines': [[str(x)[:150] for x in row[:10]] for row in rows[:25]],
                          })
                          if len(file_sample['pages']) >= 2:
                              break
                      samples.append(file_sample)
                  except Exception as e:
                      samples.append({'title': att.get('text'), 'error': f'{type(e).__name__}: {e}'})
          output = Path('reports/recovery/icheon-pdf-layout.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(samples, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(samples, ensure_ascii=False, indent=2)[:12000])
          PY
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-recovery-diagnostics
          path: reports/recovery/
          retention-days: 7
