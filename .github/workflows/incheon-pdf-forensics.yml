name: Incheon Council official PDF forensics
on:
  pull_request:
    paths:
      - 'pipeline/audit_incheon_official_pdfs.py'
      - 'pipeline/ingest_council_expense.py'
      - 'pipeline/test_incheon_official_pdf.py'
      - 'pipeline/render_incheon_scanned_pdfs.py'
      - 'pipeline/incheon_scan_original_evidence.json'
      - 'pipeline/test_incheon_scanned_evidence.py'
      - 'pipeline/audit_incheon_compressed_archive.py'
      - 'pipeline/audit_incheon_release_scope.py'
      - 'pipeline/audit_incheon_incremental_stage.py'
      - 'pipeline/incheon_reparse_attestation.py'
      - 'pipeline/test_incheon_reparse_attestation.py'
      - 'pipeline/prepare_incheon_source_subset.py'
      - 'pipeline/incheon_official_2026_08_09_text_evidence.json'
      - 'pipeline/test_incheon_release_qa.py'
      - '.github/workflows/incheon-pdf-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-pdf-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and worksheet parsing
        run: python -m pip install 'pypdf>=5,<7' 'openpyxl>=3.1,<4' xlrd
      - name: Run original-source fixtures and preserve shared parser regressions
        run: |
          PYTHONPATH=pipeline python -m unittest -v pipeline/test_incheon_official_pdf.py
          PYTHONPATH=pipeline python -m unittest -v pipeline/test_incheon_scanned_evidence.py
          PYTHONPATH=pipeline python -m unittest -v pipeline/test_incheon_release_qa.py
          PYTHONPATH=pipeline python -m unittest -v pipeline/test_incheon_reparse_attestation.py
          PYTHONPATH=pipeline python -m unittest -v pipeline/test_p1_official_file_forensics.py
      - name: Preserve source files and inspect official PDFs (no publication)
        run: |
          python -m py_compile pipeline/audit_incheon_official_pdfs.py
          PYTHONPATH=pipeline python pipeline/audit_incheon_official_pdfs.py
      - name: Retain full source-page forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incheon-official-pdf-forensics
          path: reports/recovery/incheon-forensics
          if-no-files-found: warn
          retention-days: 14

  scanned-original-page-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install 'pymupdf>=1.24,<2' 'pypdf>=5,<7'
      - name: Render only SHA-matched official scanned PDFs
        run: PYTHONPATH=pipeline python pipeline/render_incheon_scanned_pdfs.py
      - name: Upload original image pages for manual evidence review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incheon-scanned-original-pages
          path: reports/recovery/incheon-scanned-pages/
          if-no-files-found: warn
          retention-days: 14

  compressed-1328-file-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit original compressed download file inventory
        run: PYTHONPATH=pipeline python pipeline/audit_incheon_compressed_archive.py
      - name: Upload exact ZIP member manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incheon-1328-archive-inventory
          path: reports/recovery/incheon-archive/
          if-no-files-found: warn
          retention-days: 14

  source-reconciliation:
    runs-on: ubuntu-latest
    needs: original-pdf-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download same-run official PDF forensic ledger
        uses: actions/download-artifact@v4
        with:
          name: incheon-official-pdf-forensics
          path: reports/recovery/incheon-forensics/
      - name: Independently reconcile source SHA, six PDF totals and immutable baseline
        run: PYTHONPATH=pipeline python pipeline/audit_incheon_release_scope.py
      - name: Upload explicit PASS/HOLD per source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incheon-source-reconciliation
          path: reports/recovery/incheon-source-reconciliation/
          if-no-files-found: warn
          retention-days: 14

  nonpublishing-incremental-strict-qa:
    runs-on: ubuntu-latest
    needs: [source-reconciliation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download same-run complete official PDF source rows
        uses: actions/download-artifact@v4
        with:
          name: incheon-official-pdf-forensics
          path: reports/recovery/incheon-forensics/
      - name: Trial 194+71 append-only source with Strict QA and Data Integrity
        run: PYTHONPATH=pipeline python pipeline/audit_incheon_incremental_stage.py
      - name: Upload publication HOLD evidence and exact failure reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incheon-append-only-qa-hold
          path: reports/recovery/incheon-incremental-qa/
          if-no-files-found: warn
          retention-days: 14

  source-only-subset-review:
    runs-on: ubuntu-latest
    needs: [nonpublishing-incremental-strict-qa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: incheon-official-pdf-forensics
          path: reports/recovery/incheon-forensics/
      - name: Prepare explicitly partial source-only package with 194 untouched legacy rows
        run: PYTHONPATH=pipeline python pipeline/prepare_incheon_source_subset.py
      - name: Upload immutable candidate, shadow attestations and quarantine manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incheon-265-row-source-subset-not-published
          path: reports/recovery/incheon-source-subset/
          if-no-files-found: warn
          retention-days: 14

  source-only-site-dryrun:
    runs-on: ubuntu-latest
    needs: [source-only-subset-review]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static site build dependency
        run: python -m pip install 'openpyxl>=3.1,<4' 'pypdf>=5,<7'
      - uses: actions/download-artifact@v4
        with:
          name: incheon-265-row-source-subset-not-published
          path: reports/recovery/incheon-source-subset/
      - name: Compare static website before and after nonranking source addition
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=data/raw/incheon_council_expense.json
          BASELINE_HASH="$(sha256sum "$SOURCE" | cut -d' ' -f1)"
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/proposed"
          python pipeline/build_site.py --output "$RUNNER_TEMP/baseline/index.html"
          cp "$SOURCE" "$RUNNER_TEMP/archived-incheon.json"
          trap 'cp "$RUNNER_TEMP/archived-incheon.json" data/raw/incheon_council_expense.json' EXIT
          cp reports/recovery/incheon-source-subset/incheon_council_expense.json "$SOURCE"
          python pipeline/build_site.py --output "$RUNNER_TEMP/proposed/index.html"
          python - <<'PY'
          import json, os
          from pathlib import Path
          top=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((top/'baseline/build-meta.json').read_text())
          after=json.loads((top/'proposed/build-meta.json').read_text())
          if before.get('dataset_total')!=after.get('dataset_total'):
              raise SystemExit(f"FAIL: changed publicly displayed entities {before.get('dataset_total')}->{after.get('dataset_total')}")
          b=(top/'baseline/index.html').read_bytes()
          a=(top/'proposed/index.html').read_bytes()
          if b!=a:
              raise SystemExit("FAIL: static HTML changed in supposedly financial-source-only release")
          print(json.dumps({'baseline_entities':before['dataset_total'],
                            'proposed_entities':after['dataset_total'],
                            'identical_html':True,'new_public_rankings':0,
                            'publish':False}))
          PY
          cp "$RUNNER_TEMP/archived-incheon.json" "$SOURCE"
          test "$(sha256sum "$SOURCE" | cut -d' ' -f1)" = "$BASELINE_HASH"
