name: PowerGen batch probe
on:
  push:
    branches: [feat/powergen-batch-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX parser
        run: pip install openpyxl==3.1.5
      - name: Discover ALIO codes and inspect 2025 workbooks
        run: |
          python - <<'PY'
          import io,re,json,time,urllib.request
          from openpyxl import load_workbook
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          targets=['한국중부발전','한국서부발전','한국남부발전','한국동서발전']
          found={}
          def fetch(url,timeout=30):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  raw=r.read(); cs=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(cs,errors='replace')
          # Scan a practical ALIO code window around KOEN C0042.
          for n in range(35,71):
              code=f'C{n:04d}'
              url=f'https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId={code}&disclosureNo=&reportFormRootNo=20701'
              try:
                  html=fetch(url)
              except Exception:
                  continue
              text=' '.join(re.sub(r'<[^>]+>',' ',html).split())
              hit=next((t for t in targets if t in text),None)
              if hit:
                  found[hit]=(code,url,html)
                  print('FOUND',hit,code)
              if len(found)==len(targets): break
          print('FOUND_MAP',json.dumps({k:v[0] for k,v in found.items()},ensure_ascii=False))
          for name in targets:
              if name not in found:
                  print('MISSING',name); continue
              code,page,html=found[name]
              dm=re.search(r'disclosureNo\s*:\s*"([^"]+)"',html) or re.search(r'\$submissionNo\s*=\s*"?([0-9]+)',html)
              opts=re.findall(r'<option\s+value="([^"]+)">\s*([^<]+\.(?:xlsx?|xls))\s*</option>',html,re.I)
              print('META',name,code,'DISCLOSURE',dm.group(1) if dm else None,'OPTS',json.dumps(opts,ensure_ascii=False))
              if not dm or not opts: continue
              target=next(((a,b) for a,b in opts if '2025' in b),None) or next(((a,b) for a,b in opts if '2024' in b),None)
              if not target: continue
              file_no,file_name=target
              blob=None
              for host in ['https://www.alio.go.kr','https://alio.go.kr']:
                  u=f'{host}/download/file.json?d={dm.group(1)}&f={file_no}'
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':ua,'Referer':page})
                      with urllib.request.urlopen(req,timeout=60) as r: blob=r.read()
                      break
                  except Exception as e:
                      print('FILE_ERR',name,u,type(e).__name__,e)
              if not blob:
                  continue
              wb=load_workbook(io.BytesIO(blob),data_only=True,read_only=True)
              print('WORKBOOK',name,file_name,'SHEETS',wb.sheetnames)
              for ws in wb.worksheets:
                  for i,row in enumerate(ws.iter_rows(values_only=True),1):
                      vals=['' if v is None else str(v) for v in row]
                      if any(x.strip() for x in vals): print('ROW',name,i,json.dumps(vals,ensure_ascii=False))
                      if i>=80: break
          PY
