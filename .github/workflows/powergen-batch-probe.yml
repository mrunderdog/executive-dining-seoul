name: PowerGen batch probe
on:
  push:
    branches: [feat/powergen-batch-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX parser
        run: pip install openpyxl==3.1.5
      - name: Discover ALIO codes and inspect 2025 workbooks
        run: |
          python - <<'PY'
          import io,re,json,urllib.request
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from openpyxl import load_workbook
          ua='Mozilla/5.0 ExecutiveDiningSeoul/2.1'
          targets=['한국중부발전','한국서부발전','한국남부발전','한국동서발전']
          def fetch_text(code):
              url=f'https://www.alio.go.kr/mobile/item/itemReportTerm.do?apbaId={code}&disclosureNo=&reportFormRootNo=20701'
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=12) as r:
                  raw=r.read(); cs=r.headers.get_content_charset() or 'utf-8'
              return code,url,raw.decode(cs,errors='replace')
          found={}
          codes=[f'C{n:04d}' for n in range(30,91)]
          with ThreadPoolExecutor(max_workers=12) as pool:
              futs={pool.submit(fetch_text,c):c for c in codes}
              for fut in as_completed(futs):
                  try: code,url,html=fut.result()
                  except Exception: continue
                  text=' '.join(re.sub(r'<[^>]+>',' ',html).split())
                  for name in targets:
                      if name in text and name not in found:
                          found[name]=(code,url,html)
                          print('FOUND',name,code)
          print('FOUND_MAP',json.dumps({k:v[0] for k,v in found.items()},ensure_ascii=False))
          def inspect(name,item):
              code,page,html=item
              dm=re.search(r'disclosureNo\s*:\s*"([^"]+)"',html) or re.search(r'\$submissionNo\s*=\s*"?([0-9]+)',html)
              opts=re.findall(r'<option\s+value="([^"]+)">\s*([^<]+\.(?:xlsx?|xls))\s*</option>',html,re.I)
              out=['META '+name+' '+code+' DISCLOSURE '+(dm.group(1) if dm else 'NONE')+' OPTS '+json.dumps(opts,ensure_ascii=False)]
              if not dm or not opts: return out
              target=next(((a,b) for a,b in opts if '2025' in b),None) or next(((a,b) for a,b in opts if '2024' in b),None)
              if not target: return out
              file_no,file_name=target
              blob=None
              for host in ['https://www.alio.go.kr','https://alio.go.kr']:
                  u=f'{host}/download/file.json?d={dm.group(1)}&f={file_no}'
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':ua,'Referer':page})
                      with urllib.request.urlopen(req,timeout=40) as r: blob=r.read()
                      break
                  except Exception as e: out.append(f'FILE_ERR {name} {type(e).__name__} {e}')
              if not blob: return out
              wb=load_workbook(io.BytesIO(blob),data_only=True,read_only=True)
              out.append('WORKBOOK '+name+' '+file_name+' SHEETS '+json.dumps(wb.sheetnames,ensure_ascii=False))
              for ws in wb.worksheets:
                  for i,row in enumerate(ws.iter_rows(values_only=True),1):
                      vals=['' if v is None else str(v) for v in row]
                      if any(x.strip() for x in vals): out.append('ROW '+name+' '+str(i)+' '+json.dumps(vals,ensure_ascii=False))
                      if i>=80: break
              return out
          with ThreadPoolExecutor(max_workers=4) as pool:
              futs={pool.submit(inspect,n,v):n for n,v in found.items()}
              for fut in as_completed(futs):
                  for line in fut.result(): print(line)
          for name in targets:
              if name not in found: print('MISSING',name)
          PY
