name: HUG PDF probe
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/hug_pdf_probe.py'
      - '.github/workflows/hug-pdf-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pypdf==6.1.1
      - run: python pipeline/hug_pdf_probe.py
