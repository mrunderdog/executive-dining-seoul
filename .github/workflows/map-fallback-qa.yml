name: Map fallback QA

on:
  pull_request:
    paths:
      - 'site/**'
      - 'pipeline/browser_no_webgl_smoke.mjs'
      - '.github/workflows/map-fallback-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static runtime and data quality
        run: |
          set -euo pipefail
          node --check site/app.js
          node --check pipeline/browser_no_webgl_smoke.mjs
          PYTHONPATH=pipeline python -m unittest -v pipeline/test_inline_json_safety.py
          python pipeline/build_site.py --output dist/index.html
          python pipeline/quality_gate.py >/tmp/dining-quality-result.json
      - name: Verify search and detail work without WebGL
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/dining-fallback-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-webgl \
            --remote-debugging-port=9222 --user-data-dir=/tmp/dining-fallback-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/dining-fallback-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          if ! node pipeline/browser_no_webgl_smoke.mjs; then
            tail -120 /tmp/dining-fallback-chrome.log || true
            tail -80 /tmp/dining-fallback-http.log || true
            exit 1
          fi
