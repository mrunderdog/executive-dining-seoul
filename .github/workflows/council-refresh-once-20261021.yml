name: One-time verified council refresh (2026-10-21)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/council-refresh-once-20261021.yml'

permissions:
  actions: write

jobs:
  dispatch:
    if: github.repository == 'mrunderdog/executive-dining-seoul'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing strict-QA council ingestion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run goyang-ingest.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "One-time dispatch submitted. Existing strict publication QA remains active."
