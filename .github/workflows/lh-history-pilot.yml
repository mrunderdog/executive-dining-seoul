name: LH history pilot

on:
  push:
    branches:
      - feat/lh-history-ingest

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Discover
        run: python pipeline/public_enterprise_discovery.py --year 2026 --detail-limit 60
      - name: Ingest
        run: python pipeline/ingest_public_enterprise_expense.py
      - name: Build candidates
        run: python pipeline/build_public_enterprise_candidates.py
      - name: Inspect LH
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          disc=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          raw=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          cand=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          lh=next(x for x in disc['sources'] if x['key']=='lh')
          rows=[x for x in raw.get('rows',[]) if x.get('institution')=='한국토지주택공사']
          cands=[x for x in cand.get('candidates',[]) if '한국토지주택공사' in (x.get('institutions') or [])]
          print('LH_DISCOVERY',json.dumps({'status':lh.get('status'),'years':lh.get('years'),'files':len(lh.get('attachments') or []),'sample':(lh.get('attachments') or [])[:12]},ensure_ascii=False))
          print('LH_RAW',json.dumps({'rows':len(rows),'sample':rows[:30]},ensure_ascii=False))
          print('LH_CANDIDATES',json.dumps({'count':len(cands),'items':cands[:30]},ensure_ascii=False))
          if len(lh.get('attachments') or []) < 4:
              raise SystemExit('LH history discovery too shallow')
          if not rows:
              raise SystemExit('LH rows missing')
          if not cands:
              raise SystemExit('LH dining candidates missing')
          if any(x.get('merchant') in {'구내복지센터','구내복지'} for x in cands):
              raise SystemExit('internal LH welfare venue leaked into candidates')
          PY
      - name: Geocode and build
        run: |
          python pipeline/geocode_extra_cache.py
          python pipeline/build_site.py --output dist/index.html
          python pipeline/regression_checks.py
          node --check site/app.js
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8765 --directory dist >/tmp/lh-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --user-data-dir=/tmp/lh-chrome \
            --window-size=1440,900 http://127.0.0.1:8765/ >/tmp/lh-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node pipeline/browser_map_smoke.mjs
      - name: Commit pilot baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/public_enterprise_expense.json reports/public-enterprise-* data/geocode_cache.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add LH institution-head dining baseline"
          git push origin HEAD:feat/lh-history-ingest
