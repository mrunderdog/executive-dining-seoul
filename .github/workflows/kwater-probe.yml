name: K-water adapter probe
on:
  push:
    branches: [feat/kwater-adapter]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe K-water head expense pages
        run: |
          python - <<'PY'
          import re, urllib.request, html
          for year,page in [(2024,16),(2025,17),(2026,18)]:
              url=f'https://www.kwater.or.kr/water/sub02/sub02/head/head{page:02d}Page.do'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      doc=r.read().decode(r.headers.get_content_charset() or 'utf-8','replace')
              except Exception as e:
                  print('FETCH_FAIL',year,url,type(e).__name__,str(e));continue
              title=' '.join(re.sub('<[^>]+>',' ',re.search(r'<title>(.*?)</title>',doc,re.I|re.S).group(1) if re.search(r'<title>(.*?)</title>',doc,re.I|re.S) else '').split())
              print('PAGE',year,'bytes',len(doc),'title',title)
              m=re.search(fr'{year}년\s*세부집행내역',doc,re.I)
              print('YEAR_MARKER',year,bool(m))
              tables=re.findall(r'<table\b.*?</table>',doc,re.I|re.S)
              print('TABLES',len(tables))
              for ti,tbl in enumerate(tables[:5]):
                  rows=re.findall(r'<tr\b.*?</tr>',tbl,re.I|re.S)
                  print('TABLE',ti,'ROWS',len(rows))
                  for ri,row in enumerate(rows[:12]):
                      cells=[]
                      for cell in re.findall(r'<t[hd]\b.*?</t[hd]>',row,re.I|re.S):
                          s=html.unescape(re.sub(r'<[^>]+>',' ',cell))
                          s=' '.join(s.split())
                          cells.append(s)
                      if cells: print('ROW',year,ti,ri,cells)
          PY
