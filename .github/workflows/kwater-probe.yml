name: K-water adapter QA
on:
  push:
    branches: [feat/kwater-adapter]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parsers
        run: pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.2 pypdf==6.1.1 --pre pyhwp six
      - name: Run public-enterprise pipeline
        run: |
          python -m py_compile pipeline/public_enterprise_discovery.py pipeline/ingest_public_enterprise_expense.py
          python pipeline/public_enterprise_discovery.py --year 2026 --incremental --detail-limit 24
          python pipeline/ingest_public_enterprise_expense.py --incremental
          python pipeline/build_public_enterprise_candidates.py
      - name: Inspect K-water
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/public-enterprise-discovery.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/raw/public_enterprise_expense.json').read_text(encoding='utf-8'))
          c=json.loads(Path('reports/public-enterprise-candidates.json').read_text(encoding='utf-8'))
          s=next(x for x in d['sources'] if x['key']=='kwater')
          rows=[x for x in r.get('rows',[]) if x.get('institution')=='한국수자원공사']
          cs=[x for x in c.get('candidates',[]) if '한국수자원공사' in (x.get('institutions') or [])]
          print('KWATER_DISCOVERY',json.dumps({'status':s.get('status'),'pages':s.get('pages'),'inline_rows':len(s.get('inline_rows') or [])},ensure_ascii=False))
          print('KWATER_ROWS',json.dumps(rows,ensure_ascii=False))
          print('KWATER_CANDIDATES',json.dumps(cs,ensure_ascii=False))
          assert s.get('status')=='PARSEABLE_FOUND'
          assert len(s.get('inline_rows') or [])>=5
          assert rows
          assert cs
          PY
      - name: Regression
        run: python pipeline/regression_checks.py
