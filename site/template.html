<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Dining Map v5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

html,body{height:100%;margin:0;overflow:hidden;font-family:Arial,"Malgun Gothic",sans-serif;color:#101828;background:#f2f4f7}*{box-sizing:border-box}.head{height:84px;background:#101828;color:#fff;padding:12px 15px}.head h1{font-size:21px;margin:0 0 5px}.head p{font-size:12px;color:#d0d5dd;margin:0}.app{height:calc(100vh - 84px);display:grid;grid-template-columns:350px minmax(430px,1fr) 430px}.side,.detail{background:#fff;min-height:0}.side{display:flex;flex-direction:column;border-right:1px solid #d0d5dd}.detail{overflow:auto;border-left:1px solid #d0d5dd;padding:15px}.ctrl{padding:11px;border-bottom:1px solid #eaecf0;display:grid;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:11px;font-weight:700;color:#475467;margin-bottom:4px}select,input{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:8px}.summary{padding:9px 11px;font-size:12px;color:#475467;border-bottom:1px solid #eaecf0;line-height:1.45}.list{flex:1;overflow:auto;padding:8px}.card{border:1px solid #e4e7ec;border-radius:11px;padding:9px;margin-bottom:7px;cursor:pointer}.card:hover{border-color:#98a2b3}.card.active{border:2px solid #2563eb;background:#eff6ff}.card h3{font-size:15px;margin:0 0 5px}.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;margin-right:3px}.both{background:#efe7ff;color:#6d28d9}.destination{background:#fee2e2;color:#be123c}.executive{background:#dbeafe;color:#1d4ed8}.cat{background:#f2f4f7;color:#344054}.meta{font-size:11px;color:#475467;line-height:1.45;margin-top:5px}.mapbox{position:relative;min-height:0}#map{width:100%;height:100%}.status{position:absolute;top:10px;right:10px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid #e4e7ec;border-radius:10px;padding:8px 10px;max-width:250px;font-size:11px;box-shadow:0 3px 15px #0002}.status button{width:100%;margin-top:6px;padding:6px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;font-weight:700}.marker{width:17px;height:17px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px #0006}.marker.destination{background:#e11d48}.marker.executive{background:#2563eb}.marker.both{background:#7c3aed}.marker.sel{width:25px;height:25px;border:4px solid #111827;box-shadow:0 0 0 4px #ffff,0 2px 10px #0008}.leaflet-tooltip.lbl,.leaflet-tooltip.hover{background:#ffff;border:1px solid #cbd5e1;border-radius:6px;color:#101828;padding:4px 6px;box-shadow:0 1px 5px #0002;font-size:11px}.leaflet-tooltip.lbl{font-weight:700}.detail h2{margin:0;font-size:21px}.category{margin:5px 0 12px;font-size:13px;font-weight:700;color:#475467}.reason{padding:10px;border:1px solid #fed7aa;background:#fff7ed;border-radius:9px;font-size:12px;line-height:1.5;color:#7c2d12}.sec{border-top:1px solid #eaecf0;margin-top:12px;padding-top:11px}.sec h3{font-size:14px;margin:0 0 8px}.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 8px;font-size:12px;line-height:1.45}.k{font-weight:700;color:#344054}.role,.visit{padding:6px 0;border-bottom:1px dashed #eaecf0;font-size:11px;line-height:1.45}.role{display:flex;justify-content:space-between;gap:8px}.btn{display:inline-block;margin:7px 5px 0 0;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;text-decoration:none;color:#101828;font-size:11px;font-weight:700}.popup{font-size:12px;line-height:1.45}.popup h3{margin:0 0 5px;font-size:16px}.popup .why{padding:6px;background:#fff7ed;border-radius:6px;margin:5px 0}.note{font-size:10px;color:#667085;line-height:1.4;margin-top:8px}@media(max-width:1200px){.app{grid-template-columns:320px 1fr}.detail{position:absolute;right:0;top:84px;bottom:0;width:390px;z-index:1200;box-shadow:-8px 0 24px #0002}}
</style></head><body><div class="head"><h1>서울 공무원 Executive Dining 지도 v5</h1><p>식당을 클릭하면 지도는 움직인 위치를 유지합니다. 오른쪽에 업체 정보, 선정 이유, 방문 공무원·횟수·집행액과 원자료 방문내역을 표시합니다.</p></div><div class="app"><aside class="side"><div class="ctrl"><div class="g2"><div><label>표시 범주</label><select id="ds"><option value="all">전체</option><option value="both">둘 다</option><option value="destination">Destination VIP</option><option value="executive">Executive Repeat</option></select></div><div><label>출발 구</label><select id="origin"></select></div></div><div><label>업소 / 주소 / 업종 검색</label><input id="q" placeholder="예: 한도니, 갈비, 중랑구"></div></div><div class="summary" id="sum"></div><div class="list" id="list"></div></aside><main class="mapbox"><div id="map"></div><div class="status"><b>지도/좌표 상태</b><div id="prog">준비 중…</div><button id="fit">현재 필터 전체 보기</button><div class="note">줌 15 이상에서 식당명이 상시 표시됩니다. 선택한 식당은 이름+주소를 지도 위에 유지합니다.</div></div></main><aside class="detail" id="detail"><h2>식당을 선택하세요</h2><div class="category">마커 또는 왼쪽 식당 목록을 클릭하세요.</div></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script>
const DATA=__DATA__, STATS=__STATS__, ORIGINS=__ORIGINS__;
const map=L.map('map').setView([37.5665,126.978],11),carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'&copy; OSM &copy; CARTO'}),esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});carto.addTo(map);L.control.layers({'CARTO Voyager':carto,'Esri 도로지도':esri},{},{position:'bottomright'}).addTo(map);const cluster=L.markerClusterGroup({disableClusteringAtZoom:15,maxClusterRadius:38,showCoverageOnHover:false});map.addLayer(cluster);
const ds=document.getElementById('ds'),ori=document.getElementById('origin'),q=document.getElementById('q'),list=document.getElementById('list'),detail=document.getElementById('detail'),sum=document.getElementById('sum'),prog=document.getElementById('prog');['전체',...ORIGINS].forEach(o=>{let x=document.createElement('option');x.value=o==='전체'?'all':o;x.textContent=o;ori.appendChild(x)});const ck='execDiningGeo_v5b',geo=JSON.parse(localStorage.getItem(ck)||'{}');let current=[],markers={},selected=null;
function esc(s){return (s??'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function won(n){return Number(n||0).toLocaleString('ko-KR')+'원'}function pct(v){return Math.round(Number(v||0)*100)+'%'}function key(r){return r.name+'|'+r.origin}function url(r){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.search_query)}
function pass(r){let d=ds.value,o=ori.value,s=q.value.trim().toLowerCase();if(d==='both'&&r.type!=='both')return false;if(d==='destination'&&!r.destination)return false;if(d==='executive'&&!r.executive)return false;if(o!=='all'&&r.origin!==o)return false;if(s&&!([r.name,r.address,r.origin,r.business.category,r.why].join(' ').toLowerCase().includes(s)))return false;return true}
function ico(r,sel=false){return L.divIcon({className:'',html:`<div class="marker ${r.type}${sel?' sel':''}"></div>`,iconSize:sel?[25,25]:[17,17],iconAnchor:sel?[12,12]:[8,8]})}
function popup(r){let e=r.evidence,roles=e.roles.slice(0,4).map(x=>`${esc(x.role)} ${x.visits}회`).join(' · ');return `<div class="popup"><h3>${esc(r.business.display)}</h3><b>${esc(r.business.category)}</b><br>${esc(r.address||'주소 확인 필요')}<div class="why"><b>선정 이유</b><br>${esc(r.why)}</div><b>원자료:</b> ${e.visits}회 · 총 ${won(e.spend)} · ${e.people}명<br><b>직책:</b> ${roles||'-'}<br><a href="${url(r)}" target="_blank">Google Maps</a></div>`}
function renderDetail(r){if(!r){detail.innerHTML='<h2>식당을 선택하세요</h2><div class="category">마커 또는 왼쪽 식당 목록을 클릭하세요.</div>';return}let e=r.evidence,b=r.business,roles=e.roles.map(x=>`<div class="role"><span><b>${esc(x.role)}</b> · ${x.visits}회 · ${x.people}명</span><span>${won(x.spend)}</span></div>`).join(''),pur=e.purposes.map(x=>`<div class="visit">${esc(x.text)} <b>× ${x.count}</b></div>`).join(''),vis=e.recent.map(x=>`<div class="visit"><b>${esc(x.date)} ${esc(x.time)}</b> · ${esc(x.role)} · ${x.people}명 · ${won(x.amount)}<br>${esc(x.purpose)}</div>`).join('');let score='';if(r.destination)score+=`<div class="kv"><div class="k">Destination VIP</div><div>#${r.destination.rank} · ${r.destination.score}점 · ${esc(r.destination.distance)}</div></div>`;if(r.executive)score+=`<div class="kv"><div class="k">Executive Repeat</div><div>#${r.executive.rank} · ${r.executive.score}점 · 의장/부의장 ${r.executive.chairvice}회</div></div>`;detail.innerHTML=`<h2>${esc(b.display)}</h2><div class="category">${esc(b.category)} <span style="font-weight:400;color:#98a2b3">(${esc(b.category_source)})</span></div><div class="reason"><b>왜 선정됐나</b><br>${esc(r.why)}</div><div class="sec"><h3>업체 정보</h3><div class="kv"><div class="k">주소</div><div>${esc(r.address||'주소 확인 필요')}</div><div class="k">전화</div><div>${esc(b.phone||'-')}</div><div class="k">현재 업소</div><div>${esc(b.status||'자동 확인 미실시')}</div><div class="k">평점</div><div>${esc(b.rating||'-')}</div><div class="k">메모</div><div>${esc(b.note||'-')}</div></div><a class="btn" href="${url(r)}" target="_blank">Google Maps 확인</a>${b.url?`<a class="btn" href="${esc(b.url)}" target="_blank">업체 정보 출처</a>`:''}</div><div class="sec"><h3>선정 점수</h3>${score}</div><div class="sec"><h3>업무추진비 원자료 합계</h3><div class="kv"><div class="k">방문 횟수</div><div><b>${e.visits}회</b> · ${e.months}개월</div><div class="k">총 집행액</div><div><b>${won(e.spend)}</b></div><div class="k">총 참석인원</div><div>${e.people}명</div><div class="k">가중 1인당</div><div>${won(e.ppc)}</div><div class="k">저녁 방문</div><div>${e.evening}/${e.visits}회 (${pct(e.evening_ratio)})</div><div class="k">기간</div><div>${esc(e.date_min)} ~ ${esc(e.date_max)}</div></div></div><div class="sec"><h3>어떤 공무원들이 갔나</h3>${roles||'<div class="visit">원자료 없음</div>'}</div><div class="sec"><h3>주요 집행 목적</h3>${pur||'-'}</div><div class="sec"><h3>최근 방문 원자료 (최대 8건)</h3>${vis||'-'}</div><div class="note">※ 맛 평점이 아니라 반복 방문·고위직·관외 이동 등 ‘선택 패턴’을 찾는 탐색 랭킹입니다.</div>`}
function add(r,lat,lon){let k=key(r),m=L.marker([lat,lon],{icon:ico(r,k===selected),title:r.name});m.bindPopup(popup(r),{maxWidth:360});m.on('mouseover',()=>{if(map.getZoom()<15)m.bindTooltip(`<b>${esc(r.business.display)}</b><br>${esc(r.address||'주소 확인 필요')}`,{permanent:false,direction:'top',className:'hover'}).openTooltip()});m.on('mouseout',()=>{if(map.getZoom()<15)m.closeTooltip()});m.on('click',()=>{selected=k;renderDetail(r);highlight();refreshIcons();m.unbindTooltip();m.bindTooltip(`<b>${esc(r.business.display)}</b><br><span style="font-weight:400">${esc(r.address||'주소 확인 필요')}</span>`,{permanent:true,direction:'top',offset:[0,-10],className:'lbl'}).openTooltip();});markers[k]=m;cluster.addLayer(m)}
function refreshIcons(){for(const r of current){let m=markers[key(r)];if(m)m.setIcon(ico(r,key(r)===selected))}}function labels(){let sh=map.getZoom()>=15;for(const r of current){let m=markers[key(r)];if(!m)continue;if(key(r)===selected)continue;m.unbindTooltip();if(sh)m.bindTooltip(`<b>${esc(r.business.display)}</b>`,{permanent:true,direction:'top',offset:[0,-8],className:'lbl'})}}map.on('zoomend',labels);
function renderMarkers(fit=false){cluster.clearLayers();markers={};let b=[];for(const r of current){let g=geo[key(r)];if(g?.lat){add(r,g.lat,g.lon);b.push([g.lat,g.lon])}}if(fit&&b.length)map.fitBounds(b,{padding:[28,28],maxZoom:14});labels()}
function card(r){let e=r.evidence,rank=[r.destination?`D #${r.destination.rank}`:'',r.executive?`E #${r.executive.rank}`:''].filter(Boolean).join(' · ');return `<h3>${esc(r.business.display)}</h3><span class="badge ${r.type}">${r.type==='both'?'둘 다':r.type==='destination'?'Destination':'Executive'}</span><span class="badge cat">${esc(r.business.category)}</span><div class="meta"><b>${esc(r.origin)}</b> · ${rank}<br>${esc(r.address||'주소 확인 필요')}<br><b>${e.visits}회 / ${won(e.spend)}</b> · 저녁 ${pct(e.evening_ratio)}</div>`}function highlight(){for(const c of list.querySelectorAll('.card'))c.classList.toggle('active',c.dataset.key===selected)}
function renderList(fit=true){current=DATA.filter(pass);sum.innerHTML=`고유 업소 <b>${STATS.total}</b> · Destination <b>${STATS.destination}</b> · Executive <b>${STATS.executive}</b> · 둘 다 <b>${STATS.both}</b><br>현재 필터 <b>${current.length}곳</b>`;list.innerHTML='';for(const r of current){let c=document.createElement('div');c.className='card'+(key(r)===selected?' active':'');c.dataset.key=key(r);c.innerHTML=card(r);c.onclick=()=>{selected=key(r);renderDetail(r);highlight();refreshIcons();let m=markers[selected];if(m)cluster.zoomToShowLayer(m,()=>{map.flyTo(m.getLatLng(),Math.max(map.getZoom(),16),{duration:.4});setTimeout(()=>{m.openPopup();m.unbindTooltip();m.bindTooltip(`<b>${esc(r.business.display)}</b><br><span style="font-weight:400">${esc(r.address||'주소 확인 필요')}</span>`,{permanent:true,direction:'top',offset:[0,-10],className:'lbl'}).openTooltip()},430)});/* sidebar/page auto-scroll intentionally disabled */};list.appendChild(c)}if(fit)renderMarkers(true)}
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function geocode(r){let k=key(r);if(geo[k]?.lat)return geo[k];for(const s of [...new Set([r.address,r.search_query,`${r.business.display} ${r.origin} 대한민국`].filter(Boolean))]){try{let p=new URLSearchParams({SingleLine:s,f:'json',countryCode:'KOR',maxLocations:'1'}),res=await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?'+p);if(!res.ok)continue;let o=await res.json(),c=o?.candidates?.[0];if(c?.location){geo[k]={lat:+c.location.y,lon:+c.location.x};localStorage.setItem(ck,JSON.stringify(geo));return geo[k]}}catch(e){}await sleep(120)}geo[k]={failed:true};localStorage.setItem(ck,JSON.stringify(geo));return null}async function allgeo(){let done=0,ok=0,fail=0;for(const r of DATA){let g=geo[key(r)];if(g&&(g.lat||g.failed)){done++;g.lat?ok++:fail++}}prog.textContent=`캐시 ${done}/${DATA.length} · 성공 ${ok} · 실패 ${fail}`;renderMarkers(false);for(const r of DATA){let k=key(r);if(geo[k]&&(geo[k].lat||geo[k].failed))continue;prog.textContent=`좌표 확인 ${done}/${DATA.length} · ${r.name}`;let g=await geocode(r);done++;g?.lat?ok++:fail++;renderMarkers(false);await sleep(130)}prog.textContent=`완료: ${DATA.length}곳 중 성공 ${ok} / 실패 ${fail}`}
ds.onchange=ori.onchange=()=>{selected=null;renderDetail(null);renderList(true)};q.oninput=()=>{selected=null;renderDetail(null);renderList(true)};document.getElementById('fit').onclick=()=>renderMarkers(true);[carto,esri].forEach(l=>l.on('tileerror',()=>prog.textContent='지도 타일 일부 실패: 우하단에서 다른 베이스맵으로 바꿔보세요.'));renderList(true);allgeo();
</script></body></html>
